egítima defesa do agente de segurança pública e limite de 40 anos de cumprimento de pena.","incidencia":"media"}]},{"id":"penal_militar","nome":"Direito Penal Militar","dicas":["Estude com o CPM aberto e leia a lei seca logo depois da videoaula. A banca costuma copiar o artigo e trocar uma palavra ou um número.","O art. 9 é o ponto que mais cai: saiba os incisos e a ampliação feita pela Lei 13.491/2017. Crime doloso contra a vida de civil cometido por PM vai para o júri, e a Justiça Militar estadual nunca julga civil.","Compare cada regra com o Código Penal comum, porque a pegadinha é aplicar o CP ao CPM. Na tentativa o juiz pode aplicar a pena do consumado em caso de excepcional gravidade, e no crime continuado as penas são unificadas, sem o aumento de um sexto a dois terços do CP.","O CPM tem estado de necessidade justificante, que exclui o crime, e exculpante, que exclui a culpabilidade. No exculpante o bem sacrificado pode valer mais que o protegido; no justificante o mal causado precisa ser bem menor que o evitado.","Na obediência hierárquica só o superior responde quando a ordem não era manifestamente criminosa. Se a ordem era manifestamente criminosa, ou se houve excesso na execução, o subordinado também é punido.","Monte uma tabela com o verbo de cada crime. Concussão é exigir, corrupção passiva no CPM é receber ou aceitar promessa, sem o verbo solicitar, e motim vira revolta quando os agentes estão armados.","Decore as vedações do sursis no CPM. Em tempo de paz ele não cabe, entre outros, na deserção, na insubordinação, no desrespeito a superior e na violência contra superior.","Na prescrição, guarde as regras especiais. Na deserção a punibilidade só se extingue quando o desertor completa 45 anos, ou 60 se oficial, e na insubmissão o prazo só começa a correr aos 30 anos."],"assuntos":[{"id":"penal_militar-aplicacao-da-lei","titulo":"Aplicação da lei penal militar","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-02","pmdf-penal_militar-01"],"foco":"Tempo do crime pela atividade, lugar do crime pela ubiquidade com regra própria para os omissivos, extraterritorialidade incondicionada e quem a lei considera militar.","incidencia":"media"},{"id":"penal_militar-crime-militar-art-9","titulo":"Crime militar em tempo de paz (art. 9) e classificação","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-02","pmdf-penal_militar-01","pmgo-penal_militar-11","pmdf-penal_militar-14","pmdf-penal_militar-15","pmdf-penal_militar-16"],"foco":"Hipóteses do art. 9, crimes da legislação penal comum incluídos pela Lei 13.491/2017, júri no crime doloso contra a vida de civil e diferença entre crime propriamente e impropriamente militar.","incidencia":"alta"},{"id":"penal_militar-tentativa-dolo-culpa-erro","titulo":"Crime: causalidade, tentativa, dolo, culpa e erro","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-03","pmdf-penal_militar-02"],"foco":"Tentativa com redução de um a dois terços e a exceção da excepcional gravidade, desistência voluntária, arrependimento eficaz, crime impossível e erro de direito, que não isenta de pena.","incidencia":"media"},{"id":"penal_militar-excludentes","titulo":"Crime: excludentes de ilicitude e de culpabilidade","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-03","pmdf-penal_militar-02"],"foco":"Estado de necessidade justificante e exculpante, obediência hierárquica, coação irresistível, legítima defesa e os excessos culposo, escusável e doloso.","incidencia":"alta"},{"id":"penal_militar-imputabilidade-concurso-de-agentes","titulo":"Imputabilidade penal e concurso de agentes","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-04","pmdf-penal_militar-03","pmgo-penal_militar-05","pmdf-penal_militar-04"],"foco":"Inimputabilidade por doença mental ou por embriaguez completa de caso fortuito ou força maior, redução de pena do semi-imputável e quem a lei considera cabeça no concurso de agentes.","incidencia":"media"},{"id":"penal_militar-penas-principais","titulo":"Penas principais","blocos":1,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-06","pmdf-penal_militar-05"],"foco":"Rol das penas principais, limites mínimo e máximo de reclusão e detenção, conversão em prisão da pena de até dois anos aplicada a militar e as penas de impedimento, suspensão do exercício e reforma.","incidencia":"media"},{"id":"penal_militar-aplicacao-da-pena","titulo":"Aplicação da pena","blocos":2,"itens":["pmdf-penal_militar-06"],"foco":"Agravantes e atenuantes próprias do CPM, reincidência e unificação das penas no concurso de crimes e no crime continuado.","incidencia":"baixa"},{"id":"penal_militar-sursis-livramento","titulo":"Suspensão condicional da pena e livramento condicional","blocos":2,"itens":["pmdf-penal_militar-07","pmdf-penal_militar-08"],"foco":"Sursis para pena de até dois anos com prova de dois a seis anos, crimes em que ele não cabe e frações de pena cumprida exigidas no livramento condicional.","incidencia":"media"},{"id":"penal_militar-penas-acessorias-efeitos","titulo":"Penas acessórias e efeitos da condenação","blocos":1,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-07","pmdf-penal_militar-09","pmgo-penal_militar-08","pmdf-penal_militar-10"],"foco":"Rol das penas acessórias, perda do posto e patente, exclusão da praça e os efeitos de reparar o dano e perder instrumentos e produto do crime.","incidencia":"media"},{"id":"penal_militar-medidas-de-seguranca","titulo":"Medidas de segurança","blocos":1,"itens":["pmdf-penal_militar-11"],"foco":"Divisão em medidas pessoais e patrimoniais, detentivas e não detentivas, internação do inimputável, cassação de licença para dirigir, interdição de estabelecimento e confisco.","incidencia":"baixa"},{"id":"penal_militar-acao-penal-extincao","titulo":"Ação penal e extinção da punibilidade","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-09","pmdf-penal_militar-12","pmgo-penal_militar-10","pmdf-penal_militar-13"],"foco":"Ação penal por denúncia do Ministério Público, casos que dependem de requisição, causas de extinção da punibilidade e prescrição, com regras próprias na deserção e na insubmissão.","incidencia":"media"},{"id":"penal_militar-motim-revolta-violencia","titulo":"Motim, revolta, aliciação e violência contra superior","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-11","pmgo-penal_militar-12","pmdf-penal_militar-14"],"foco":"Diferença entre motim e revolta pelo uso de armas, conspiração, omissão de lealdade militar, aliciação e incitamento, e violência contra superior ou militar de serviço.","incidencia":"alta"},{"id":"penal_militar-desrespeito-insubordinacao-abuso","titulo":"Desrespeito, insubordinação e abuso de autoridade","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-11","pmgo-penal_militar-12","pmdf-penal_militar-14"],"foco":"Desrespeito a superior, recusa de obediência, rigor excessivo e violência contra inferior, resistência mediante ameaça ou violência e fuga ou evasão de preso.","incidencia":"alta"},{"id":"penal_militar-servico-e-dever-militar","titulo":"Crimes contra o serviço e o dever militar","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-11","pmgo-penal_militar-13","pmdf-penal_militar-14"],"foco":"Deserção pela ausência sem licença por mais de oito dias e seus casos assimilados, insubmissão, abandono de posto, embriaguez em serviço e dormir em serviço.","incidencia":"alta"},{"id":"penal_militar-desacato-desobediencia-peculato","titulo":"Desacato, desobediência e peculato","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-11","pmgo-penal_militar-14","pmdf-penal_militar-14"],"foco":"Desacato a superior e a militar, desobediência a ordem legal, peculato por apropriação e peculato-furto, e o peculato culposo em que a reparação do dano antes da sentença irrecorrível extingue a punibilidade.","incidencia":"alta"},{"id":"penal_militar-concussao-corrupcao-dever-funcional","titulo":"Concussão, corrupção, falsidade e dever funcional","blocos":2,"itens":["pmgo-penal_militar-01","pmgo-penal_militar-11","pmgo-penal_militar-14","pmdf-penal_militar-14"],"foco":"Diferença entre concussão (exigir) e corrupção passiva (receber ou aceitar promessa), excesso de exação, falsidade ideológica, prevaricação e condescendência criminosa.","incidencia":"media"}]},{"id":"processo_penal_militar","nome":"Direito Processual Penal Militar","dicas":["Estude com o texto do Decreto-Lei 1.002/69 aberto ao lado da videoaula. A banca copia o artigo e troca um prazo, um sujeito ou um verbo.","Priorize na lei seca a aplicação da lei, a polícia judiciária militar, o IPM, a ação penal, a denúncia e as prisões. É onde se concentra a maior parte das questões de soldado.","Monte uma tabela de prazos: IPM em 20 dias com indiciado preso e 40 dias solto; denúncia em 5 dias com acusado preso e 15 dias solto. A banca troca esses números entre si.","A autoridade militar não pode mandar arquivar o IPM, mesmo que ele conclua que não houve crime. O arquivamento depende de pedido do Ministério Público ao juiz.","Na prisão em flagrante, qualquer pessoa pode prender e o militar deve prender. A troca entre 'pode' e 'deve' é pegadinha comum.","Não misture o CPP comum com o CPPM. Na preventiva, por exemplo, o CPPM aceita como fundamento a manutenção da hierarquia e da disciplina militares, que não existe no CPP.","Decore a ordem das fontes para casos omissos: legislação processual penal comum, jurisprudência, usos e costumes militares, princípios gerais de direito e analogia. A doutrina não está na lista e aparece como alternativa errada.","No crime doloso contra a vida de civil cometido por militar estadual, a Justiça Militar remete os autos do IPM à justiça comum. Esse ponto cai junto com foro militar e competência."],"assuntos":[{"id":"processo_penal_militar-aplicacao-e-policia-judiciaria","titulo":"Aplicação da lei processual e polícia judiciária militar","blocos":2,"itens":["pmgo-processo_penal_militar-01","pmgo-processo_penal_militar-02","pmdf-processo_penal_militar-01","pmgo-processo_penal_militar-03","pmdf-processo_penal_militar-02"],"foco":"Lista e ordem das fontes para casos omissos, aplicação do código à Justiça Militar estadual e quem exerce e pode delegar a polícia judiciária militar.","incidencia":"alta"},{"id":"processo_penal_militar-inquerito-policial-militar","titulo":"Inquérito policial militar (IPM)","blocos":3,"itens":["pmdf-processo_penal_militar-03","pmgo-processo_penal_militar-01"],"foco":"Prazos de conclusão (20 dias preso, 40 dias solto, só este prorrogável), detenção do indiciado, proibição de a autoridade militar arquivar o IPM e casos de dispensa do inquérito.","incidencia":"alta"},{"id":"processo_penal_militar-acao-penal-e-denuncia","titulo":"Ação penal militar, denúncia e início do processo","blocos":2,"itens":["pmgo-processo_penal_militar-04","pmdf-processo_penal_militar-04","pmdf-processo_penal_militar-05","pmgo-processo_penal_militar-06","pmdf-processo_penal_militar-06"],"foco":"Ação pública promovida só pelo Ministério Público, que não pode desistir após a denúncia, crimes que dependem de requisição, requisitos da denúncia e prazos de 5 dias preso e 15 solto.","incidencia":"alta"},{"id":"processo_penal_militar-juiz-auxiliares-e-partes","titulo":"Juiz, auxiliares e partes do processo","blocos":2,"itens":["pmgo-processo_penal_militar-05"],"foco":"Impedimento e suspeição do juiz, quem pode ser assistente do Ministério Público e o que ele pode fazer, e nomeação de defensor ao acusado.","incidencia":"baixa"},{"id":"processo_penal_militar-foro-e-competencia","titulo":"Foro militar, jurisdição e competência","blocos":3,"itens":["pmgo-processo_penal_militar-07","pmgo-processo_penal_militar-08","pmdf-processo_penal_militar-07"],"foco":"Critérios de competência (lugar da infração, residência do acusado, prevenção e sede do lugar de serviço), conexão e continência e remessa à justiça comum do crime doloso contra a vida de civil.","incidencia":"media"},{"id":"processo_penal_militar-questoes-prejudiciais-e-incidentes","titulo":"Questões prejudiciais e incidentes","blocos":2,"itens":["pmgo-processo_penal_militar-09","pmgo-processo_penal_militar-10","pmdf-processo_penal_militar-08"],"foco":"Suspensão do processo por questão prejudicial sobre estado civil, rol das exceções (suspeição ou impedimento, incompetência, litispendência e coisa julgada) e incidente de insanidade mental.","incidencia":"baixa"},{"id":"processo_penal_militar-busca-apreensao-e-assecuratorias","titulo":"Busca, apreensão e medidas assecuratórias","blocos":2,"itens":["pmgo-processo_penal_militar-11","pmdf-processo_penal_militar-09"],"foco":"Requisitos da busca domiciliar e pessoal, o que pode ser apreendido e a diferença entre sequestro, hipoteca legal e arresto.","incidencia":"media"},{"id":"processo_penal_militar-prisoes-e-liberdade-provisoria","titulo":"Prisões, menagem e liberdade provisória","blocos":3,"itens":["pmgo-processo_penal_militar-11","pmdf-processo_penal_militar-09"],"foco":"Quem pode e quem deve prender em flagrante, requisitos e fundamentos da preventiva, cabimento da menagem e hipóteses de liberdade provisória.","incidencia":"alta"},{"id":"processo_penal_militar-citacao-intimacao-notificacao","titulo":"Citação, intimação e notificação","blocos":1,"itens":["pmgo-processo_penal_militar-12"],"foco":"Formas de citação (mandado, requisição ao comandante do militar da ativa, precatória e edital) e quando o processo segue à revelia.","incidencia":"baixa"},{"id":"processo_penal_militar-atos-probatorios","titulo":"Atos probatórios: perícia, interrogatório e testemunhas","blocos":3,"itens":["pmgo-processo_penal_militar-13","pmdf-processo_penal_militar-10"],"foco":"Validade da confissão, regras do interrogatório, quem pode se recusar a depor como testemunha e liberdade do juiz para rejeitar o laudo pericial.","incidencia":"media"},{"id":"processo_penal_militar-processo-ordinario","titulo":"Processo ordinário","blocos":2,"itens":["pmgo-processo_penal_militar-14","pmdf-processo_penal_militar-11"],"foco":"Ordem dos atos da instrução criminal, funcionamento do Conselho de Justiça na sessão de julgamento e requisitos da sentença.","incidencia":"baixa"},{"id":"processo_penal_militar-processos-especiais","titulo":"Processos especiais: deserção, insubmissão e habeas corpus","blocos":3,"itens":["pmgo-processo_penal_militar-14","pmdf-processo_penal_militar-12"],"foco":"Rito da deserção (termo de deserção, exclusão ou agregação, captura ou apresentação, inspeção de saúde e reinclusão), insubmissão e limites do habeas corpus contra punição disciplinar.","incidencia":"media"},{"id":"processo_penal_militar-nulidades-e-recursos","titulo":"Nulidades e recursos","blocos":3,"itens":["pmgo-processo_penal_militar-15","pmdf-processo_penal_militar-13"],"foco":"Regra de que não há nulidade sem prejuízo, momento de arguir a nulidade e cabimento de recurso em sentido estrito, apelação, embargos e revisão.","incidencia":"baixa"},{"id":"processo_penal_militar-execucao","titulo":"Execução no processo penal militar","blocos":2,"itens":["pmgo-processo_penal_militar-16"],"foco":"Requisitos da suspensão condicional da pena e do livramento condicional, além de indulto, anistia e reabilitação.","incidencia":"baixa"},{"id":"processo_penal_militar-tempo-de-guerra","titulo":"Justiça Militar em tempo de guerra","blocos":1,"itens":["pmgo-processo_penal_militar-17"],"foco":"O que muda em relação ao tempo de paz: prazos bem mais curtos, rito simplificado e regras para a execução da pena de morte.","incidencia":"baixa"}]},{"id":"legislacao_pmdf","nome":"Legislação da PMDF","dicas":["Esta matéria vale 10 das 80 questões da PMDF, o mesmo peso de Português. Não deixe para o fim do edital.","Estude com a lei seca aberta. Legislação específica é cobrada quase literal, com uma palavra trocada.","No Estatuto (Lei 7.289/1984), priorize hierarquia e disciplina, deveres, agregação, reserva, reforma e exclusão. É onde se concentram as questões.","Faça uma tabela com as formas de exclusão do serviço ativo e o que cada uma exige. A banca troca reserva, reforma, demissão e licenciamento.","No Decreto 88.777/1983, decore as definições do começo do regulamento: ordem pública, manutenção da ordem pública, policiamento ostensivo e perturbação da ordem. Definição é ponto fácil.","A PMDF é organizada e mantida pela União e subordinada ao Governador do DF. Esse ponto liga a legislação da corporação aos arts. 21 e 144 da Constituição.","Na Lei Orgânica do DF, leia primeiro o capítulo da segurança pública e o da administração pública. Depois os fundamentos e a organização do DF.","Leis de organização mudam por decreto. Confira a versão atualizada no Sinj-DF ou no site do Planalto antes de estudar."],"assuntos":[{"id":"legislacao_pmdf-lodf-fundamentos-organizacao","titulo":"Lei Orgânica do DF: fundamentos, organização e competências","blocos":2,"itens":["pmdf-legislacao_pmdf-01"],"foco":"Fundamentos e objetivos do DF, organização político-administrativa em regiões administrativas, competências do DF e organização dos Poderes distritais.","incidencia":"media"},{"id":"legislacao_pmdf-lodf-administracao-seguranca","titulo":"Lei Orgânica do DF: administração pública, servidores e segurança pública","blocos":2,"itens":["pmdf-legislacao_pmdf-01"],"foco":"Princípios da administração pública do DF, regras para servidores e militares e o capítulo da segurança pública, que trata da PMDF e do Corpo de Bombeiros.","incidencia":"alta"},{"id":"legislacao_pmdf-organizacao-basica","titulo":"Organização básica da PMDF: Lei 6.450/1977 e decretos de 2020","blocos":2,"itens":["pmdf-legislacao_pmdf-02","pmdf-legislacao_pmdf-06","pmdf-legislacao_pmdf-07"],"foco":"Destinação e competências da PMDF, subordinação ao Governador do DF, órgãos de direção, apoio e execução, a estrutura do Decreto 10.443/2020 e o decreto que regulamenta o art. 48, inciso II, da Lei 6.450.","incidencia":"alta"},{"id":"legislacao_pmdf-estatuto-hierarquia-disciplina","titulo":"Estatuto (Lei 7.289/1984): ingresso, hierarquia e disciplina","blocos":2,"itens":["pmdf-legislacao_pmdf-03"],"foco":"Conceitos de hierarquia e disciplina, círculos hierárquicos e escala de precedência entre oficiais e praças, cargo e função policial-militar e compromisso do ingressante.","incidencia":"alta"},{"id":"legislacao_pmdf-estatuto-deveres-direitos","titulo":"Estatuto: valores, deveres, obrigações e direitos","blocos":2,"itens":["pmdf-legislacao_pmdf-03"],"foco":"Valores e ética policial-militar, deveres e obrigações, violação das obrigações e dos deveres, direitos e prerrogativas como férias, licenças e uso de uniforme.","incidencia":"alta"},{"id":"legislacao_pmdf-estatuto-situacoes-exclusao","titulo":"Estatuto: agregação, reserva, reforma e exclusão do serviço ativo","blocos":2,"itens":["pmdf-legislacao_pmdf-03"],"foco":"Agregação e reversão, transferência para a reserva remunerada, reforma e as formas de exclusão do serviço ativo, como demissão, licenciamento e exclusão a bem da disciplina.","incidencia":"alta"},{"id":"legislacao_pmdf-lei-12086","titulo":"Lei 12.086/2009: militares da PMDF e do CBMDF","blocos":2,"itens":["pmdf-legislacao_pmdf-04"],"foco":"Requisitos de ingresso, quadros e regras de carreira dos militares do DF, com as alterações que a lei fez em outras normas.","incidencia":"media"},{"id":"legislacao_pmdf-decreto-88777","titulo":"Decreto 88.777/1983 (R-200): regulamento das polícias militares","blocos":2,"itens":["pmdf-legislacao_pmdf-05"],"foco":"Definições de ordem pública, manutenção da ordem pública, policiamento ostensivo e perturbação da ordem, e o controle e a coordenação das polícias militares pelo Exército.","incidencia":"alta"}]},{"id":"matematica","nome":"Matemática e Raciocínio Lógico","dicas":["Estude a teoria no bloco de 50 minutos e resolva questões no mesmo dia. Use provas anteriores de soldado da AOCP e questões de lógica do Cebraspe.","Em porcentagem, trabalhe com fator multiplicador: aumento de 20% é multiplicar por 1,2. Dois aumentos seguidos de 10% dão 21%, não 20%.","Na regra de três composta, marque com setas se cada grandeza é direta ou inversa antes de montar a conta. É ali que a maioria erra.","Decore a tabela-verdade do condicional. Ele só é falso quando o antecedente é verdadeiro e o consequente é falso.","A negação de \"se p, então q\" é \"p e não q\". A banca oferece \"se não p, então não q\" para pegar quem confundiu.","A negação de \"todo A é B\" é \"algum A não é B\". A alternativa \"nenhum A é B\" é a pegadinha clássica.","Em argumento, não julgue a conclusão pelo que você sabe do mundo real. Vale só o que as premissas garantem.","Na contagem, pergunte se trocar a ordem gera um resultado novo. Se gera, é arranjo; se não gera, é combinação. Em probabilidade com \"pelo menos um\", calcule 1 menos a chance de nenhum."],"assuntos":[{"id":"matematica-razao-e-proporcao","titulo":"Razão, proporção e grandezas proporcionais","blocos":2,"itens":["pmdf-matematica-23","pmdf-matematica-24","pmdf-matematica-25"],"foco":"Divisão de um valor em partes diretamente ou inversamente proporcionais, como repartir um prêmio entre pessoas.","incidencia":"media"},{"id":"matematica-regra-de-tres","titulo":"Regra de três simples e composta","blocos":2,"itens":["pmdf-matematica-23","pmdf-matematica-26","pmdf-matematica-27","pmdf-matematica-29"],"foco":"Regra de três composta com operários, dias e horas, em que o erro comum é não conferir se cada grandeza é direta ou inversa.","incidencia":"alta"},{"id":"matematica-porcentagem","titulo":"Porcentagem e resolução de problemas","blocos":2,"itens":["pmdf-matematica-23","pmdf-matematica-28","pmdf-matematica-29"],"foco":"Aumentos e descontos sucessivos, calculados pelo fator multiplicador e nunca somando as taxas.","incidencia":"alta"},{"id":"matematica-sistemas-de-medidas","titulo":"Sistemas de medidas: comprimento, área e volume","blocos":1,"itens":["pmdf-matematica-30","pmdf-matematica-31","pmdf-matematica-32","pmdf-matematica-33"],"foco":"Conversão entre unidades, com destaque para 1 dm³ igual a 1 litro e para a escala de 100 em 100 nas unidades de área.","incidencia":"baixa"},{"id":"matematica-areas","titulo":"Áreas de figuras planas","blocos":2,"itens":["pmdf-matematica-34","pmdf-matematica-32"],"foco":"Área de retângulo, triângulo, trapézio e círculo em problemas de terreno, piso ou pintura, muitas vezes com conversão de unidade.","incidencia":"media"},{"id":"matematica-volumes","titulo":"Volumes de sólidos","blocos":2,"itens":["pmdf-matematica-35","pmdf-matematica-33"],"foco":"Volume de cubo, paralelepípedo e cilindro em problemas de caixa d'água ou reservatório, com resposta em litros.","incidencia":"baixa"},{"id":"matematica-proposicoes-e-conectivos","titulo":"Proposições, conectivos e tabela-verdade","blocos":2,"itens":["pmdf-matematica-01","pmdf-matematica-02","pmdf-matematica-03"],"foco":"Reconhecer o que é proposição e saber que o condicional só é falso com antecedente verdadeiro e consequente falso.","incidencia":"alta"},{"id":"matematica-equivalencias-e-implicacoes","titulo":"Equivalências, negações e implicações lógicas","blocos":2,"itens":["pmdf-matematica-01","pmdf-matematica-04","pmdf-matematica-05"],"foco":"Negação do condicional (p e não q) e as equivalências do se então: contrapositiva e troca por não p ou q.","incidencia":"alta"},{"id":"matematica-diagramas-logicos","titulo":"Diagramas lógicos: todo, algum e nenhum","blocos":2,"itens":["pmdf-matematica-13"],"foco":"Representar todo, algum e nenhum em diagramas e apontar qual conclusão é necessariamente verdadeira.","incidencia":"media"},{"id":"matematica-logica-de-argumentacao","titulo":"Lógica de argumentação: inferências e validade","blocos":3,"itens":["pmdf-matematica-07","pmdf-matematica-09","pmdf-matematica-10","pmdf-matematica-11","pmdf-matematica-12"],"foco":"Julgar se um argumento é válido, testando se dá para ter premissas verdadeiras e conclusão falsa.","incidencia":"alta"},{"id":"matematica-associacao-logica-e-analogias","titulo":"Relações entre pessoas, lugares e objetos; analogias","blocos":2,"itens":["pmdf-matematica-06","pmdf-matematica-07","pmdf-matematica-08"],"foco":"Problemas de quem é quem, resolvidos com tabela de associação entre pessoas, profissões, lugares ou objetos.","incidencia":"media"},{"id":"matematica-contagem-e-permutacoes","titulo":"Princípio fundamental da contagem e permutações","blocos":2,"itens":["pmdf-matematica-14","pmdf-matematica-15","pmdf-matematica-16","pmdf-matematica-17"],"foco":"Anagramas com e sem letras repetidas e contagem de senhas ou placas pelo princípio multiplicativo.","incidencia":"alta"},{"id":"matematica-arranjo-e-combinacao","titulo":"Arranjo e combinação simples","blocos":2,"itens":["pmdf-matematica-14","pmdf-matematica-18","pmdf-matematica-19"],"foco":"Decidir se a ordem importa: formar comissão é combinação, escolher cargos diferentes é arranjo.","incidencia":"alta"},{"id":"matematica-probabilidade","titulo":"Probabilidade","blocos":3,"itens":["pmdf-matematica-20","pmdf-matematica-21","pmdf-matematica-22"],"foco":"Sorteio com urnas, dados e pessoas, usando casos favoráveis sobre possíveis, evento complementar e produto de probabilidades.","incidencia":"alta"}]},{"id":"realidade_df","nome":"Realidade do DF e RIDE","dicas":["Esta matéria vale 7 questões na PMDF. O edital é amplo, então estude pelo que mais cai: história da mudança da capital, RIDE, geografia e atualidades.","Monte uma linha do tempo: Constituição de 1891, Missão Cruls, Plano de Metas, concurso do Plano Piloto, inauguração em 1960 e autonomia em 1988. Data é alvo de pegadinha.","Leia notícias do DF três vezes por semana, na Agência Brasília ou num jornal local. Atualidades de prova costuma sair dos 12 meses antes do edital.","Estude a RIDE com um mapa aberto. Saiba que ela junta o DF a municípios de Goiás e de Minas Gerais e para que ela serve.","O DF não se divide em municípios. Ele tem regiões administrativas e acumula competências de estado e de município.","Ligue a matéria a Constitucional: o art. 32 da Constituição trata do DF e o art. 21 diz que a União organiza e mantém a PMDF.","Para geografia, guarde três ideias: cerrado, seca longa no meio do ano e o DF como área de nascentes de grandes bacias.","Resolva questões de concursos locais recentes, como PCDF, CBMDF e a própria PMDF. Os temas de realidade do DF se repetem."],"assuntos":[{"id":"realidade_df-historia-da-capital","titulo":"História: da ideia da capital no interior à inauguração","blocos":2,"itens":["pmdf-realidade_df-01","pmdf-realidade_df-02"],"foco":"A Constituição de 1891, a Missão Cruls, o Plano de Metas de JK, o concurso do Plano Piloto vencido por Lúcio Costa e a inauguração em 21 de abril de 1960.","incidencia":"alta"},{"id":"realidade_df-politica-e-autonomia","titulo":"Política e administração: autonomia e regiões administrativas","blocos":2,"itens":["pmdf-realidade_df-01"],"foco":"Autonomia política dada pela Constituição de 1988, a primeira eleição para governador em 1990, a Câmara Legislativa e a divisão em regiões administrativas, sem municípios.","incidencia":"alta"},{"id":"realidade_df-geografia-fisica","titulo":"Geografia física: cerrado, clima, relevo e águas","blocos":2,"itens":["pmdf-realidade_df-01"],"foco":"Cerrado, clima tropical com estação seca longa, o Planalto Central e o DF como área de nascentes de grandes bacias do país, além do Lago Paranoá, que é artificial.","incidencia":"media"},{"id":"realidade_df-populacao-e-sociedade","titulo":"População, migração e desigualdade","blocos":2,"itens":["pmdf-realidade_df-01"],"foco":"Formação da população por migrantes de todas as regiões, crescimento das cidades fora do Plano Piloto, desigualdade de renda entre as regiões e indicadores sociais.","incidencia":"media"},{"id":"realidade_df-economia","titulo":"Economia do DF","blocos":1,"itens":["pmdf-realidade_df-01"],"foco":"Peso do setor público e dos serviços, uma das maiores rendas por habitante do país e a produção agropecuária da região.","incidencia":"media"},{"id":"realidade_df-cultura-e-patrimonio","titulo":"Cultura, arquitetura e patrimônio","blocos":1,"itens":["pmdf-realidade_df-01"],"foco":"Obra de Lúcio Costa e Oscar Niemeyer, Brasília como Patrimônio Cultural da Humanidade pela Unesco em 1987 e manifestações culturais locais.","incidencia":"media"},{"id":"realidade_df-ride","titulo":"RIDE-DF: integração com Goiás e Minas Gerais","blocos":1,"itens":["pmdf-realidade_df-01","pmdf-realidade_df-02"],"foco":"O que é a RIDE, criada por lei complementar para integrar o DF a municípios de Goiás e de Minas Gerais, e os problemas comuns de transporte, saúde e segurança.","incidencia":"alta"},{"id":"realidade_df-atualidades-e-conexao","titulo":"Atualidades do DF e conexão com o Brasil","blocos":2,"itens":["pmdf-realidade_df-01","pmdf-realidade_df-02"],"foco":"Fatos recentes de política, segurança pública e economia do DF e o papel de Brasília como centro das decisões do país.","incidencia":"alta"}]},{"id":"direitos_humanos","nome":"Direitos Humanos","dicas":["Estude pela videoaula e feche cada assunto com a lei seca. Priorize o texto da DUDH, da Convenção Americana, do Código de Conduta da ONU e da Lei 13.060, cobrados quase ao pé da letra.","Na Lei 13.060, a arma de fogo não é legítima contra pessoa em fuga desarmada ou sem risco imediato, nem contra veículo que fura bloqueio. A exceção é o risco de morte ou lesão aos agentes ou a terceiros.","Gerações seguem o lema liberdade, igualdade e fraternidade: direitos civis e políticos, depois sociais, econômicos e culturais, depois direitos de solidariedade, como meio ambiente e desenvolvimento. Elas se somam e não se substituem, por isso muitos autores preferem o termo dimensões.","Direitos humanos são universais, indivisíveis, interdependentes, inalienáveis e imprescritíveis, mas em regra não são absolutos. Alternativa que chama todo direito humano de absoluto costuma estar errada.","Tratado de direitos humanos aprovado com rito de emenda vale como emenda constitucional; sem esse rito, é supralegal. Como a Convenção Americana é supralegal e só admite prisão civil do devedor de alimentos, a prisão do depositário infiel é ilícita.","Na Convenção Americana, a vida é protegida, em geral, desde a concepção. A pena de morte não pode voltar onde foi abolida nem ser aplicada a quem tinha menos de 18 ou mais de 70 anos na data do crime, ou a gestantes.","Qualquer pessoa, grupo ou ONG pode peticionar à Comissão Interamericana, mesmo sem ser a vítima. Só a Comissão e os Estados-Partes podem levar um caso à Corte.","Nem guerra, nem emergência pública, nem ordem de superior justificam a tortura, na Convenção da ONU e no Código de Conduta. Na Convenção, a tortura envolve agente público, que pratica, instiga, consente ou tolera o ato."],"assuntos":[{"id":"direitos_humanos-teoria-geral","titulo":"Teoria geral dos direitos humanos","blocos":2,"itens":["pmdf-direitos_humanos-01"],"foco":"Características como universalidade, indivisibilidade, inalienabilidade e imprescritibilidade, e a diferença entre direitos humanos, do plano internacional, e direitos fundamentais, previstos na Constituição.","incidencia":"media"},{"id":"direitos_humanos-evolucao-historica-e-geracoes","titulo":"Evolução histórica e gerações de direitos","blocos":2,"itens":["pmdf-direitos_humanos-02"],"foco":"Qual direito pertence a cada geração, a ligação com liberdade, igualdade e fraternidade e os marcos históricos, como a Magna Carta de 1215, a Declaração francesa de 1789 e as Constituições do México e de Weimar.","incidencia":"alta"},{"id":"direitos_humanos-dudh","titulo":"Declaração Universal dos Direitos Humanos (1948)","blocos":2,"itens":["pmdf-direitos_humanos-05"],"foco":"Literalidade dos artigos, com destaque para igualdade, vedação da tortura, presunção de inocência, asilo e nacionalidade, e sua natureza de resolução da Assembleia Geral da ONU, que não é tratado.","incidencia":"alta"},{"id":"direitos_humanos-incorporacao-dos-tratados","titulo":"Incorporação e hierarquia dos tratados no Brasil","blocos":2,"itens":["pmdf-direitos_humanos-04","pmdf-direitos_humanos-03"],"foco":"Tratado de direitos humanos aprovado em cada Casa do Congresso, em dois turnos, por três quintos dos votos equivale a emenda constitucional; sem esse rito é supralegal, o que tornou ilícita a prisão do depositário infiel.","incidencia":"alta"},{"id":"direitos_humanos-convencao-contra-tortura","titulo":"Convenção da ONU contra a Tortura (1984)","blocos":2,"itens":["pmdf-direitos_humanos-06"],"foco":"Definição de tortura, que envolve agente público por ação, instigação, consentimento ou aquiescência, a proibição absoluta mesmo em guerra ou sob ordem superior, a vedação de enviar alguém a Estado onde corra risco de tortura e o Comitê contra a Tortura.","incidencia":"media"},{"id":"direitos_humanos-uso-da-forca","titulo":"Uso da força: Código de Conduta da ONU e Lei 13.060","blocos":2,"itens":["pmdf-direitos_humanos-11","pmdf-direitos_humanos-10"],"foco":"Os princípios da Lei 13.060 (legalidade, necessidade, razoabilidade e proporcionalidade), os dois casos em que a arma de fogo não é legítima e, no Código de Conduta, o uso da força só quando estritamente necessário.","incidencia":"alta"},{"id":"direitos_humanos-pacto-de-sao-jose","titulo":"Pacto de São José: direitos e garantias","blocos":3,"itens":["pmdf-direitos_humanos-07","pmdf-direitos_humanos-03"],"foco":"Direito à vida e limites à pena de morte, integridade pessoal, liberdade pessoal com apresentação do preso sem demora a um juiz, prisão civil só do devedor de alimentos, garantias judiciais e liberdade de expressão sem censura prévia.","incidencia":"alta"},{"id":"direitos_humanos-sistema-interamericano","titulo":"Sistema Interamericano: Comissão e Corte IDH","blocos":2,"itens":["pmdf-direitos_humanos-12","pmdf-direitos_humanos-07"],"foco":"Composição e funções da Comissão e da Corte, quem pode peticionar à Comissão, o fato de só a Comissão e os Estados-Partes levarem casos à Corte e os requisitos de admissibilidade, como o esgotamento dos recursos internos.","incidencia":"media"},{"id":"direitos_humanos-bloco-e-controle-de-convencionalidade","titulo":"Bloco de constitucionalidade e controle de convencionalidade","blocos":2,"itens":["pmdf-direitos_humanos-08","pmdf-direitos_humanos-03"],"foco":"Quais tratados integram o bloco de constitucionalidade no Brasil, a diferença entre controle de convencionalidade difuso e concentrado, o dever de todo juiz de fazer esse controle e a interpretação pela norma mais favorável à pessoa.","incidencia":"media"},{"id":"direitos_humanos-cndh","titulo":"Conselho Nacional dos Direitos Humanos (CNDH)","blocos":1,"itens":["pmdf-direitos_humanos-09"],"foco":"Finalidade de promoção e defesa dos direitos humanos, composição paritária entre poder público e sociedade civil, competências como receber denúncias e expedir recomendações, e as quatro sanções, como advertência e censura pública.","incidencia":"baixa"}]},{"id":"ingles","nome":"Língua Inglesa","dicas":["Inglês está só no edital da PMDF e valeu 4 das 80 questões no último concurso de soldado. Estude com constância, sem tirar tempo das matérias de maior peso.","Leia um texto curto em inglês por dia, como uma notícia. Resuma cada parágrafo em uma frase em português.","Leia as perguntas antes do texto. Assim você sabe o que procurar e acha o trecho certo com scanning, sem traduzir tudo.","Monte uma lista de falsos cognatos e revise toda semana. Actually é na verdade, pretend é fingir, push é empurrar e parents é pais.","Marque só o que o texto afirma. Alternativa verdadeira no mundo real, mas ausente do texto, está errada.","Desconfie de alternativa que copia palavras do texto e troca um detalhe, como um not, um only ou o modal. Trocar may por must é pegadinha comum.","Estude gramática pelo sentido: o que o tempo verbal, o modal ou o conectivo muda na frase. Nas provas, ela costuma aparecer em trechos do próprio texto.","Inglês não tem lei seca. O equivalente são listas curtas para revisar: verbos irregulares com as três formas, conectivos por sentido e modais por função."],"assuntos":[{"id":"ingles-estrategias-de-leitura","titulo":"Estratégias de leitura e falsos cognatos","blocos":2,"itens":["pmdf-ingles-01"],"foco":"A prova cobra o sentido de palavras no contexto, com falsos cognatos como actually, eventually e pretend, e a localização rápida de informações por skimming e scanning.","incidencia":"alta"},{"id":"ingles-pronomes","titulo":"Pronomes","blocos":1,"itens":["pmdf-ingles-03"],"foco":"A banca pergunta a que termo um pronome como it, they ou them se refere no texto e cobra a diferença entre my, mine e myself.","incidencia":"media"},{"id":"ingles-substantivos-e-artigos","titulo":"Substantivos e artigos","blocos":2,"itens":["pmdf-ingles-04","pmdf-ingles-05"],"foco":"Cai plural irregular, como children e women, substantivo incontável, como information e advice, genitivo com 's e a escolha entre a, an, the ou nenhum artigo.","incidencia":"baixa"},{"id":"ingles-adjetivos-e-adverbios","titulo":"Adjetivos e advérbios","blocos":2,"itens":["pmdf-ingles-06","pmdf-ingles-07"],"foco":"Cai comparativo e superlativo, como better e the most, e pares que mudam de sentido, como hard e hardly ou late e lately.","incidencia":"media"},{"id":"ingles-preposicoes","titulo":"Preposições","blocos":1,"itens":["pmdf-ingles-11"],"foco":"Cai in, on e at para tempo e lugar e a preposição que acompanha verbos e adjetivos, como depend on e interested in.","incidencia":"baixa"},{"id":"ingles-prefixos-e-sufixos","titulo":"Prefixos e sufixos","blocos":1,"itens":["pmdf-ingles-12"],"foco":"A banca pede a classe da palavra formada pelo sufixo, como -ness para substantivo e -ly para advérbio, e o sentido de prefixos de negação como un-, in- e dis-.","incidencia":"baixa"},{"id":"ingles-tempos-simples-e-continuos","titulo":"Verbos: tempos simples e contínuos","blocos":3,"itens":["pmdf-ingles-08","pmdf-ingles-09"],"foco":"Cai identificar o tempo de um verbo do texto, montar negativa e pergunta com do, does e did e reconhecer o passado dos verbos irregulares.","incidencia":"media"},{"id":"ingles-tempos-perfeitos","titulo":"Tempos perfeitos: present, past e future perfect","blocos":2,"itens":["pmdf-ingles-09"],"foco":"Cai a diferença entre present perfect e past simple, o uso de since, for, already e yet e o past perfect para a ação anterior a outra no passado.","incidencia":"media"},{"id":"ingles-verbos-modais","titulo":"Verbos modais","blocos":2,"itens":["pmdf-ingles-10"],"foco":"Cai o sentido do modal na frase, como obrigação, conselho, possibilidade ou dedução, e a diferença entre mustn't e don't have to.","incidencia":"alta"},{"id":"ingles-voz-passiva","titulo":"Voz passiva","blocos":1,"itens":["pmdf-ingles-13"],"foco":"Cai reconhecer a voz passiva no texto e passar a frase da ativa para a passiva no mesmo tempo verbal, com be mais particípio.","incidencia":"media"},{"id":"ingles-phrasal-verbs-e-verb-patterns","titulo":"Phrasal verbs e verb patterns","blocos":2,"itens":["pmdf-ingles-18","pmdf-ingles-19"],"foco":"Cai o sentido de phrasal verbs comuns, como find out, give up e carry out, e se o verbo pede -ing ou to, como em enjoy doing e decide to do.","incidencia":"media"},{"id":"ingles-oracoes-subordinadas-e-conjuncoes","titulo":"Orações subordinadas, conjunções e relative clauses","blocos":3,"itens":["pmdf-ingles-14","pmdf-ingles-15"],"foco":"A questão mais comum pede o sentido de um conectivo, como although, whereas, however ou therefore, ou a que termo um pronome relativo como which ou who se refere.","incidencia":"alta"},{"id":"ingles-condicionais","titulo":"Condicionais","blocos":2,"itens":["pmdf-ingles-17"],"foco":"Cai reconhecer o tipo de condicional pela combinação de tempos e dizer se a situação é real, hipotética ou algo que não aconteceu no passado.","incidencia":"baixa"},{"id":"ingles-discurso-indireto-e-question-tags","titulo":"Discurso indireto e question tags","blocos":2,"itens":["pmdf-ingles-16","pmdf-ingles-20"],"foco":"Cai o recuo dos tempos no discurso indireto, como is virando was, a diferença entre say e tell e o auxiliar certo na question tag.","incidencia":"baixa"},{"id":"ingles-interpretacao-de-textos","titulo":"Interpretação de textos e gramática em contexto","blocos":2,"itens":["pmdf-ingles-01","pmdf-ingles-02"],"foco":"Cai ideia principal, informação específica, inferência, referência de pronomes e sinônimo de palavra no contexto, sempre pelo que o texto afirma.","incidencia":"alta"}]},{"id":"criminologia","nome":"Criminologia","dicas":["Estude por comparação, com tabelas de pares: Clássica e Positiva, consenso e conflito, controle formal e informal. Boa parte das questões pede para separar esses pares.","Ligue autor e ideia: Beccaria e a pena proporcional, Lombroso e o criminoso nato, Sutherland e a associação diferencial, Merton e a anomia, Mendelsohn e os tipos de vítima. A alternativa errada costuma trocar o autor da teoria.","Criminologia é ciência do ser, empírica e indutiva; o Direito Penal é do dever ser, normativo e dedutivo. A pegadinha clássica inverte esses adjetivos.","Cifra negra é o crime que não chega ao conhecimento oficial. Cifra dourada é a criminalidade dos poderosos, como a do colarinho branco, que fica fora das estatísticas e sem punição.","Vitimização primária vem do crime; a secundária, das instâncias formais, como polícia e Judiciário; a terciária, do meio social que estigmatiza a vítima. A banca costuma trocar a secundária pela terciária.","Na prevenção, olhe o alvo da ação: sobre as causas sociais é primária, sobre grupos ou áreas de risco é secundária, sobre o preso é terciária. Ação policial em área de risco é o exemplo típico de secundária.","No labelling approach, o desvio primário é o ato inicial e o secundário nasce da reação social ao rótulo. A banca inverte os dois ou põe a teoria entre as do consenso, quando ela é do conflito.","Criminologia quase não tem lei seca: o peso está na doutrina e nas questões. Leia o art. 59 do Código Penal, que inclui o comportamento da vítima, e a composição civil dos danos da Lei 9.099/1995, que aparecem em vitimologia."],"assuntos":[{"id":"criminologia-conceito-e-metodo","titulo":"Conceito, características, método e finalidade","blocos":1,"itens":["pmdf-criminologia-01","pmdf-criminologia-02","pmdf-criminologia-04"],"foco":"Criminologia como ciência empírica e interdisciplinar, do ser, que usa método indutivo, em oposição ao Direito Penal, normativo e dedutivo.","incidencia":"alta"},{"id":"criminologia-objeto-funcoes-e-classificacao","titulo":"Objeto, funções e classificação","blocos":1,"itens":["pmdf-criminologia-01","pmdf-criminologia-03","pmdf-criminologia-05","pmdf-criminologia-06"],"foco":"Os quatro objetos da criminologia moderna (delito, delinquente, vítima e controle social) e a divisão entre criminologia geral e clínica.","incidencia":"alta"},{"id":"criminologia-escolas-penais","titulo":"História da criminologia: as escolas penais","blocos":2,"itens":["pmdf-criminologia-07","pmdf-criminologia-08","pmdf-criminologia-09","pmdf-criminologia-10","pmdf-criminologia-11"],"foco":"Autores de cada escola e o contraste entre a Clássica (livre-arbítrio, crime como ente jurídico) e a Positiva (determinismo, criminoso nato de Lombroso).","incidencia":"alta"},{"id":"criminologia-teorias-do-consenso","titulo":"Sociologia criminal: teorias do consenso","blocos":2,"itens":["pmdf-criminologia-13"],"foco":"Escola de Chicago (zonas concêntricas e desorganização social), associação diferencial de Sutherland, anomia em Durkheim e Merton e subcultura delinquente de Albert Cohen.","incidencia":"alta"},{"id":"criminologia-teorias-do-conflito","titulo":"Sociologia criminal: teorias do conflito","blocos":1,"itens":["pmdf-criminologia-13"],"foco":"Labelling approach (rótulo, desvio primário e secundário, seletividade do sistema penal) e criminologia crítica, que vê o controle penal como instrumento de dominação.","incidencia":"media"},{"id":"criminologia-instancias-de-controle","titulo":"Instâncias de controle social","blocos":1,"itens":["pmdf-criminologia-17"],"foco":"Controle social informal (família, escola, igreja, opinião pública) versus formal (Polícia, Ministério Público, Judiciário, sistema prisional) e a seletividade das instâncias formais.","incidencia":"media"},{"id":"criminologia-estatistica-cifras-e-colarinho-branco","titulo":"Estatística criminal, cifras e colarinho branco","blocos":2,"itens":["pmdf-criminologia-12","pmdf-criminologia-18"],"foco":"Cifra negra (crime que não chega às estatísticas oficiais), cifra dourada (crime dos poderosos que fica oculto) e o conceito de colarinho branco de Sutherland.","incidencia":"alta"},{"id":"criminologia-vitimologia","titulo":"Vitimologia","blocos":2,"itens":["pmdf-criminologia-14"],"foco":"Vitimização primária, secundária e terciária, a classificação de vítimas de Mendelsohn e as fases de protagonismo, neutralização e redescobrimento da vítima.","incidencia":"alta"},{"id":"criminologia-fatores-sociais-e-prevencao","titulo":"Fatores sociais e prevenção criminal","blocos":2,"itens":["pmdf-criminologia-15","pmdf-criminologia-16"],"foco":"Distinção entre prevenção primária (causas sociais como educação, emprego e moradia), secundária (grupos e áreas de risco) e terciária (o preso, para evitar reincidência).","incidencia":"alta"}]},{"id":"goias","nome":"História e Geografia de Goiás","dicas":["Esta matéria vale 5 questões na PMGO e só aparece no edital dela. Estude depois das matérias de Direito, mas não pule.","Monte uma linha do tempo: Anhanguera e o ouro no século XVIII, pecuária no século XIX, ferrovia, Revolução de 1930, fundação de Goiânia e criação do Tocantins em 1988.","Ligue cada fase da economia ao que mudou na sociedade: o ouro trouxe as vilas e a escravidão; a pecuária, o isolamento; a ferrovia e Goiânia, a modernização.","Pedro Ludovico Teixeira é o nome central da virada de 1930 e da construção de Goiânia. A banca cobra o contraste com as oligarquias da República Velha.","Na geografia, guarde o cerrado, o inverno seco e as grandes bacias. Chapada dos Veadeiros e Rio Araguaia aparecem com frequência.","Na cultura popular, faça uma lista de festas e cidades: Cavalhadas de Pirenópolis, Procissão do Fogaréu na Cidade de Goiás e Romaria do Divino Pai Eterno em Trindade.","Para atualidades, leia notícias de Goiás duas vezes por semana nos meses antes da prova. Foque em economia, segurança pública e decisões do governo estadual.","Resolva questões de concursos goianos anteriores, como PMGO, PCGO e Corpo de Bombeiros. Os temas de Goiás se repetem bastante."],"assuntos":[{"id":"goias-bandeirantes-e-ouro","titulo":"Bandeirantes, colonização e o ciclo do ouro","blocos":2,"itens":["pmgo-goias-03","pmgo-goias-01","pmgo-goias-04"],"foco":"Bandeiras de Bartolomeu Bueno da Silva, o Anhanguera, a descoberta de ouro no século XVIII, a fundação de Vila Boa e a decadência da mineração.","incidencia":"alta"},{"id":"goias-agropecuaria-e-ferrovia","titulo":"Agropecuária nos séculos XIX e XX e a estrada de ferro","blocos":1,"itens":["pmgo-goias-01"],"foco":"A pecuária depois do ouro, o isolamento da província e a chegada da ferrovia no começo do século XX, que ligou Goiás ao Sudeste.","incidencia":"media"},{"id":"goias-republica-velha-e-1930","titulo":"Coronelismo, oligarquias e a Revolução de 1930","blocos":2,"itens":["pmgo-goias-03"],"foco":"O coronelismo e o domínio de oligarquias como a dos Caiado na República Velha e a chegada de Pedro Ludovico Teixeira ao poder com a Revolução de 1930.","incidencia":"alta"},{"id":"goias-goiania-e-modernizacao","titulo":"A construção de Goiânia e a modernização da economia","blocos":2,"itens":["pmgo-goias-01","pmgo-goias-03"],"foco":"A mudança da capital da Cidade de Goiás para Goiânia, a Marcha para o Oeste, a industrialização, a infraestrutura e o planejamento a partir da década de 1930.","incidencia":"alta"},{"id":"goias-politica-1930-ate-hoje","titulo":"Política e administração de 1930 até hoje","blocos":2,"itens":["pmgo-goias-03"],"foco":"Da era de Pedro Ludovico ao regime militar e à redemocratização, a criação do Tocantins pela Constituição de 1988 e os governos recentes.","incidencia":"media"},{"id":"goias-sociedade-e-cultura","titulo":"Povoamento, indígenas, escravidão e cultura popular","blocos":2,"itens":["pmgo-goias-04"],"foco":"Povos indígenas como os Karajá, a escravidão e a cultura negra nas minas, os Kalunga, os movimentos sociais no campo e festas como as Cavalhadas de Pirenópolis.","incidencia":"media"},{"id":"goias-geografia-fisica","titulo":"Aspectos físicos: vegetação, clima, relevo e hidrografia","blocos":2,"itens":["pmgo-goias-02"],"foco":"Cerrado como bioma dominante, clima tropical com inverno seco, planaltos e chapadas como a dos Veadeiros e as bacias do Araguaia, do Tocantins e do Paranaíba.","incidencia":"alta"},{"id":"goias-atualidades","titulo":"Atualidades de Goiás","blocos":1,"itens":["pmgo-goias-05"],"foco":"Agronegócio e indústria, fatos políticos e sociais recentes do estado e programas do governo estadual.","incidencia":"alta"}]}],"itens":[{"id":"pmgo-portugues-01","fonte":"PMGO","disciplina":"Português","num":"1","texto":"Compreensão e interpretação de texto."},{"id":"pmgo-portugues-02","fonte":"PMGO","disciplina":"Português","num":"2","texto":"Tipologia e gêneros textuais."},{"id":"pmgo-portugues-03","fonte":"PMGO","disciplina":"Português","num":"3","texto":"Figuras de linguagem."},{"id":"pmgo-portugues-04","fonte":"PMGO","disciplina":"Português","num":"4","texto":"Significação de palavras e expressões."},{"id":"pmgo-portugues-05","fonte":"PMGO","disciplina":"Português","num":"5","texto":"Relações de sinonímia e de antonímia."},{"id":"pmgo-portugues-06","fonte":"PMGO","disciplina":"Português","num":"6","texto":"Ortografia."},{"id":"pmgo-portugues-07","fonte":"PMGO","disciplina":"Português","num":"7","texto":"Acentuação gráfica."},{"id":"pmgo-portugues-08","fonte":"PMGO","disciplina":"Português","num":"8","texto":"Uso da crase."},{"id":"pmgo-portugues-09","fonte":"PMGO","d window.CONTEUDO = {"frases":["Sentar e abrir o material já é metade do bloco.","Hoje não precisa ser o melhor dia. Precisa ser um dia estudado.","Vinte e cinco minutos contam. Zero minuto não conta.","Quem passa não é quem nunca falhou. É quem voltou no dia seguinte.","Falhar um dia é ruído. Falhar dois é o começo da queda. Hoje você decide qual dos dois.","A vontade chega depois que você começa, não antes.","Ninguém lembra dos dias fáceis de estudo. A aprovação sai dos dias difíceis.","O plano funciona se você aparecer. Só isso.","Rotina não é motivação. É decisão tomada na véspera.","Deixe o material aberto na mesa hoje. Amanhã você só senta.","Cansado também estuda. Estuda menos, mas estuda.","Um bloco bem feito vale mais que uma tarde inteira distraída.","Cada questão errada hoje é uma a menos errada na prova.","Errar em casa é barato. Errar na prova custa a vaga.","Revisão não é perda de tempo. É o que impede o tempo de se perder.","O que você estudou e não revisou, você só visitou.","Constância ganha de intensidade. Todo dia um pouco ganha de um sábado inteiro.","A farda não sabe se você estava com vontade. Ela sabe se você estudou.","Tem gente estudando agora pela sua vaga. Senta.","Não negocie com o sofá. Ele sempre ganha a discussão.","Comece pelo mais fácil se precisar. Mas comece.","O celular pode esperar cinquenta minutos. Seu futuro não.","Um dia ruim de estudo ainda é melhor que um dia bom sem estudo.","A prova vai cobrar o que você fez nos dias comuns.","Você não precisa saber tudo. Precisa saber mais que a nota de corte.","Disciplina é cumprir o combinado com você mesmo quando ninguém está olhando.","Estudar é chato em alguns dias. Continuar onde está é chato todos os dias.","O bloco da manhã é seu. Ninguém tira ele de você.","Quem espera o dia perfeito estuda duas vezes por mês.","Termine o bloco. A sensação de terminar abastece o próximo.","Dormiu tarde? Faça a versão mínima e durma cedo hoje. Pronto.","Não compare o seu capítulo 3 com o capítulo 20 de outra pessoa.","Dois anos de estudo não se perdem. Eles viram vantagem quando você mantém o ritmo.","A diferença entre quase passar e passar costuma ser de poucas questões.","Uma questão a mais por dia, em seis meses, vira quase duzentas.","Anote o erro. Erro anotado vira acerto na revisão.","A lei seca é chata e é nela que mora o ponto fácil.","Quando der vontade de parar, faça só mais cinco questões.","Você não controla a data do edital. Controla o que faz até ele sair.","Estudo bom é o que acontece. O resto é plano.","Quem troca o bloco por \"só hoje\" troca a vaga por \"só dessa vez\".","A aprovação é feita de dias sem graça somados.","Ninguém precisa de motivação pra escovar os dentes. O estudo pode virar a mesma coisa.","A cadeira é o lugar onde a farda começa.","Você já provou que consegue estudar cansado. Prove de novo hoje.","Um dia perdido não se recupera. Se evita amanhã.","Tarefa perdida morre. Não carregue dívida, só volte ao plano.","Semana ruim não apaga mês bom. Continue.","A prova não pergunta se você teve uma semana difícil.","Foco é dizer não pra coisas boas também.","Pouco tempo bem usado rende mais que muito tempo mal usado.","Ler não é estudar. Estudar é ler e depois conferir se aprendeu.","Questão resolvida é o termômetro. Confie mais nela do que na sensação.","A sensação de saber engana. O acerto não.","Se está difícil, é porque você está aprendendo algo novo.","Toda matéria parece enorme até você começar a riscar os assuntos.","O edital acaba. Um assunto de cada vez.","Hoje você tem um assunto pra estudar, não o edital inteiro.","Estude como quem vai ser cobrado amanhã. Porque vai.","O concurso premia quem sabe o básico muito bem.","O detalhe que você pulou hoje é a pegadinha da prova.","Quem revisa lembra. Quem não revisa reaprende.","Guarde o domingo. Descanso também faz parte do plano.","Das 23h à meia-noite é seu. Aproveite sem culpa, você fez a sua parte.","Descansar não é desistir. É carregar a bateria pro bloco de amanhã.","Corpo cansado da academia dorme melhor. Sono bom é estudo melhor.","Não existe atalho. Existe caminho feito todo dia.","Pare de procurar o método perfeito. O seu é sentar às 8h30.","Quando a matéria travar, volte uma casa e revise a base.","Três blocos feitos hoje valem mais que seis prometidos pra amanhã.","A mesa arrumada na véspera é meia vitória da manhã.","Você está a uma rotina de distância da farda.","O concorrente mais perigoso é a sua própria desculpa.","Estudar com medo da prova é normal. Deixar de estudar por isso não é.","Cada assunto fechado é uma porta a menos entre você e a vaga.","A vaga não é sorte. É o acumulado de manhãs como esta.","Hoje é um bom dia pra acertar o que você errou semana passada.","Sua meta de hoje cabe em três blocos. Faça os três.","Faça o difícil enquanto a cabeça está fresca.","Pausa de dez minutos é pausa. Pausa de uma hora é outra coisa.","O importante não é estudar muito num dia. É não zerar nenhum.","Se sobrar só um bloco, faça as questões de ontem.","Quem estuda todo dia não precisa de maratona na véspera.","O conteúdo não entra de uma vez. Entra em camadas.","Esquecer faz parte. Revisar é a resposta.","Paciência com você. Cobrança com o plano.","Você não está atrasado. Está onde a sua rotina te colocou. Ajuste a rotina.","A farda vai pesar menos que esse esforço de agora.","Cada acerto no mini simulado é tempo que você devolve pro edital.","Você sabe mais do que acha. O mini simulado confirma ou desmente.","Não pule matéria pela vontade. Pule pelo acerto.","Assunto que você já sabe também precisa de questão pra confirmar.","O que cai em prova é previsível. Estude o previsível muito bem.","Deu preguiça? Ligue o cronômetro e comece com cinco minutos.","Ninguém fica pronto. A gente fica preparado.","Uma revisão de quinze minutos segura um assunto de três horas.","O tempo passa igual pra quem estuda e pra quem não estuda.","Abril chega de qualquer jeito. Chegue estudado.","Estudar sozinho é normal. Passar sozinho também.","A banca repete temas. Quem faz questão percebe.","Leia o enunciado inteiro. A pegadinha mora na última linha.","Na dúvida entre duas, volte ao texto da lei.","Aprender com o erro exige olhar pra ele. Leia o comentário.","O caderno de erros é o livro mais importante da sua preparação.","O trabalho vai cansar hoje. Os três blocos da manhã já vão estar feitos.","Questão no celular no tempo vago do trabalho é ponto ganho de graça.","Quem usa o tempo morto chega vivo na prova.","Cinco questões na fila do almoço também contam.","Não precisa gostar da matéria. Precisa acertar a questão dela.","A matéria que você odeia é a que mais te separa dos outros.","Raciocínio lógico melhora com volume, não com talento.","Português decide empate. Trate como prioridade.","Direito Penal é o coração da prova. Cuide bem dele.","Lei seca lida em voz baixa gruda mais.","Termine o dia sabendo o que vai estudar amanhã.","Dia bom é dia planejado na véspera.","A ansiedade diminui quando o plano está claro. Olhe o plano.","Um passo por vez. O próximo passo é o bloco das 8h30.","Estudar pouco hoje não é o problema. O problema é parar amanhã.","Pequenas vitórias diárias viram vantagem no dia da prova.","O mérito não está no dia em que você estava animado.","Quem mantém a ofensiva mantém a cabeça no jogo.","O bloqueio salva a ofensiva. Não salva o conteúdo. Estude.","Sua ofensiva é a prova de que você cumpre o que promete.","Não quebre a corrente por causa de um dia cheio. Faça a versão mínima.","Se o dia apertou, 25 minutos. Se sobrou tempo, mais um bloco.","Ninguém passa estudando só quando dá vontade.","O resultado demora. A rotina não pode demorar.","Você não precisa de mais horas. Precisa das mesmas horas todo dia.","A primeira questão do dia é a mais difícil de começar. As outras vêm.","Resolva antes de olhar o gabarito. Chute consciente também ensina.","Erro repetido é assunto pedindo revisão.","Acerto de 60% é aviso. Acerto de 80% é caminho.","Nota de corte é média. Você precisa estar acima dela, não perto.","O aprovado também teve preguiça. Ele só estudou mesmo assim.","Hoje você escolhe entre o conforto de agora e a farda de depois.","A prova dura algumas horas. A preparação é que decide.","O seu eu de abril vai agradecer pelo seu eu de hoje.","Cada manhã estudada é um tijolo. Ninguém vê o prédio enquanto ele sobe.","Não espere clareza pra começar. Ela aparece no meio do caminho.","Ficou em dúvida no assunto? Faça dez questões e a dúvida vira um ponto concreto.","Não estude pra se sentir produtivo. Estude pra acertar questão.","Grifar tudo é o mesmo que não grifar nada.","Resumo curto e revisado vale mais que resumo bonito e esquecido.","Mais questões, menos teoria repetida.","Teoria sem questão é mapa sem viagem.","Quem entende o porquê do erro não erra de novo.","Você está treinando pra um dia só. Faça cada dia valer um pouco.","O concurso não mede inteligência. Mede preparação.","Não existe \"não sou bom nessa matéria\". Existe \"ainda não fiz questões suficientes\".","O primeiro mês é o mais difícil. Depois vira hábito.","A rotina protege você dos dias sem vontade.","Quando tudo parecer lento, olhe o % do edital. Ele não mente.","Progresso pequeno ainda é progresso.","Você já fez coisa mais difícil do que três blocos de estudo.","Estudar de manhã é começar o dia ganhando.","Antes do trabalho, a sua parte. Depois dele, o descanso.","Seu tempo é curto. Por isso ele precisa ser protegido.","Não deixe uma notificação decidir o seu bloco.","Modo avião por cinquenta minutos não mata ninguém.","Distração se paga com a vaga indo pra alguém mais focado.","Três blocos focados rendem mais que seis picados.","A redação também se treina. Uma por quinzena faz diferença.","Escrever à mão agora evita a mão travando na prova.","Redação boa é redação clara. Não precisa ser bonita.","A banca corrige o que está no papel, não o que você quis dizer.","Pense na farda, mas trabalhe na questão de hoje.","O sonho é a farda. O trabalho é o bloco das 8h30.","Motivação é o motivo. Disciplina é o método.","Você não precisa se sentir pronto. Precisa estar em dia.","A semana perfeita é rara. A semana cumprida está ao seu alcance.","Falhou? Registra, entende e segue. Sem drama e sem desculpa.","O plano não te julga. Ele só mostra o próximo passo.","Hoje não é teste. É treino. Treine.","Quem corre atrás todo dia não precisa correr no fim.","A reta final começa hoje pra quem começa hoje.","Faltando pouco ou muito, a resposta é a mesma: próximo assunto.","Não aumente o plano na semana boa. Mantenha e siga.","Na semana ruim, diminua. Nunca zere.","O que te trouxe até aqui foi constância. Continue com ela.","Você não precisa estudar como os outros. Precisa estudar todo dia.","Compare você com você de ontem. É a única comparação justa.","Alguém passou com menos tempo? Ótimo. Você vai passar com o seu.","O resultado dos outros não muda a sua questão de hoje.","Não existe matéria pequena quando a vaga se decide por uma questão.","Toda questão vale o mesmo ponto. Não despreze as fáceis.","Ponto fácil perdido por pressa dói mais que ponto difícil.","Leia devagar, marque rápido.","Gabarito é consequência de muito caderno aberto.","O dia da prova é só mais um dia de questões. Treine pra ele ser assim.","O nervosismo diminui quando o conteúdo está revisado.","Confiança se constrói com acerto, não com frase bonita.","Faça hoje o que o seu eu da véspera da prova gostaria que você tivesse feito.","A vaga tem nome. Estude pra ser o seu.","Pense na primeira vez que vai vestir a farda. Depois volte pro bloco.","Sua família vai ver a farda. O bloco das 8h30 só você vai ver.","Ninguém vai estudar por você. O lado bom: ninguém vai tirar isso de você.","O esforço é seu e o resultado também vai ser.","Um assunto fechado hoje é um assunto a menos pra se preocupar.","Continue. Não precisa ser rápido, precisa ser contínuo.","Cronômetro rodando é a melhor frase motivacional que existe.","Não pense em quantas horas faltam. Pense no bloco que está na sua frente.","Se hoje tudo deu errado, estude 25 minutos e ganhe o dia assim.","O plano está pronto. Só falta você sentar.","Quem prepara a véspera acorda sem precisar decidir nada.","O ruim de estudar passa em cinquenta minutos. O bom fica.","Cada revisão feita no dia certo economiza horas de reestudo.","Revisão atrasada é conteúdo escorrendo. Faça hoje.","A memória é preguiçosa. A revisão é o empurrão.","Você está construindo um candidato que a banca não derruba.","Hoje é dia de fazer o simples bem feito.","Não existe dia neutro. Ou aproxima da farda ou afasta.","Uma hora de estudo de verdade vale mais que três fingindo.","Quem estuda cansado aprende a fazer prova cansado.","A prova é longa. O treino de foco começa no bloco de hoje.","Quando bater o desânimo, lembre por que você começou há dois anos.","Dois anos de estrada. Não é hora de sair dela.","A diferença entre o aprovado e o quase é quem continuou mais um pouco.","Senta, abre, começa. O resto vem."],"dicas":["Anote no fim do bloco 3 o que entra na revisão de amanhã. Assim o bloco 1 começa sem você precisar decidir nada.","Faça as questões da teoria de ontem antes de reler a teoria. Tentar lembrar fixa mais do que reler.","Use videoaula em 1,5x quando o professor for lento. Volte pra velocidade normal só no trecho difícil.","Depois de cada videoaula, feche o material e escreva de memória três pontos do assunto. O que não sair é o que precisa de revisão.","Leia a lei seca do assunto no mesmo dia da teoria. Marque só o que costuma virar pegadinha: prazos, verbos e exceções.","Monte um caderno de erros. Para cada questão errada, anote o assunto, o erro e a regra certa em uma linha.","Releia o caderno de erros na revisão de domingo. É o material mais personalizado que você tem.","Deixe o celular em outro cômodo durante o bloco. Longe da vista, ele para de chamar.","Use o modo avião nos 50 minutos. Mensagem pode esperar a pausa de 10.","Na pausa, levante, beba água e olhe pela janela. Rede social come a pausa inteira.","Estude o assunto mais difícil no bloco 2, das 9h30 às 10h20. É o seu pico de atenção do dia.","Se chegar cansado ao bloco, comece pelas questões. Questão liga a cabeça mais rápido que teoria.","A versão mínima é de 25 minutos. Num dia caótico, faça as questões de ontem e encerre sem culpa.","Durma pelo menos 7 horas. O que você estudou de manhã se fixa no sono da noite.","Evite teoria nova depois das 22h. Se quiser usar esse horário, faça só questões leves.","Deixe o material aberto na mesa antes de dormir. A manhã começa com uma decisão a menos.","Resumo bom cabe em uma página por assunto. Se passou disso, é cópia.","Não grife mais de uma linha por parágrafo. Grifo demais esconde o que importa.","Faça pelo menos 20 questões de um assunto antes de considerá-lo estudado.","Acerto abaixo de 60% num assunto pede revisão da teoria. Acima de 80%, mais questões e siga em frente.","Resolva questões por assunto no começo e provas completas na reta final.","Ao errar, leia o comentário até entender por que cada alternativa errada está errada.","Marque as questões que você acertou no chute. Elas são erros disfarçados e merecem revisão.","Revise em 7 e em 30 dias. É nessas janelas que o esquecimento mais derruba o que você aprendeu.","Revisar não é reler tudo. É fazer questões e reler só o que errou.","Use flashcards pra números: prazos, quóruns, idades e penas. Cinco minutos por dia seguram muita coisa.","Antes de ler um artigo de lei, tente adivinhar o que ele diz. Depois confira. A comparação fixa.","Explique o assunto em voz alta como se fosse pra um colega. Onde você travar está a lacuna.","No sábado, não fique horas na mesma matéria. Alternar assuntos ajuda a memória.","Se um assunto travar por mais de 20 minutos, anote a dúvida e siga. Volte nele na revisão.","Assunto marcado como domino se prova no mini simulado, não na sensação.","Faça o mini simulado descansado. Ele gasta uma das 3 chances.","Antes do mini simulado, leia a lei seca do assunto. Não é trapaça, é revisão.","Use o tempo vago do trabalho pra questões no celular. Teoria nova pede atenção que o trabalho não deixa.","No celular, faça blocos de 5 questões. Cabem numa pausa e não perdem o fio se você for interrompido.","Leia uma notícia do DF e uma de Goiás por dia. Atualidades se acumula aos poucos.","Mantenha o horário de acordar no sábado. A manhã de segunda agradece.","Beba água durante o bloco. Desidratação leve já derruba a concentração.","Café ajuda, mas não substitui sono. Duas noites mal dormidas apagam o efeito de qualquer café.","Em matéria de decoreba, crie seus próprios mnemônicos. O que você cria lembra melhor do que o pronto.","Estude com o material que você já tem. Trocar de curso toda hora custa mais que qualquer apostila fraca.","Um PDF bem lido vale mais que três cursos pela metade.","Registre o tempo no cronômetro do site. O que não é medido some da cabeça como se não tivesse sido feito.","Olhe o % do edital uma vez por semana, não todo dia. Progresso diário é pequeno demais pra animar.","Na semana boa, não aumente o plano. Guarde energia pra semana ruim.","Se faltar dois dias seguidos, volte com a versão mínima. O retorno leve é o que segura o hábito.","Tarefa perdida não se remarca. Retome do próximo item da fila e siga.","No fim do sábado, separe 10 minutos pra olhar a semana: o que atrasou e o que precisa de reforço.","Faça questões de bancas diferentes do mesmo assunto. Isso mostra o que é regra e o que é estilo da banca.","Em matemática, refaça a questão errada no dia seguinte sem olhar a resolução.","Em português, justifique cada resposta com a regra. Acerto por intuição não se repete na prova.","Em direito, leia o artigo inteiro, com os parágrafos. A exceção costuma estar no parágrafo.","Leia os comentários mais votados nas plataformas de questões. Muitas vezes explicam melhor que o gabarito.","Em questão longa, leia o enunciado duas vezes: uma pra entender, outra pra achar a pegadinha.","Não estude deitado. O corpo entende que é hora de descansar.","Deixe na mesa só o material do bloco. Tudo que está à vista disputa a sua atenção.","Se o ambiente tiver barulho, use fone sem música ou com música sem letra.","Use o edital como checklist. Cada assunto marcado é uma parte da prova que já é sua.","Quando o ânimo cair, reduza a meta, não pare. Meta menor cumprida mantém a rotina de pé.","Treine a letra pra redação. A banca não pontua o argumento que não consegue ler.","A Cebraspe em múltipla escolha costuma pôr duas alternativas quase iguais. A diferença está numa palavra: sempre, somente, pode, deve.","Desconfie de alternativa com sempre, nunca ou exclusivamente. Em direito, quase toda regra tem exceção.","A AOCP gosta de cobrar a letra da lei com uma palavra trocada. Releia a lei seca antes da prova.","Divida o tempo da prova antes de começar: redação, questões e 15 minutos pra passar o gabarito.","Comece a prova pela matéria em que você é mais forte. Ganhar ponto cedo acalma.","Não fique mais de 3 minutos numa questão. Marque, pule e volte no fim.","Passe o gabarito em blocos de 10 questões, não tudo no final. Evita a correria nos últimos minutos.","Se a prova não desconta ponto por erro, não deixe nenhuma em branco. Elimine o que puder e chute entre o que sobrar.","Pra chutar melhor, elimine primeiro as alternativas absurdas. Entre duas, fique com a mais próxima da letra da lei.","Leia a pergunta antes do texto de apoio. Assim você sabe o que procurar.","Em interpretação, a resposta está no texto. Não complete com o que você sabe do assunto.","Na redação da PMDF, cada um dos 5 critérios vale 4 pontos. Tema, coesão, estrutura, argumentação e gramática pesam igual.","Abaixo de 10 pontos na redação da PMDF o candidato é eliminado. Treine pra ficar longe desse limite.","Faça um rascunho curto da redação: tese, dois argumentos e fechamento. Só depois escreva.","Fugir do tema derruba o critério que puxa os outros. Releia a proposta antes de começar a redação.","Use parágrafos de 4 a 6 linhas. Parágrafo gigante esconde falta de coesão.","Varie os conectivos: além disso, no entanto, portanto, dessa forma. Não repita o mesmo em todo parágrafo.","Evite gíria, abreviação e frase feita na redação. A banca desconta.","Na semana da prova, não estude conteúdo novo. Revise o caderno de erros e a lei seca.","Se der, visite o local da prova antes. Saber o caminho tira uma preocupação do dia.","Na véspera da prova, durma no horário de sempre. Uma noite não compensa o sono de uma semana.","Confira no edital o que levar no dia: documento com foto e caneta de tubo transparente costumam ser obrigatórios.","No dia da prova, coma algo leve e conhecido. Não é dia de testar comida nova.","Chegue cedo. Portão fechado não tem recurso.","Se bater o branco, pule a questão e siga. O branco some quando a cabeça volta a trabalhar.","Antes de começar, confira se o caderno é do seu cargo e se tem todas as páginas.","Não mude a resposta na revisão sem um motivo concreto. A primeira escolha fundamentada costuma estar certa.","Na reta final, faça provas completas no tempo real. O cansaço da terceira hora também se treina.","Antes de sair o edital, faça pelo menos uma prova anterior inteira da PMGO e uma da PMDF.","Quando o edital sair, compare o conteúdo com o do site e ajuste a lista de assuntos no mesmo dia.","Depois que o edital sair, use as primeiras semanas pra revisar o que mais cai, não pra começar matéria nova.","Legislação da PMDF vale 10 questões. É a matéria de maior peso fora dos conhecimentos específicos.","Na PMGO de 2022, zerar uma área de conhecimento eliminava, mesmo com nota total boa. Não abandone nenhuma matéria.","Na PMGO de 2022, era preciso 60% da nota total na objetiva. Treine pra passar disso com folga.","Na última prova de soldado da PMDF, o mínimo da objetiva era 60% dos pontos. Mire em 75% ou mais nos seus simulados.","Em direito, prova de soldado cobra mais letra de lei do que doutrina. Lei seca é prioridade.","Jurisprudência pesa mais na Cebraspe. Pra PMDF, estude os entendimentos do STF e do STJ sobre busca pessoal, flagrante e entrada em domicílio.","Questão com caso de abordagem policial é comum. Pense como o policial da cena e aplique a regra.","Se a alternativa descreve uma conduta, confira o verbo do tipo penal. Exigir, solicitar e receber são crimes diferentes.","Número cai: prazos, idades, penas. Revise sua tabela de números na semana da prova.","Leia a proposta de redação com a caneta na mão e sublinhe o que ela pede. Tudo o que foi sublinhado precisa aparecer no texto.","Treine a redação no espaço de linhas da prova. Escrever demais é tão ruim quanto escrever de menos.","Evite frase longa na redação. Duas frases claras valem mais que uma confusa.","Na conclusão da redação, retome a tese e feche. Não traga argumento novo no último parágrafo.","Guarde 10 minutos pra reler a redação e corrigir acento, crase e concordância. Erro gramatical custa ponto fácil.","Antes de abrir o caderno de prova, respire devagar: puxe o ar em 4 segundos e solte em 6.","Não discuta questões no intervalo ou na saída da prova. Isso só gera dúvida sem mudar nada.","Depois da prova, confira o gabarito preliminar e anote as questões com chance de recurso.","Se objetiva e redação forem no mesmo dia, deixe a redação pronta antes da última hora.","De vez em quando, escreva a redação à mão na folha impressa. Na prova não tem corretor automático."],"temas":[{"titulo":"Os limites entre a liberdade de expressão e o discurso de ódio nas redes sociais","proposta":"Discuta até onde vai a liberdade de expressão na internet e que medidas podem conter o discurso de ódio sem ferir direitos. Escreva um texto dissertativo-argumentativo com tese, argumentos e conclusão."},{"titulo":"O uso de câmeras corporais pelas polícias militares no Brasil","proposta":"Discorra sobre os efeitos das câmeras corporais na atuação policial, na produção de provas e na confiança da população. Posicione-se de forma fundamentada."},{"titulo":"A violência contra a mulher e o papel das instituições de segurança pública","proposta":"Analise por que a violência contra a mulher persiste no Brasil e como polícia, Justiça e sociedade podem atuar para reduzi-la."},{"titulo":"O avanço das apostas on-line e seus impactos sociais","proposta":"Discuta os efeitos das apostas esportivas pela internet sobre a renda das famílias, a saúde mental e a segurança pública."},{"titulo":"Segurança pública: dever do Estado e responsabilidade de todos","proposta":"A partir do art. 144 da Constituição, discuta o papel do cidadão na prevenção da violência e na cooperação com as forças de segurança."},{"titulo":"A saúde mental dos profissionais de segurança pública","proposta":"Discorra sobre os fatores que afetam a saúde mental de policiais e sobre as medidas que as instituições podem adotar para protegê-los."},{"titulo":"Os desafios do combate ao tráfico de drogas nas cidades brasileiras","proposta":"Discuta os limites da repressão e o papel da prevenção, da educação e das políticas sociais no enfrentamento ao tráfico."},{"titulo":"A influência das redes sociais na formação dos jovens","proposta":"Analise os efeitos positivos e negativos das redes sociais sobre adolescentes e proponha formas de reduzir os danos."},{"titulo":"A desinformação e a saúde da democracia","proposta":"Discuta como as notícias falsas afetam o debate público e as eleições e que medidas podem ser adotadas por plataformas, Estado e cidadãos."},{"titulo":"A violência no trânsito e a responsabilidade individual","proposta":"Discorra sobre as causas dos acidentes graves, como álcool ao volante e excesso de velocidade, e sobre o equilíbrio entre fiscalização e educação."},{"titulo":"Os golpes digitais e a proteção do cidadão","proposta":"Analise o crescimento das fraudes pela internet e pelo telefone e as formas de prevenção por parte do cidadão, dos bancos e do poder público."},{"titulo":"A ressocialização de presos e a redução da reincidência","proposta":"Discuta se o sistema prisional brasileiro cumpre a função de ressocializar e o que poderia reduzir a volta ao crime."},{"titulo":"O trabalho infantil no Brasil do século XXI","proposta":"Discorra sobre as causas do trabalho infantil e o papel da família, da escola e do Estado no seu enfrentamento."},{"titulo":"A educação como forma de prevenir a criminalidade","proposta":"Analise a relação entre acesso à educação e violência e defenda um ponto de vista com argumentos consistentes."},{"titulo":"Os desafios da preservação do Cerrado","proposta":"Discuta as ameaças ao Cerrado, como desmatamento e queimadas, e o equilíbrio entre produção agrícola e proteção ambiental."},{"titulo":"As queimadas e a escassez de água no Centro-Oeste","proposta":"Discorra sobre as causas das queimadas e da falta de água na região e sobre medidas de prevenção."},{"titulo":"O policiamento comunitário como estratégia de segurança","proposta":"Discuta as vantagens da aproximação entre polícia e comunidade e os desafios para aplicar esse modelo."},{"titulo":"A proteção da pessoa idosa contra o abandono e a violência","proposta":"Analise o problema do abandono e da violência contra idosos e o papel da família, da sociedade e do Estado."},{"titulo":"A inclusão da pessoa com deficiência no mercado de trabalho","proposta":"Discuta as barreiras que ainda existem e as medidas que podem ampliar essa inclusão."},{"titulo":"Inteligência artificial e reconhecimento facial na segurança pública","proposta":"Discorra sobre os benefícios e os riscos dessas ferramentas, considerando eficiência, erros de identificação e direitos individuais."},{"titulo":"A superlotação dos presídios brasileiros","proposta":"Discuta as causas da superlotação e suas consequências para a segurança pública e para os direitos humanos."},{"titulo":"O bullying e o cyberbullying nas escolas","proposta":"Analise os efeitos do bullying na vida dos estudantes e o papel da escola e da família na prevenção."},{"titulo":"O aumento da população em situação de rua","proposta":"Discuta as causas desse aumento nas  mecanismos de controle da corrupção."},{"titulo":"O trabalho por aplicativos e os direitos do trabalhador","proposta":"Discuta a situação de entregadores e motoristas de aplicativo e o equilíbrio entre flexibilidade e proteção social."},{"titulo":"Os eventos climáticos extremos e a proteção da população","proposta":"Analise como enchentes, secas e ondas de calor afetam a população e o papel da defesa civil e dos órgãos de segurança."},{"titulo":"A leitura como instrumento de cidadania","proposta":"Discorra sobre a importância do hábito de leitura na formação crítica do cidadão."},{"titulo":"O papel da família na formação de valores","proposta":"Discuta a influência da família na prevenção de comportamentos de risco entre os jovens."},{"titulo":"O uso de celulares nas escolas","proposta":"Analise os efeitos da restrição ao uso de celulares nas escolas sobre o aprendizado e a convivência entre os alunos."},{"titulo":"A confiança da população nas instituições policiais","proposta":"Discuta os fatores que aumentam ou reduzem a confiança da sociedade na polícia e como fortalecê-la."}]};
