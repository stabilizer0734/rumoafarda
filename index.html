        ? html`<li>Se passar, o assunto conta como estudado e volta numa revisão em 30 dias. Depois de 3 reprovações, ele fica obrigatório.</li>`
        : html`<li>As 20 questões se espalham pelos ${plural(pendentes, 'assunto que falta', 'assuntos que faltam')}. Se passar, pulam os assuntos em que você não errou nenhuma. Os outros continuam na fila.${pendentes > 20 ? ' Como faltam mais de 20, os menores ficam de fora e continuam na fila.' : ''}</li>
           <li>Assunto que já está obrigatório não entra aqui.</li>
           <li>Reprovar 3 vezes aqui trava só o atalho da matéria. Cada assunto continua com as próprias 3 chances.</li>`}
      <li>O comentário de cada questão aparece no fim. Achou questão errada? Entre com recurso, até 2 por simulado.</li>
      <li>A chance só é gasta quando você entrega. Se fechar no meio, o simulado fica esperando.</li>
    </ul>
    <div class="card stack-sm">
      <div class="row between"><span class="bold">Chances usadas</span><span class="bold tabular">${Math.min(sit.tentativas, E.CHANCES_SIMULADO)} de ${E.CHANCES_SIMULADO}</span></div>
      ${sit.motivo === 'aprovado' ? html`<p class="small" style="color:var(--green-ink)">Você já passou neste mini simulado.</p>` : null}
      ${sit.motivo === 'bloqueado' ? html`<p class="small" style="color:var(--red-ink)">As 3 chances foram usadas.${alvo.tipo === 'assunto' ? ' Este assunto agora é obrigatório.' : ''}</p>` : null}
      ${sit.motivo === 'espera' && !emAndamento ? html`<p class="small">Próxima tentativa liberada ${quandoLibera(sit.liberaEm)}.</p>` : null}
    </div>
    ${!podeIA ? html`<div class="card aviso small">${AI.motivoIndisponivel()}</div>` : null}
    <button class="btn roxo bloco" disabled=${!podeIA || (!sit.pode && !emAndamento) || (alvo.tipo === 'materia' && !pendentes && !emAndamento)} onClick=${() => Simulado.gerar(alvo)}>${I.pular()} ${emAndamento ? 'Continuar simulado' : 'Gerar mini simulado'}</button>
  <//>`;
}

function QuizTela() {
  const e = useApp();
  const q = e.quiz;
  const [recurso, setRecurso] = useState({ k: null, txt: '' });
  const [recursoEnviando, setRecursoEnviando] = useState(false);
  const [recursoErro, setRecursoErro] = useState('');
  useTique(!!q && q.fase === 'respondendo', 1000);
  useEffect(() => {
    if (!q || q.fase !== 'respondendo') return;
    const f = ev => {
      if (ev.target && (ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'INPUT')) return;
      const k = ev.key.toUpperCase();
      const idx = '12345'.indexOf(k) >= 0 ? '12345'.indexOf(k) : LETRAS.indexOf(k);
      if (idx >= 0 && k.length === 1) { Simulado.responder(q.atual, idx); ev.preventDefault(); }
      else if (ev.key === 'ArrowRight') Simulado.ir(q.atual + 1);
      else if (ev.key === 'ArrowLeft') Simulado.ir(q.atual - 1);
    };
    document.addEventListener('keydown', f);
    return () => document.removeEventListener('keydown', f);
  }, [q && q.fase, q && q.atual]);
  if (!q) return null;
  const titulo = Simulado.titulo(q.alvo);
  const fechar = html`<button class="btn-ico" aria-label="Fechar" onClick=${() => Simulado.fechar()}>${I.x()}</button>`;

  if (q.fase === 'gerando' || q.fase === 'carregando') {
    return html`<div class="quiz" role="dialog" aria-label="Mini simulado">
      <div class="quiz-cab">${fechar}<div class="bold center">${titulo}</div><span></span></div>
      <div class="quiz-corpo"><div class="quiz-in"><div class="gerando">
        <div class="spinner" aria-hidden="true"></div>
        <h2>${q.fase === 'gerando' ? 'Montando seu mini simulado' : 'Abrindo o simulado'}</h2>
        ${q.fase === 'gerando' ? html`<p class="muted">${q.feitas ? q.feitas + ' de 20 questões escritas' : 'O Claude está lendo os itens do edital. Leva de meio minuto a dois minutos.'}</p>
          <div style="width:min(320px,80vw)"><${Barra} pct=${(q.feitas || 0) / 20} cor="var(--purple)"/></div>
          <p class="card-sub">Se aparecer um pedido de permissão pra usar o Claude, aceite.</p>` : null}
      </div></div></div>
      <div class="quiz-pe"><div class="quiz-pe-in"><span></span><button class="btn fantasma" onClick=${() => Simulado.fechar()}>Cancelar</button></div></div>
    </div>`;
  }

  if (q.fase === 'erro') {
    return html`<div class="quiz" role="dialog" aria-label="Mini simulado">
      <div class="quiz-cab">${fechar}<div class="bold center">${titulo}</div><span></span></div>
      <div class="quiz-corpo"><div class="quiz-in"><div class="gerando">
        <span style="width:56px;height:56px;color:var(--red);display:inline-grid">${I.alerta()}</span>
        <h2>Não deu pra continuar</h2><p class="muted">${q.msg}</p>
      </div></div></div>
      <div class="quiz-pe"><div class="quiz-pe-in"><button class="btn fantasma" onClick=${() => Simulado.fechar()}>Fechar</button>
        ${q.repetir ? html`<button class="btn roxo" onClick=${() => Simulado.continuar(q.alvo, q.repetir)}>Tentar de novo</button>` : AI.disponivel() ? html`<button class="btn roxo" onClick=${() => Simulado.gerar(q.alvo)}>Tentar de novo</button>` : null}</div></div>
    </div>`;
  }

  const doc = q.doc;
  const total = doc.questoes.length;

  if (q.fase === 'respondendo') {
    const i = q.atual;
    const qu = doc.questoes[i];
    const respondidas = doc.respostas.filter(r => r != null).length;
    const branco = total - respondidas;
    return html`<div class="quiz" role="dialog" aria-label="Mini simulado">
      <div class="quiz-cab">
        ${fechar}
        <${Barra} pct=${respondidas / total} cor="var(--green)"/>
        <span class="bold tabular muted">${fmtRelogio(Date.now() - q.inicio)}</span>
      </div>
      <div class="quiz-corpo"><div class="quiz-in">
        <div class="row between"><span class="upper muted">Questão ${i + 1} de ${total}</span>${q.alvo.tipo === 'materia' ? html`<span class="tag cinza">${nomeAssunto(qu.assunto)}</span>` : null}</div>
        <div class="quiz-enun">${qu.enunciado}</div>
        <div class="stack-sm">${qu.alternativas.map((alt, k) => html`<button class=${'alt' + (doc.respostas[i] === k ? ' sel' : '')} aria-pressed=${doc.respostas[i] === k ? 'true' : 'false'} onClick=${() => Simulado.responder(i, k)}><span class="letra">${LETRAS[k]}</span><span>${alt}</span></button>`)}</div>
        <div class="grade-q" aria-label="Ir para a questão">${doc.questoes.map((x, k) => html`<button aria-label=${'Questão ' + (k + 1)} class=${(doc.respostas[k] != null ? 'resp' : '') + (k === i ? ' atual' : '')} onClick=${() => Simulado.ir(k)}>${k + 1}</button>`)}</div>
        ${q.erroEntrega ? html`<div class="card alerta small">${q.erroEntrega}</div>` : null}
      </div></div>
      <div class="quiz-pe"><div class="quiz-pe-in">
        ${q.confirmar
          ? html`<span class="bold">${branco ? plural(branco, 'questão em branco', 'questões em branco') + '. Em branco conta como erro.' : 'Entregar agora?'}</span>
                 <div class="row"><button class="btn fantasma" disabled=${q.entregando} onClick=${() => App.set({ quiz: Object.assign({}, q, { confirmar: false }) })}>Voltar</button><button class="btn" disabled=${q.entregando} onClick=${() => Simulado.entregar()}>${q.entregando ? 'Corrigindo...' : 'Entregar'}</button></div>`
          : html`<button class="btn fantasma" disabled=${i === 0} onClick=${() => Simulado.ir(i - 1)}>Anterior</button>
                 <div class="row">
                   ${i < total - 1 ? html`<button class="btn-link" onClick=${() => App.set({ quiz: Object.assign({}, q, { confirmar: true }) })}>Entregar</button><button class="btn azul" onClick=${() => Simulado.ir(i + 1)}>Próxima</button>` : html`<button class="btn" onClick=${() => App.set({ quiz: Object.assign({}, q, { confirmar: true }) })}>Entregar</button>`}
                 </div>`}
      </div></div>
    </div>`;
  }

  // resultado
  const res = E.corrigirSimulado(doc.questoes, doc.respostas, doc.anuladas);
  const est = Simulado.estadoAlvo(q.alvo);
  const recursosUsados = (doc.recursos || []).length;
  const aberta = q.aberta;
  const pulados = q.pulados || [];
  const naoPulados = q.alvo.tipo === 'materia' ? Object.keys(res.porAssunto).filter(a => res.porAssunto[a].erros > 0) : [];
  const restam = Math.max(0, E.CHANCES_SIMULADO - est.tentativas);
  const enviarRecurso = async k => {
    setRecursoEnviando(true); setRecursoErro('');
    try { await Simulado.recurso(k, recurso.txt); setRecurso({ k: null, txt: '' }); }
    catch (err) { setRecursoErro((err && err.code ? AI.mensagem(err) : '') || Banco.mensagemErro(err)); }
    finally { setRecursoEnviando(false); }
  };
  return html`<div class="quiz" role="dialog" aria-label="Resultado do mini simulado">
    <div class="quiz-cab">${fechar}<div class="bold center">${titulo}</div><span></span></div>
    <div class="quiz-corpo"><div class="quiz-in">
      <div class="stack center" style="padding-top:8px">
        <div class="resultado-circ" style=${`--c:${res.aprovado ? 'var(--green)' : 'var(--red)'}`}><b class="tabular">${res.acertos}</b><span class="bold muted">de ${total}</span></div>
        <h2 style=${`font-size:26px;color:${res.aprovado ? 'var(--green-ink)' : 'var(--red-ink)'}`}>${res.aprovado ? 'Aprovado' : 'Não foi dessa vez'}</h2>
        <p class="muted">${res.aprovado
          ? (q.alvo.tipo === 'assunto' ? 'Assunto pulado. Ele volta numa revisão em 30 dias.' : (pulados.length ? plural(pulados.length, 'assunto pulado', 'assuntos pulados') : 'Assuntos sem erro foram pulados') + (naoPulados.length ? '. Os assuntos em que você errou continuam na fila.' : '.'))
          : (est.bloqueado ? (q.alvo.tipo === 'assunto' ? 'As 3 chances acabaram. O assunto agora é obrigatório.' : 'As 3 chances da matéria acabaram. Cada assunto ainda tem as próprias chances.') : 'Faltaram ' + plural(E.APROVACAO_SIMULADO - res.acertos, 'acerto', 'acertos') + '. ' + (restam ? 'Você tem mais ' + plural(restam, 'chance', 'chances') + ', a partir de amanhã.' : ''))}</p>
      </div>
      <div class="row between"><div class="card-t">Correção</div><span class="card-sub">Recursos: ${recursosUsados} de ${E.MAX_RECURSOS}</span></div>
      <div class="grade-q">${doc.questoes.map((x, k) => { const ok = doc.anuladas[k] || doc.respostas[k] === x.correta; return html`<button aria-label=${'Questão ' + (k + 1) + (ok ? ', certa' : ', errada')} class=${ok ? 'ok' : 'nok'} onClick=${() => App.set({ quiz: Object.assign({}, q, { aberta: aberta === k ? null : k }) })}>${k + 1}</button>`; })}</div>
      ${doc.questoes.map((x, k) => {
        const ok = doc.anuladas[k] || doc.respostas[k] === x.correta;
        const rec = (doc.recursos || []).find(r => r.q === k);
        if (aberta != null && aberta !== k) return null;
        return html`<div class="card stack-sm">
          <div class="row between"><span class="upper muted">Questão ${k + 1}${q.alvo.tipo === 'materia' ? ' · ' + nomeAssunto(x.assunto) : ''}</span>${doc.anuladas[k] ? html`<span class="tag ouro">Anulada</span>` : ok ? html`<span class="tag pmgo">Acertou</span>` : html`<span class="tag vermelha">${doc.respostas[k] == null ? 'Em branco' : 'Errou'}</span>`}</div>
          <div class="quiz-enun" style="font-size:16px">${x.enunciado}</div>
          <div class="stack-sm">${x.alternativas.map((alt, j) => html`<div class=${'alt' + (j === x.correta ? ' certa' : doc.respostas[k] === j ? ' errada' : '')}><span class="letra">${LETRAS[j]}</span><span>${alt}</span></div>`)}</div>
          <div class="small"><b>Comentário:</b> ${x.comentario}</div>
          ${rec ? html`<div class=${'card small ' + (rec.deferido ? 'info' : 'aviso')}><b>Recurso ${rec.deferido ? 'deferido' : 'indeferido'}.</b> ${rec.justificativa}</div>` : null}
          ${!ok && !rec && recursosUsados < E.MAX_RECURSOS && AI.disponivel() ? html`<details>
            <summary class="btn-link" style="cursor:pointer">Entrar com recurso</summary>
            <div class="stack-sm" style="margin-top:10px">
              <label class="rot" for=${'rec-' + k}>Por que a questão está errada?</label>
              <textarea id=${'rec-' + k} class="input" style="min-height:110px" value=${recurso.k === k ? recurso.txt : ''} onInput=${ev => setRecurso({ k, txt: ev.target.value })} placeholder="Ex.: a alternativa C também está correta porque o art. X diz..."></textarea>
              ${recursoErro && recurso.k === k ? html`<div class="small" style="color:var(--red-ink)">${recursoErro}</div>` : null}
              <div><button class="btn roxo peq" disabled=${recursoEnviando || recurso.k !== k || recurso.txt.trim().length < 15} onClick=${() => enviarRecurso(k)}>${recursoEnviando ? 'O Claude está julgando...' : 'Enviar recurso'}</button></div>
            </div>
          </details>` : null}
        </div>`;
      })}
      ${aberta != null ? html`<button class="btn-link" style="justify-self:start" onClick=${() => App.set({ quiz: Object.assign({}, q, { aberta: null }) })}>Ver todas as questões</button>` : null}
    </div></div>
    <div class="quiz-pe"><div class="quiz-pe-in"><span class="card-sub">${fmtMin(doc.duracaoMin || 0)} de prova</span><button class="btn" disabled=${recursoEnviando} onClick=${() => Simulado.fechar()}>Continuar</button></div></div>
  </div>`;
}

/* ==== telas-extras.js ==== */
/* Rumo à Farda: redação, perfil, conquistas, ajustes e boas-vindas. */

// ------------------------------------------------------------------ redação
function corNota(n) { return n == null ? 'var(--faint)' : n >= 16 ? 'var(--green)' : n >= 10 ? 'var(--orange)' : 'var(--red)'; }

function TelaRedacao() {
  const e = useApp();
  const [nova, setNova] = useState(false);
  const lista = Object.entries(e.redacoes).map(([id, r]) => Object.assign({ id }, r)).sort((a, b) => String(b.criadoEm || '').localeCompare(String(a.criadoEm || '')));
  const ultima = E.ultimaRedacao(e.dias);
  const proxima = E.proximaRedacao(e.cfg, e.dias, e.hoje);
  const notas = lista.filter(r => r.correcao).map(r => r.correcao.total);
  const media = notas.length ? notas.reduce((s, x) => s + x, 0) / notas.length : null;
  if (nova) return html`<div class="miolo-in"><${NovaRedacao} usados=${lista.map(r => r.tema && r.tema.titulo).filter(Boolean)} onFim=${() => setNova(false)}/></div>`;
  return html`<div class="miolo-in">
    <div class="dia-cab">
      <div class="upper muted">Redação</div>
      <h1>Uma a cada ${e.cfg.redacaoCadaDias || 14} dias</h1>
      <p class="card-sub">Nos dois concursos a redação elimina. Na PMDF são 5 critérios de 4 pontos, total 20, e abaixo de 10 o candidato sai.</p>
    </div>
    <div class="grade-num">
      <div class="num-card"><span style="color:var(--orange)">${I.pena()}</span><div><b>${lista.length}</b><span>redações</span></div></div>
      <div class="num-card"><span style="color:var(--gold-ink)">${I.estrela()}</span><div><b>${media == null ? '-' : media.toFixed(1).replace('.', ',')}</b><span>nota média</span></div></div>
      <div class="num-card"><span style="color:var(--blue)">${I.hoje()}</span><div><b>${!proxima ? '-' : proxima === e.hoje ? 'Hoje' : fmtDataCurta(proxima)}</b><span>próxima, no sábado</span></div></div>
    </div>
    <button class="btn laranja bloco" onClick=${() => setNova(true)}>${I.pena()} Nova redação</button>
    ${lista.length ? html`<div class="stack-sm">${lista.map(r => html`<button class="it" onClick=${() => App.abrir({ tipo: 'redacao', id: r.id })}>
      <div><div class="it-t">${r.tema ? r.tema.titulo : 'Sem tema'}</div><div class="it-s">${fmtData(r.data)}${r.correcao ? '' : ' · sem correção'}</div></div>
      <div class="bold tabular" style=${`color:${corNota(r.correcao ? r.correcao.total : null)};font-size:20px`}>${r.correcao ? String(r.correcao.total).replace('.', ',') : '-'}</div>
    </button>`)}</div>` : html`<div class="card center muted">Nenhuma redação ainda. A primeira fica marcada no sábado.</div>`}
  </div>`;
}

// Rascunho guarda texto e tema juntos, com id. Correção que termina depois só limpa o rascunho dela.
const RASCUNHO = 'rf:redacao:rascunho:v2';
const lerRascunho = () => { try { const r = JSON.parse(localStorage.getItem(RASCUNHO) || 'null'); return r && r.id ? r : null; } catch (e) { return null; } };
const gravarRascunho = r => { try { localStorage.setItem(RASCUNHO, JSON.stringify(r)); } catch (e) { /* ok */ } };
const limparRascunho = id => { const r = lerRascunho(); if (r && r.id === id) { try { localStorage.removeItem(RASCUNHO); } catch (e) { /* ok */ } } };

function NovaRedacao({ usados, onFim }) {
  const temas = CONT.temas;
  const [rasc] = useState(() => lerRascunho());
  const primeiro = Math.max(0, temas.findIndex(t => !usados.includes(t.titulo)));
  const [id] = useState(() => (rasc ? rasc.id : Banco.novoId()));
  const [tema, setTemaEstado] = useState(() => (rasc && rasc.tema ? rasc.tema : temas[primeiro]));
  const [ti, setTi] = useState(primeiro);
  const [etapa, setEtapa] = useState(rasc && rasc.texto ? 'escrever' : 'tema');
  const [texto, setTexto] = useState(rasc ? rasc.texto || '' : '');
  const [foto, setFoto] = useState(null);
  const [res, setRes] = useState(null);
  const [erro, setErro] = useState('');
  const [ocupado, setOcupado] = useState(false);
  const ctlRef = useRef(null);
  useEffect(() => () => { if (ctlRef.current) ctlRef.current.abort(); }, []);
  const salvarRasc = (novoTexto, novoTema) => gravarRascunho({ id, texto: novoTexto, tema: novoTema });
  const setTema = t => { setTemaEstado(t); salvarRasc(texto, t); };
  const mudarTexto = v => { setTexto(v); salvarRasc(v, tema); };
  const linhas = texto.split('\n').filter(l => l.trim()).length;
  const palavras = texto.trim() ? texto.trim().split(/\s+/).length : 0;
  const pedirTema = async () => {
    setOcupado(true); setErro('');
    try { setTema(await AI.temaNovo({ usados })); } catch (err) { setErro(AI.mensagem(err)); } finally { setOcupado(false); }
  };
  const corrigir = async () => {
    const ctl = new AbortController();
    ctlRef.current = ctl;
    setOcupado(true); setErro(''); setEtapa('corrigindo');
    try {
      const c = await AI.corrigirRedacao({ tema, texto, imagens: foto ? [foto] : null, signal: ctl.signal });
      await Acoes.salvarRedacao({ tema, texto: foto ? c.transcricao : texto, correcao: c });
      limparRascunho(id);
      if (!ctl.signal.aborted) { setRes({ correcao: c }); setEtapa('resultado'); }
    } catch (err) {
      if (ctl.signal.aborted) return;
      setErro(err && err.code && !('status' in err) ? AI.mensagem(err) || Banco.mensagemErro(err) : Banco.mensagemErro(err));
      setEtapa('escrever');
    } finally { if (!ctl.signal.aborted) setOcupado(false); ctlRef.current = null; }
  };
  const salvarSemCorrecao = async () => {
    setOcupado(true); setErro('');
    try { await Acoes.salvarRedacao({ tema, texto, correcao: null }); limparRascunho(id); onFim(); }
    catch (err) { setErro(Banco.mensagemErro(err)); }
    finally { setOcupado(false); }
  };
  return html`<div class="stack">
    <div class="row between"><button class="btn-link" onClick=${onFim}>Voltar</button><span class="upper muted">${{ tema: 'Tema', escrever: 'Texto', corrigindo: 'Correção', resultado: 'Nota' }[etapa]}</span></div>
    ${etapa === 'tema' ? html`
      <div class="card stack-sm" style="border-color:var(--orange)">
        <div class="upper" style="color:var(--orange-ink)">Tema</div>
        <h2 style="font-size:22px">${tema.titulo}</h2>
        <p>${tema.proposta}</p>
        <p class="card-sub">Texto dissertativo-argumentativo, de 20 a 30 linhas, em prosa. Dê um título se a proposta pedir.</p>
      </div>
      ${erro ? html`<div class="card alerta small">${erro}</div>` : null}
      <div class="row-wrap">
        <button class="btn fantasma" onClick=${() => { const n = ti + 1; setTi(n); setTema(temas[n % temas.length]); }}>Outro tema</button>
        ${AI.disponivel() ? html`<button class="btn fantasma" disabled=${ocupado} onClick=${pedirTema}>${ocupado ? 'Criando...' : 'Tema inédito com o Claude'}</button>` : null}
      </div>
      <div class="card stack-sm">
        <div class="card-t">Como fazer</div>
        <ol class="lista-simples small">
          <li>Ligue o cronômetro de 60 minutos.</li>
          <li>Escreva à mão, em folha pautada, como na prova.</li>
          <li>Depois passe o texto pro site${AI.imagens ? ' ou mande uma foto' : ''}${AI.disponivel() ? ' e peça a correção' : ''}.</li>
        </ol>
        <div class="row-wrap"><button class="btn laranja" onClick=${() => { salvarRasc(texto, tema); Cron.novo({ modo: 'bloco', blocoIdx: null, blocoTipo: 'redacao', nome: 'Redação', alvoMin: 60, itens: [], bloco: null }); setEtapa('escrever'); }}>${I.cronometro()} Cronometrar 60 min</button><button class="btn fantasma" onClick=${() => { salvarRasc(texto, tema); setEtapa('escrever'); }}>Já escrevi</button></div>
      </div>` : null}
    ${etapa === 'escrever' ? html`
      <div class="card stack-sm"><div class="upper muted">Tema</div><div class="bold">${tema.titulo}</div></div>
      ${AI.imagens && AI.disponivel() ? html`<div class="campo"><label for="red-foto">Foto da folha (opcional)</label><input id="red-foto" class="input" type="file" accept=${(AI.imagens.mediaTypes || ['image/jpeg', 'image/png']).join(',')} onChange=${ev => setFoto(ev.target.files && ev.target.files[0] ? ev.target.files[0] : null)}/><span class="card-sub">Com foto, o Claude transcreve e corrige. Letra legível ajuda.</span></div>` : null}
      <div class="campo"><label for="red-texto">${foto ? 'Texto (opcional com foto)' : 'Seu texto, como ficou no papel'}</label><textarea id="red-texto" class="input" value=${texto} onInput=${ev => mudarTexto(ev.target.value)} placeholder="Digite a redação como você escreveu, com os mesmos parágrafos."></textarea><span class="card-sub tabular">${plural(linhas, 'parágrafo ou linha', 'parágrafos ou linhas')} · ${plural(palavras, 'palavra', 'palavras')}</span></div>
      ${erro ? html`<div class="card alerta small">${erro}</div>` : null}
      <div class="row-wrap">
        ${AI.disponivel() ? html`<button class="btn laranja" disabled=${ocupado || (!foto && palavras < 60)} onClick=${corrigir}>Corrigir com o Claude</button>` : html`<div class="card aviso small">${AI.motivoIndisponivel()}</div>`}
        <button class="btn fantasma" disabled=${ocupado || palavras < 30} onClick=${salvarSemCorrecao}>Salvar sem correção</button>
      </div>` : null}
    ${etapa === 'corrigindo' ? html`<div class="gerando"><div class="spinner"></div><h2>Corrigindo pelos critérios da banca</h2><p class="muted">Leva de meio minuto a um minuto e meio. Se sair desta tela, a correção é cancelada e o texto fica guardado.</p></div>` : null}
    ${etapa === 'resultado' && res ? html`<${CorrecaoView} tema=${tema} correcao=${res.correcao}/><button class="btn bloco" onClick=${onFim}>Concluir</button>` : null}
  </div>`;
}

function CorrecaoView({ tema, correcao, texto }) {
  const c = correcao;
  return html`<div class="stack">
    <div class="card stack-sm center">

// ------------------------------------------------------------------ perfil
function TelaPerfil() {
  const e = useApp();
  const ctx = App.ctx();
  const hoje = e.hoje;
  const st = E.estatisticas(ctx, hoje);
  const of = E.ofensiva(e.cfg, e.dias, hoje);
  const xp = E.xpTotal(e.cfg, e.dias);
  const pat = E.patente(xp);
  const conq = E.avaliarConquistas(ctx, hoje);
  const atingidas = conq.filter(c => c.atingida).length;
  // mapa de calor: 16 semanas
  const seg = E.segundaDaSemana(hoje);
  const inicio = E.addDias(seg, -15 * 7);
  const celulas = [];
  for (let d = inicio; d <= E.addDias(seg, 6); d = E.addDias(d, 1)) {
    const m = E.minutosDoDia(e.dias[d]);
    const h = of.historico[d];
    const n = d > hoje ? '' : h === 'bloqueio' ? 'bloq' : m >= 150 ? 'n3' : m >= 60 ? 'n2' : m > 0 ? 'n1' : '';
    celulas.push(html`<i class=${n} title=${fmtData(d) + ': ' + fmtMin(m)}></i>`);
  }
  return html`<div class="miolo-in">
    <div class="dia-cab"><div class="upper muted">Perfil</div><h1>Seu progresso</h1></div>
    <div class="card stack-sm">
      <div class="row"><span style="width:48px;height:48px;display:inline-grid;color:var(--blue)">${I.divisa()}</span><div class="grow"><div class="upper muted">Patente</div><div class="card-t" style="font-size:22px">${pat.nome}</div></div><div class="bold tabular" style="color:var(--gold-ink)">${fmtNum(xp)} XP</div></div>
      <${Barra} pct=${pat.pct} cor="var(--gold)"/>
      <div class="card-sub">${pat.proxima ? 'Faltam ' + fmtNum(pat.proxima.xp - xp) + ' XP pra ' + pat.proxima.nome + '.' : 'Patente máxima.'} XP vem de minuto estudado, questão lançada, acerto, simulado e redação.</div>
    </div>
    <div class="grade-num">
      <div class="num-card"><span style="color:var(--orange)">${I.fogo()}</span><div><b>${of.atual}</b><span>ofensiva · recorde ${of.recorde}</span></div></div>
      <div class="num-card"><span style="color:var(--green)">${I.cronometro()}</span><div><b>${fmtHoras(st.minTotal)}</b><span>no total · ${fmtHoras(st.minSemana)} na semana</span></div></div>
      <div class="num-card"><span style="color:var(--blue)">${I.alvo()}</span><div><b>${fmtNum(st.questoes)}</b><span>${st.questoes ? 'questões · ' + fmtPct(st.acertos / st.questoes) + ' de acerto' : 'questões lançadas'}</span></div></div>
      <div class="num-card"><span style="color:var(--gold-ink)">${I.trofeu()}</span><div><b>${atingidas}/${conq.length}</b><span>conquistas</span></div></div>
    </div>
    <div class="card stack-sm">
      <div class="row between"><div class="card-t">Últimas 16 semanas</div><span class="card-sub">minutos por dia</span></div>
      <div class="calor" aria-label="Mapa de estudo">${celulas}</div>
      <div class="row-wrap tiny muted"><span>menos</span><span class="calor" style="display:flex;gap:4px"><i></i><i class="n1"></i><i class="n2"></i><i class="n3"></i></span><span>mais</span><span class="calor" style="display:flex"><i class="bloq"></i></span><span>bloqueio</span></div>
    </div>
    <div class="card stack">
      <div class="card-t">Edital por matéria</div>
      <div class="tab-mat">${e.cfg.ordemMaterias.map(mid => {
        const m = IDX.materias[mid];
        if (!m) return null;
        const pct = E.pctMateria(m, e.cfg, ctx.prog, IDX);
        let f = 0, a = 0;
        m.assuntos.forEach(x => { f += ctx.prog[x.id].feitas; a += ctx.prog[x.id].acertos; });
        return html`<div class="tab-mat-l"><span>${m.nome}</span><${Barra} pct=${pct} fina/><span class="tabular bold" title="acerto em questões">${f ? fmtPct(a / f) : '-'}</span></div>`;
      })}</div>
      <p class="card-sub">Barra: parte da matéria estudada. Número: acerto nas questões lançadas.</p>
    </div>
    <div class="so-mobile stack"><${PainelCards}/></div>
    <button class="btn ouro bloco" onClick=${() => App.ir('conquistas')}>${I.trofeu()} Ver conquistas</button>
  </div>`;
}

// ------------------------------------------------------------------ conquistas
function TelaConquistas() {
  const e = useApp();
  const ctx = App.ctx();
  const lista = E.avaliarConquistas(ctx, e.hoje);
  const datas = (e.conquistasDoc && e.conquistasDoc.lista) || {};
  const grupos = [];
  lista.forEach(c => { let g = grupos.find(x => x.nome === c.grupo); if (!g) grupos.push(g = { nome: c.grupo, itens: [] }); g.itens.push(c); });
  return html`<div class="miolo-in">
    <div class="dia-cab"><div class="upper muted">Conquistas</div><h1>${lista.filter(c => c.atingida).length} de ${lista.length}</h1></div>
    ${grupos.map(g => html`<section class="stack-sm"><h2 style="font-size:19px">${g.nome}</h2><div class="medalhas">${g.itens.map(c => html`<div class=${'medalha' + (c.atingida ? '' : ' bloq')}>
      <${Medalha} tier=${c.tier} grupo=${c.grupo}/>
      <b>${c.nome}</b><span>${c.desc}</span>${c.atingida && datas[c.id] ? html`<span class="tag ouro">${fmtData(datas[c.id])}</span>` : null}
    </div>`)}</div></section>`)}
  </div>`;
}

// ------------------------------------------------------------------ ajustes
const NOMES_DIA = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const ORDEM_DIAS = [1, 2, 3, 4, 5, 6, 0];

function TelaAjustes() {
  const e = useApp();
  const cfg = e.cfg;
  const [grade, setGrade] = useState(() => JSON.parse(JSON.stringify(cfg.grade)));
  const [sujo, setSujo] = useState(false);
  const [msg, setMsg] = useState('');
  const gradeSalva = JSON.stringify(cfg.grade);
  useEffect(() => { if (!sujo) setGrade(JSON.parse(gradeSalva)); }, [gradeSalva, sujo]);
  const mudarDia = (d, parcial) => { setGrade(g => Object.assign({}, g, { [d]: Object.assign({}, g[d], parcial) })); setSujo(true); };
  const mudarBloco = (d, i, parcial) => mudarDia(d, { blocos: grade[d].blocos.map((b, k) => (k === i ? Object.assign({}, b, parcial) : b)) });
  const mover = (lista, i, dir) => { const l = lista.slice(); const j = i + dir; if (j < 0 || j >= l.length) return l; [l[i], l[j]] = [l[j], l[i]]; return l; };
  const copiarSegunda = () => { const s = grade[1]; const g = Object.assign({}, grade); [2, 3, 4, 5].forEach(d => { g[d] = JSON.parse(JSON.stringify(s)); }); setGrade(g); setSujo(true); };
  const exportar = async () => {
    setMsg('Preparando backup...');
    try {
      await Acoes.descarregar();
      const dados = await Banco.exportar();
      const nome = 'rumo-a-farda-backup-' + e.hoje + '.json';
      const texto = JSON.stringify(dados);
      let dl = null;
      try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (err) { dl = null; }
      if (dl) { await dl.save({ filename: nome, data: texto }); setMsg('Backup salvo.'); }
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([texto], { type: 'application/json' })); a.download = nome; a.click(); setMsg('Backup baixado.'); }
    } catch (err) { setMsg(err && err.code === 'declined' ? 'Download cancelado.' : 'Não deu pra gerar o backup.'); }
  };
  const importar = async ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    try {
      const n = await Banco.importar(JSON.parse(await f.text()), (path, body) => aplicarDoc(path, body));
      setSujo(false);
      setMsg(plural(n, 'registro restaurado', 'registros restaurados') + '.');
    } catch (err) { setMsg((err && err.message) || Banco.mensagemErro(err)); }
    ev.target.value = '';
  };
  return html`<div class="miolo-in">
    <div class="dia-cab"><div class="upper muted">Ajustes</div><h1>Sua rotina, do seu jeito</h1><p class="card-sub">Tudo aqui realinha o plano do dia e a trilha na hora.</p></div>

    <section class="card stack">
      <div class="card-t">Provas</div>
      ${['PMDF', 'PMGO'].map(c => html`<div class="linha-cfg"><div><span class=${'tag ' + c.toLowerCase()}>${c}</span> <span class="card-sub">${EDIT.concursos[c].nome} · banca ${EDIT.concursos[c].banca}</span></div>
        <input class="input" style="width:auto" type="date" id=${'prova-' + c} value=${cfg.provas[c] || ''} onChange=${ev => Acoes.cfg({ provas: Object.assign({}, cfg.provas, { [c]: ev.target.value || null }) })}/></div>`)}
      <div class="linha-cfg"><div><div class="bold">Prioridade</div><div class="card-sub">Usada na projeção do que não cabe.</div></div>
        <div class="segmentado">${['PMDF', 'PMGO'].map(c => html`<button class=${cfg.prioridade[0] === c ? 'on' : ''} onClick=${() => Acoes.cfg({ prioridade: [c, c === 'PMDF' ? 'PMGO' : 'PMDF'] })}>${c}</button>`)}</div></div>
    </section>

    <section class="card stack">
      <div class="row between"><div class="card-t">Grade semanal</div><button class="btn-link" onClick=${copiarSegunda}>Copiar segunda pra terça a sexta</button></div>
      ${ORDEM_DIAS.map(d => { const g = grade[d]; return html`<div class="stack-sm" style="border-top:2px solid var(--line);padding-top:12px">
        <div class="row between"><div class="bold">${NOMES_DIA[d]}</div><div class="row"><span class="card-sub">Descanso</span><${Chave} rotulo=${'Descanso ' + NOMES_DIA[d]} on=${g.descanso} set=${v => mudarDia(d, { descanso: v })}/></div></div>
        ${!g.descanso ? html`
          <div class="row-wrap"><div class="campo"><label for=${'ini-' + d}>Começa</label><input id=${'ini-' + d} class="input" type="time" value=${g.inicio} onChange=${ev => mudarDia(d, { inicio: ev.target.value })}/></div>
          <div class="campo"><label for=${'pau-' + d}>Pausa (min)</label><${Stepper} id=${'pau-' + d} valor=${g.pausa} set=${v => mudarDia(d, { pausa: v })} min=${0} max=${60} passo=${5}/></div></div>
          ${g.blocos.map((b, i) => html`<div class="row-wrap" style="gap:8px">
            <select class="input" style="flex:1;min-width:210px" value=${b.tipo} aria-label="Tipo do bloco" onChange=${ev => mudarBloco(d, i, { tipo: ev.target.value })}>${E.TIPOS_EDITAVEIS.map(t => html`<option value=${t}>${E.TIPOS[t].nome}</option>`)}</select>
            <${Stepper} id=${'bl-' + d + '-' + i} valor=${b.min} set=${v => mudarBloco(d, i, { min: v })} min=${10} max=${240} passo=${5}/>
            <button class="btn-ico" aria-label="Subir bloco" onClick=${() => mudarDia(d, { blocos: mover(g.blocos, i, -1) })}>${I.cima()}</button>
            <button class="btn-ico" aria-label="Remover bloco" onClick=${() => mudarDia(d, { blocos: g.blocos.filter((x, k) => k !== i) })}>${I.lixo()}</button>
          </div>`)}
          <button class="btn-link" style="justify-self:start" onClick=${() => mudarDia(d, { blocos: g.blocos.concat([{ tipo: 'questoes_ontem', min: 50 }]) })}>+ Bloco</button>` : null}
      </div>`; })}
      <div class="row-wrap"><button class="btn" disabled=${!sujo} onClick=${async () => { try { await Acoes.salvarGrade(grade); setSujo(false); App.toast('Grade salva. O plano de hoje já mudou.', 'ok'); } catch (err) { /* o aviso de erro já apareceu; o rascunho continua */ } }}>Salvar grade</button>
        <button class="btn fantasma" onClick=${() => { setGrade(E.gradePadrao()); setSujo(true); }}>Voltar à grade da rotina</button></div>
    </section>

    <section class="card stack-sm">
      <div class="card-t">Ordem das matérias</div>
      <p class="card-sub">A teoria vai uma matéria por vez, de cima pra baixo.</p>
      ${cfg.ordemMaterias.map((mid, i) => { const m = IDX.materias[mid]; return html`<div class="row" style="border-top:2px solid var(--line);padding-top:8px">
        <span class="bold tabular muted" style="width:24px">${i + 1}</span><span class="grow bold">${m.nome}</span><span class="row-wrap" style="gap:4px"><${Tags} concursos=${m.concursos}/></span>
        <button class="btn-ico" aria-label=${'Subir ' + m.nome} disabled=${i === 0} onClick=${() => Acoes.cfg({ ordemMaterias: mover(cfg.ordemMaterias, i, -1) })}>${I.cima()}</button>
        <button class="btn-ico" aria-label=${'Descer ' + m.nome} disabled=${i === cfg.ordemMaterias.length - 1} onClick=${() => Acoes.cfg({ ordemMaterias: mover(cfg.ordemMaterias, i, 1) })}>${I.baixo()}</button>
      </div>`; })}
    </section>

    <section class="card stack-sm">
      <div class="card-t">Quanto você já sabe</div>
      <p class="card-sub">Muda o tempo de teoria. "Domino" não pula nada: só sugere o mini simulado.</p>
      <${Autoavaliacao}/>
    </section>

    <section class="card stack">
      <div class="card-t">Metas e questões</div>
      <div class="linha-cfg"><div><div class="bold">Questões por bloco de 50 min</div></div><${Stepper} id="meta-50" valor=${cfg.metas.questoesPor50} set=${v => Acoes.cfg({ metas: Object.assign({}, cfg.metas, { questoesPor50: v }) })} min=${5} max=${60}/></div>
      <div class="linha-cfg"><div><div class="bold">Bônus no trabalho</div></div><${Stepper} id="meta-trab" valor=${cfg.metas.trabalho} set=${v => Acoes.cfg({ metas: Object.assign({}, cfg.metas, { trabalho: v }) })} min=${0} max=${100} passo=${5}/></div>
      <div class="linha-cfg"><div><div class="bold">Redação a cada</div></div><div class="segmentado">${[7, 14, 21].map(n => html`<button class=${cfg.redacaoCadaDias === n ? 'on' : ''} onClick=${() => Acoes.cfg({ redacaoCadaDias: n })}>${n} dias</button>`)}</div></div>
      <div class="linha-cfg"><div><div class="bold">Onde abrir questões</div><div class="card-sub">Botão na ficha de cada assunto.</div></div><select class="input" style="width:auto" value=${cfg.plataforma} aria-label="Plataforma de questões" onChange=${ev => Acoes.cfg({ plataforma: ev.target.value })}><option value="qconcursos">QConcursos</option><option value="tec">TEC Concursos</option><option value="gran">Gran Questões</option></select></div>
      <div class="linha-cfg"><div class="bold">Sons</div><${Chave} rotulo="Sons" on=${cfg.sons !== false} set=${v => Acoes.cfg({ sons: v })}/></div>
    </section>

    <section class="card stack-sm">
      <div class="card-t">Backup</div>
      <p class="card-sub">${Banco.modo === 'nuvem' ? 'Seu progresso fica salvo na sua conta do Claude. O backup é uma cópia extra.' : Banco.modo === 'web' ? 'Seu progresso fica salvo na sua conta do site. O backup é uma cópia extra.' : 'Neste modo o progresso fica só neste navegador. Faça backup de vez em quando.'}</p>
      <div class="row-wrap"><button class="btn fantasma" onClick=${exportar}>Exportar backup</button>
        <label class="btn fantasma" for="importar" style="cursor:pointer">Importar backup</label><input id="importar" class="sr" type="file" accept="application/json,.json" onChange=${importar}/></div>
      ${msg ? html`<p class="small bold">${msg}</p>` : null}
    </section>

    ${Web.ativo && e.usuario ? html`<section class="card stack-sm">
      <div class="card-t">Conta</div>
      <p class="card-sub">Conectado como ${e.usuario}.</p>
      <div><button class="btn fantasma" onClick=${() => Web.sair()}>Sair</button></div>
    </section>` : null}

    <section class="card stack-sm small muted">
      <div class="card-t" style="color:var(--text)">Sobre o edital</div>
      <p>Montado a partir dos editais verticalizados de Soldado da PMDF e da PMGO: ${EDIT.materias.length} matérias, ${Object.keys(IDX.assuntos).length} assuntos, ${EDIT.itens.length} itens do edital.</p>
      <p>${EDIT.concursos.PMDF.obs}</p><p>${EDIT.concursos.PMGO.obs}</p>
      <p>Quando sair edital novo, o site é atualizado. O progresso dos assuntos que continuarem no edital fica.</p>
    </section>
  </div>`;
}

function Celebra() {
  const e = useApp();
  const c = e.celebra[0];
  if (!c) return null;
  const prox = () => App.set({ celebra: e.celebra.slice(1) });
  let ic, titulo, texto;
  if (c.tipo === 'ofensiva') { ic = html`<span style="width:110px;height:110px;display:inline-grid;color:var(--orange)">${I.fogo()}</span>`; titulo = plural(c.n, 'dia', 'dias') + ' de ofensiva'; texto = c.bloqueio ? 'Dia garantido, e você ganhou 1 bloqueio.' : 'Dia garantido. Amanhã tem mais.'; }
  else if (c.tipo === 'patente') { ic = html`<span style="width:110px;height:110px;display:inline-grid;color:var(--blue)">${I.divisa()}</span>`; titulo = 'Promovido a ' + c.nome; texto = 'Sua patente subiu com o XP acumulado.'; }
  else { ic = html`<${Medalha} tier=${c.c.tier} grupo=${c.c.grupo}/>`; titulo = c.c.nome; texto = c.c.desc; }
  return html`<div class="celebra" onClick=${ev => { if (ev.target === ev.currentTarget) prox(); }}>
    <div class="celebra-in" role="dialog" aria-label=${titulo}>
      ${c.tipo === 'conquista' ? html`<div class="upper" style="color:var(--gold-ink)">Conquista desbloqueada</div>` : null}
      <div style="width:110px;height:110px;display:grid;place-items:center" class=${c.tipo === 'conquista' ? 'grande' : ''}>${ic}</div>
      <h2 style="font-size:26px">${titulo}</h2>
      <p class="muted">${texto}</p>
      <button class="btn bloco" onClick=${prox}>Continuar</button>
    </div>
  </div>`;
}

/* Rumo à Farda: ações que gravam, carga inicial e a casca do app. */

// Como cada documento do banco vira estado na tela.
function aplicarDoc(path, body) {
  const [col, id] = path.split('/');
  if (col === 'config' && id === 'geral') App.setDados({ cfg: E.normalizarConfig(body, EDIT, App.estado.hoje) });
  else if (col === 'config' && id === 'conquistas') App.setDados({ conquistasDoc: body || {} });
  else if (col === 'dias') App.dadoLocal('dias', id, body === undefined ? undefined : E.normalizarDia(body));
  else if (col === 'assuntos') App.dadoLocal('assuntosDocs', id, body);
  else if (col === 'materias') App.dadoLocal('materiasDocs', id, body);
  else if (col === 'redacoes') App.dadoLocal('redacoes', id, body);
}

let seqEntrada = 0;
// Registro novo do diário: id próprio e ordem de criação.
const entrada = (dados, id) => Object.assign({ id: id || Banco.novoId(), ordem: Date.now() * 1000 + (seqEntrada++ % 1000) }, dados);

// Dia gravado no formato antigo (listas) vira chaves por id, uma vez só.
function diaParaMapa(body) {
  const d = Object.assign({}, body || {});
  E.CAMPOS_DIA.forEach(k => {
    if (!Array.isArray(d[k])) return;
    const m = {};
    d[k].forEach((x, i) => { if (!x) return; const id = x.id || 'v' + i; m[id] = Object.assign({}, x, { id, ordem: x.ordem || i }); });
    d[k] = m;
  });
  return d;
}

const Acoes = {
  // Acrescenta registros no diário sem regravar o dia inteiro.
  // campos: { sessoes: [entrada], questoes: [entrada], ..., encolhido: 25 }
  _dia(data, campos) {
    const path = 'dias/' + data;
    const patch = {};
    Object.keys(campos).forEach(k => {
      if (E.CAMPOS_DIA.includes(k)) {
        if (!campos[k] || !campos[k].length) return;
        patch[k] = {};
        campos[k].forEach(x => { patch[k][x.id] = Object.assign({}, x); delete patch[k][x.id].id; });
      } else patch[k] = campos[k];
    });
    if (!Object.keys(patch).length) return Promise.resolve();
    const aplicar = body => App.dadoLocal('dias', data, E.normalizarDia(body));
    const bruto = Banco.atual(path);
    if (bruto && E.CAMPOS_DIA.some(k => Array.isArray(bruto[k]))) return Banco.gravar(path, antes => mesclarObj(diaParaMapa(antes), patch), aplicar);
    return Banco.mesclar(path, patch, aplicar);
  },
  _assunto(id, parcial) { return Banco.mesclar('assuntos/' + id, parcial, body => App.dadoLocal('assuntosDocs', id, body)); },
  _materia(id, parcial) { return Banco.mesclar('materias/' + id, parcial, body => App.dadoLocal('materiasDocs', id, body)); },

  async registrarSessoes(lista, data) {
    data = data || App.estado.hoje;
    const validas = (lista || []).filter(s => s && s.min >= 1);
    if (!validas.length) return;
    const antes = E.diaEstudado(App.estado.dias[data]);
    await this._dia(data, { sessoes: validas.map(s => entrada({
      tipo: s.tipo, assuntoId: s.assuntoId || null, min: Math.round(s.min),
      blocoIdx: s.blocoIdx == null ? null : s.blocoIdx, blocoTipo: s.blocoTipo || null, fim: new Date().toISOString(),
    }, s.id)) });
    const vistos = {};
    for (const s of validas) if (s.tipo === 'teoria' && s.assuntoId && !vistos[s.assuntoId]) { vistos[s.assuntoId] = 1; await this.talvezConcluirTeoria(s.assuntoId, data); }
    this.aposEstudo(data, antes);
  },

  async talvezConcluirTeoria(id, data) {
    const ctx = App.ctx();
    const a = IDX.assuntos[id];
    const p = ctx.prog[id];
    if (!a || !p || !E.NA_FILA(p.status)) return;
    if (p.minTeoria >= E.minNecessarios(a, ctx.cfg, p)) {
      await this._assunto(id, { teoriaConcluidaEm: data });
      App.toast('Teoria de ' + a.titulo + ' concluída. Amanhã entram as questões dela.', 'ok');
    }
  },

  async lancarQuestoes({ assuntoId, feitas, acertos, ctxTipo, bloco, data, id }) {
    data = data || App.estado.hoje;
    feitas = Math.max(0, Math.round(feitas || 0));
    acertos = Math.min(feitas, Math.max(0, Math.round(acertos || 0)));
    if (!feitas) return;
    const antes = E.diaEstudado(App.estado.dias[data]);
    const p = assuntoId ? App.ctx().prog[assuntoId] : null;
    const jaHoje = ((App.estado.dias[data] || {}).questoes || []).filter(q => q.assuntoId === assuntoId);
    const doDia = { feitas: feitas + jaHoje.reduce((s, q) => s + (q.feitas || 0), 0), acertos: acertos + jaHoje.reduce((s, q) => s + (q.acertos || 0), 0) };
    await this._dia(data, { questoes: [entrada({
      assuntoId: assuntoId || null, feitas, acertos, ctx: ctxTipo || 'livre',
      blocoIdx: bloco ? bloco.idx : null, blocoTipo: bloco ? bloco.tipo : null,
    }, id)] });
    if (p) {
      const mud = E.aoLancarQuestoes(p, feitas, acertos, data, doDia);
      if (Object.keys(mud).length) {
        await this._assunto(assuntoId, mud);
        if (mud.estudadoEm) App.toast(nomeAssunto(assuntoId) + ' estudado. Primeira revisão em 7 dias.', 'ok');
        else if (mud.rev && mud.rev.extra) App.toast('Acerto abaixo de 60% hoje. Revisão extra marcada pra daqui a 3 dias.');
      }
    }
    Som.tocar('acerto');
    this.aposEstudo(data, antes);
  },

  aposEstudo(data, antes) {
    if (data === App.estado.hoje && !antes && E.diaEstudado(App.estado.dias[data])) {
      const of = E.ofensiva(App.estado.cfg, App.estado.dias, data);
      App.set({ celebra: App.estado.celebra.concat([{ tipo: 'ofensiva', n: of.atual, bloqueio: of.historico[data] === 'estudado+bloqueio' }]) });
      Som.tocar('conquista');
    }
    this.checarConquistas();
  },

  async concluirTeoria(id) { await this._assunto(id, { teoriaConcluidaEm: App.estado.hoje }); App.toast('Teoria concluída. Amanhã entram as questões.', 'ok'); },
  async reabrirTeoria(id) { await this._assunto(id, { teoriaConcluidaEm: null }); },

  async marcarRevisao(id, min, bloco) {
    const hoje = App.estado.hoje;
    const p = App.ctx().prog[id];
    if (!p) return;
    await this._assunto(id, E.aoRevisar(p, hoje));
    const antes = E.diaEstudado(App.estado.dias[hoje]);
    await this._dia(hoje, {
      revisoes: [entrada({ assuntoId: id })],
      sessoes: min > 0 ? [entrada({ tipo: 'revisao', assuntoId: id, min: Math.round(min), blocoIdx: bloco ? bloco.idx : null, blocoTipo: bloco ? bloco.tipo : 'revisao', fim: new Date().toISOString() })] : [],
    });
    Som.tocar('acerto');
    this.aposEstudo(hoje, antes);
  },

  async alternarCheck(id, campo) {
    const p = App.ctx().prog[id];
    await this._assunto(id, { checks: { [campo]: !((p.checks || {})[campo]) } });
  },

  // Junta cliques seguidos numa gravação só. Rejeita se não salvar.
  _cfgPend: {},
  salvarConfig(parcial) {
    this._cfgPend = Object.assign({}, this._cfgPend, parcial);
    App.setDados({ cfg: Object.assign({}, App.estado.cfg, parcial) });
    return new Promise((resolve, reject) => {
      (this._esperaCfg = this._esperaCfg || []).push({ resolve, reject });
      clearTimeout(this._tCfg);
      this._tCfg = setTimeout(() => this._gravarConfig(), 400);
    });
  },
  // Pra onChange de botão: salva sem precisar esperar (a falha já vira aviso na tela).
  cfg(parcial) { this.salvarConfig(parcial).catch(() => {}); },
  async _gravarConfig() {
    clearTimeout(this._tCfg); this._tCfg = null;
    const esperando = this._esperaCfg || []; this._esperaCfg = [];
    const pend = this._cfgPend; this._cfgPend = {};
    if (!esperando.length) return;
    // base: a última versão conhecida do banco (não o estado da tela, que um eco atrasado pode ter mudado)
    const montar = antes => Object.assign({}, antes || App.estado.cfg, pend);
    const aplicar = body => App.setDados({ cfg: E.normalizarConfig(Object.assign({}, body, this._cfgPend), EDIT, App.estado.hoje) });
    try { await Banco.gravar('config/geral', montar, aplicar); esperando.forEach(x => x.resolve()); }
    catch (e) { esperando.forEach(x => x.reject(e)); }
  },
  salvarGrade(novaGrade) { return this.salvarConfig(E.trocarGrade(App.estado.cfg, novaGrade, App.estado.hoje)); },
  async descarregar() { if (this._tCfg) await this._gravarConfig(); await Banco.esperarFilas(); },

  async encolher(min) { await this._dia(App.estado.hoje, min ? { encolhido: min } : { encolhido: null, forcarCompleto: true }); },
  async forcarCompleto() { await this._dia(App.estado.hoje, { forcarCompleto: true, encolhido: null }); },
  async estudarNoDescanso() { await this._dia(App.estado.hoje, { estudarNoDescanso: true }); },

  // Idempotente pelo id do simulado: repetir não duplica.
  async registrarSimuladoNoDia(data, dados, min) {
    const antes = E.diaEstudado(App.estado.dias[data]);
    await this._dia(data, {
      simulados: [Object.assign({ id: dados.id, ordem: Date.now() * 1000 }, dados)],
      sessoes: min > 0 ? [{ id: 'sim-' + dados.id, ordem: Date.now() * 1000 + 1, tipo: 'simulado', assuntoId: dados.alvoTipo === 'assunto' ? dados.alvoId : null, min: Math.round(min), blocoIdx: null, blocoTipo: null, fim: new Date().toISOString() }] : [],
    });
    this.aposEstudo(data, antes);
  },
  async atualizarSimuladoNoDia(data, id, parcial) {
    if (!data) return;
    const dia = App.estado.dias[data];
    if (!dia || !(dia.simulados || []).some(s => s.id === id)) return;
    await this._dia(data, { simulados: [Object.assign({ id }, parcial)] });
  },

  async salvarRedacao({ tema, texto, correcao }) {
    const id = Banco.novoId();
    const hoje = App.estado.hoje;
    const doc = { criadoEm: new Date().toISOString(), data: hoje, tema, texto: String(texto || '').slice(0, 20000), correcao: correcao || null };
    await Banco.gravar('redacoes/' + id, () => doc, body => App.dadoLocal('redacoes', id, body));
    await this._dia(hoje, { redacoes: [entrada({ nota: correcao ? correcao.total : null }, id)] });
    this.checarConquistas();
    return id;
  },

  // Só grava depois que as conquistas salvas chegaram do servidor, pra não apagar datas antigas.
  async checarConquistas() {
    const ctx = App.ctx();
    if (!ctx.cfg || !App.carregado.conquistas) return;
    const hoje = App.estado.hoje;
    const lista = E.avaliarConquistas(ctx, hoje);
    const doc = App.estado.conquistasDoc || {};
    const ja = doc.lista || {};
    const novas = lista.filter(c => c.atingida && !ja[c.id]);
    const pat = E.patente(E.xpTotal(ctx.cfg, ctx.dias));
    const patAntes = doc.patente == null ? null : doc.patente;
    if (!novas.length && patAntes != null && pat.idx <= patAntes) return;
    const lista2 = {};
    novas.forEach(c => { lista2[c.id] = hoje; });
    try { await Banco.mesclar('config/conquistas', { lista: lista2, patente: Math.max(pat.idx, patAntes || 0) }, body => App.setDados({ conquistasDoc: body })); }
    catch (e) { return; }
    const cel = novas.length > 3
      ? [{ tipo: 'conquista', c: { nome: novas.length + ' conquistas', desc: 'Veja todas na tela de conquistas.', tier: 'ouro', grupo: 'Rotina' } }]
      : novas.map(c => ({ tipo: 'conquista', c }));
    if (patAntes != null && pat.idx > patAntes) cel.push({ tipo: 'patente', nome: pat.nome });
    if (cel.length) { App.set({ celebra: App.estado.celebra.concat(cel) }); Som.tocar('conquista'); }
  },
};

// ------------------------------------------------------------------ carga
function falhaCarga(msg) { App.set({ pronto: true, tela: 'erro', erroCarga: msg }); }

async function iniciar() {
  Cron.carregar();
  Banco.aoReverter = (path, body) => aplicarDoc(path, body);
  Banco.aoFalhar = msg => App.toast(msg, 'erro');
  if (Web.ativo) {
    if (!Web.iniciar()) return falhaCarga('Não deu pra carregar o login. Confira a internet e recarregue a página.');
    let sessao;
    try { sessao = await Web.sessaoAtual(); } catch (e) { return falhaCarga(e.message); }
    if (!sessao) { App.set({ pronto: true, tela: 'entrar' }); return; }
    App.set({ usuario: sessao.user.email });
    let liberado;
    try { liberado = await Web.euLiberado(); } catch (e) { return falhaCarga(Banco.mensagemErro(e)); }
    if (!liberado) { App.set({ pronto: true, tela: 'naoLiberado' }); return; }
    const db = Web.banco(sessao.user.id);
    try { await db.iniciar(); } catch (e) { return falhaCarga(Banco.mensagemErro(e)); }
    Banco.usar(db, 'web');
    await AI.iniciar();
  } else {
    const [modo] = await Promise.all([Banco.iniciar(), AI.iniciar()]);
    App.bancoLocal = modo === 'local';
  }
  assinar();
}

function assinar() {
  const hoje = E.dataLocal();
  const faltam = new Set(['config/geral', 'config/conquistas', 'assuntos', 'materias', 'dias']);
  const chegou = (k, definitivo) => {
    if (!definitivo) return;
    if (k === 'config/conquistas') App.carregado.conquistas = true;
    if (faltam.delete(k) && !faltam.size) terminarCarga();
  };
  // o que foi mudado e ainda não gravou continua valendo por cima do que chega do banco
  Banco.ouvirDoc('config/geral', (body, def, e) => { if (e) return; App.setDados({ cfg: E.normalizarConfig(Object.assign({}, body, Acoes._cfgPend), EDIT, hoje) }); chegou('config/geral', def); });
  Banco.ouvirDoc('config/conquistas', (body, def, e) => { if (e) return; App.setDados({ conquistasDoc: body || {} }); chegou('config/conquistas', def); });
  Banco.ouvirColecao('assuntos', (docs, def, e) => { if (e) return; App.setDados({ assuntosDocs: docs }); chegou('assuntos', def); });
  Banco.ouvirColecao('materias', (docs, def, e) => { if (e) return; App.setDados({ materiasDocs: docs }); chegou('materias', def); });
  Banco.ouvirColecao('dias', (docs, def, e) => {
    if (e) return;
    const dias = {};
    Object.keys(docs).forEach(k => { dias[k] = E.normalizarDia(docs[k]); });
    App.setDados({ dias });
    chegou('dias', def);
  });
  Banco.ouvirColecao('redacoes', (docs, def, e) => { if (!e) App.setDados({ redacoes: docs }); });
  setTimeout(() => { if (!App.estado.pronto) falhaCarga('Seu progresso demorou demais pra carregar. Confira a internet e recarregue a página.'); }, 20000);
}

function terminarCarga() {
  if (App.estado.pronto) return;
  let rota = 'hoje';
  try { rota = localStorage.getItem('rf:rota') || 'hoje'; } catch (e) { /* ok */ }
  App.set({ pronto: true, tela: 'app', rota });
  if (!App.estado.cfg.onboardingFeito) App.abrir({ tipo: 'boasvindas' });
  Acoes.checarConquistas();
  Simulado.reconciliarPendentes();
  setInterval(() => { const h = E.dataLocal(); if (h !== App.estado.hoje) App.setDados({ hoje: h }); }, 30000);
}

  ['hoje', 'Hoje', 'hoje'], ['trilha', 'Trilha', 'trilha'], ['redacao', 'Redação', 'pena'],
  ['perfil', 'Perfil', 'grafico'], ['conquistas', 'Conquistas', 'trofeu'], ['ajustes', 'Ajustes', 'engrenagem'],
];

  const m = e.modal;
  if (!m) return null;
  switch (m.tipo) {
    case 'assunto': return html`<${AssuntoFolha} id=${m.id}/>`;
    case 'lancar': return html`<${LancarFolha} bloco=${m.bloco} assuntoId=${m.assuntoId} ctxTipo=${m.ctxTipo}/>`;
    case 'tempo': return html`<${TempoFolha} bloco=${m.bloco}/>`;
    case 'encerrar': return html`<${EncerrarFolha}/>`;
    case 'confirmar': return html`<${ConfirmarFolha} ...${m}/>`;
    case 'ofensiva': return html`<${OfensivaFolha}/>`;
    case 'encolher': return html`<${EncolherFolha}/>`;
    case 'simulado': return html`<${SimuladoFolha} alvo=${m.alvo}/>`;
    case 'redacao': return html`<${RedacaoFolha} id=${m.id}/>`;
    case 'boasvindas': return html`<${BoasVindas}/>`;
    default: return null;
  }
}

function Toast() {
  const e = useApp();
  if (!e.toast) return null;
  return html`<div class=${'toast ' + (e.toast.tipo || '')} role="status">${e.toast.msg}</div>`;
}

function Raiz() {
  const e = useApp();
  if (!e.pronto) return html`<div class="splash"><div class="splash-logo">Rumo à Farda</div><div class="splash-sub">Carregando seu progresso</div></div>`;
  if (e.tela === 'entrar') return html`<${TelaEntrar}/>`;
  if (e.tela === 'naoLiberado') return html`<${TelaNaoLiberado}/>`;
  if (e.tela === 'erro') return html`<div class="splash"><div class="splash-logo">Rumo à Farda</div><p class="splash-sub" style="max-width:420px">${e.erroCarga}</p><div><button class="btn" onClick=${() => location.reload()}>Recarregar</button></div></div>`;
  const Tela = { hoje: TelaHoje, trilha: TelaTrilha, redacao: TelaRedacao, perfil: TelaPerfil, conquistas: TelaConquistas, ajustes: TelaAjustes }[e.rota] || TelaHoje;
  return html`<div class="app">
    <nav class="lado" aria-label="Menu principal">
      <div class="marca">Rumo à Farda<small>Soldado PMDF · PMGO</small></div>
      ${NAV.map(([id, nome, ic]) => html`<button class=${'nav-item' + (e.rota === id ? ' ativo' : '')} aria-label=${nome} aria-current=${e.rota === id ? 'page' : null} onClick=${() => App.ir(id)}>${I[ic]()}<span>${nome}</span></button>`)}
    </nav>
    <header class="topo"><${StatusChips} compacto/><button class="btn-ico" aria-label="Ajustes" onClick=${() => App.ir('ajustes')}>${I.engrenagem()}</button></header>
    <main class="miolo"><${Tela}/></main>
    <aside class="direita" aria-label="Resumo"><${StatusChips}/><${PainelCards}/></aside>
    <nav class="baixo" aria-label="Menu">
      ${NAV_MOBILE.map(id => { const n = NAV.find(x => x[0] === id); return html`<button class=${e.rota === id ? 'ativo' : ''} aria-label=${n[1]} aria-current=${e.rota === id ? 'page' : null} onClick=${() => App.ir(id)}>${I[n[2]]()}</button>`; })}
    </nav>
    <${Modal}/>
    <${PilulaCron}/>
    <${CronTela}/>
    <${QuizTela}/>
    <${Celebra}/>
    <${Toast}/>
  </div>`;
}

render(html`<${Raiz}/>`, document.getElementById('app'));
iniciar();
</script>

</body></html>
