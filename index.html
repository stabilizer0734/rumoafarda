<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui;background:#fafafa}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Rumo à Farda</title>
<meta name="description" content="Plano de estudos para Soldado PMDF e PMGO">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>/* Rumo à Farda: visual. Tokens primeiro, componentes depois. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f7f7;
  --surface-3: #efefef;
  --line: #e5e5e5;
  --line-2: #d4d4d4;
  --text: #3c3c3c;
  --muted: #777777;
  --faint: #afafaf;
  --green: #58cc02; --green-d: #58a700; --green-soft: #d7ffb8; --green-ink: #3f8f00;
  --blue: #1cb0f6; --blue-d: #1899d6; --blue-soft: #ddf4ff; --blue-ink: #1482b8;
  --orange: #ff9600; --orange-d: #e27c00; --orange-soft: #fff1dc; --orange-ink: #c46a00;
  --red: #ff4b4b; --red-d: #ea2b2b; --red-soft: #ffdfe0; --red-ink: #d33131;
  --gold: #ffc800; --gold-d: #e5a400; --gold-soft: #fff6cc; --gold-ink: #a87800;
  --purple: #ce82ff; --purple-d: #a568e0; --purple-soft: #f5e8ff; --purple-ink: #8a45c9;
  --ice: #49c0f8; --ice-soft: #e2f5ff; --ice-ink: #1686bd;
  --pink: #ff86d0; --pink-d: #e069b3;
  --btn-gray: #ffffff; --btn-gray-d: #e5e5e5;
  --overlay: rgba(0, 0, 0, .45);
  --font: 'Nunito', 'Varela Round', ui-rounded, 'SF Pro Rounded', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 16px;
  --r-sm: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131f24; --surface: #131f24; --surface-2: #1b2a31; --surface-3: #223540;
    --line: #37464f; --line-2: #4a5b64;
    --text: #eef4f7; --muted: #9bacb4; --faint: #5f727b;
    --green-soft: #1d3a12; --green-ink: #8ee03f;
    --blue-soft: #0f3346; --blue-ink: #5cc8fb;
    --orange-soft: #3d2a10; --orange-ink: #ffb54a;
    --red-soft: #3e1d21; --red-ink: #ff8585;
    --gold-soft: #3a3110; --gold-ink: #ffd84d;
    --purple-soft: #2f2140; --purple-ink: #dca8ff;
    --ice-soft: #103346; --ice-ink: #7fd3fb;
    --btn-gray: #131f24; --btn-gray-d: #37464f;
    --overlay: rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131f24; --surface: #131f24; --surface-2: #1b2a31; --surface-3: #223540;
  --line: #37464f; --line-2: #4a5b64;
  --text: #eef4f7; --muted: #9bacb4; --faint: #5f727b;
  --green-soft: #1d3a12; --green-ink: #8ee03f;
  --blue-soft: #0f3346; --blue-ink: #5cc8fb;
  --orange-soft: #3d2a10; --orange-ink: #ffb54a;
  --red-soft: #3e1d21; --red-ink: #ff8585;
  --gold-soft: #3a3110; --gold-ink: #ffd84d;
  --purple-soft: #2f2140; --purple-ink: #dca8ff;
  --ice-soft: #103346; --ice-ink: #7fd3fb;
  --btn-gray: #131f24; --btn-gray-d: #37464f;
  --overlay: rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; font-weight: 800; }
p { margin: 0; }
a { color: var(--blue-ink); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }
.tabular { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.bold { font-weight: 800; }
.upper { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }
.center { text-align: center; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------ splash */
.splash { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 8px; }
.splash-logo { font-weight: 900; font-size: 34px; color: var(--green); letter-spacing: -.02em; }
.splash-sub { color: var(--muted); font-weight: 700; }

/* ------------------------------------------------------------ layout */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr) 340px; min-height: 100vh; }
.lado { position: sticky; top: 0; height: 100vh; border-right: 2px solid var(--line); padding: 24px 14px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.marca { font-weight: 900; font-size: 27px; color: var(--green); letter-spacing: -.02em; padding: 4px 14px 22px; line-height: 1; }
.marca small { display: block; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; font-weight: 800; }
.nav-item { display: flex; align-items: center; gap: 16px; padding: 10px 14px; border-radius: 14px; border: 2px solid transparent; background: none; cursor: pointer; text-align: left; font-weight: 800; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 100%; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.ativo { color: var(--blue-ink); background: var(--blue-soft); border-color: var(--blue); }
.nav-item svg { width: 30px; height: 30px; flex: none; }
.miolo { min-width: 0; padding-block: 28px 110px; padding-inline: 28px; }
.miolo-in { max-width: 620px; margin: 0 auto; display: grid; gap: 20px; }
.direita { position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 24px 24px 24px 0; display: grid; align-content: start; gap: 16px; }
.topo { display: none; }
.baixo { display: none; }
@media (max-width: 1180px) {
  .app { grid-template-columns: 92px minmax(0, 1fr) 300px; }
  .nav-item span, .marca small { display: none; }
  .marca { font-size: 0; padding: 4px 0 18px; text-align: center; }
  .marca::before { content: 'RF'; font-size: 26px; }
  .nav-item { justify-content: center; padding: 10px; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lado, .direita { display: none; }
  .miolo { padding-block: 12px 110px; padding-inline: 16px; }
  .topo { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 2px solid var(--line); padding: 8px 16px; align-items: center; justify-content: space-between; gap: 8px; }
  .baixo { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--bg); border-top: 2px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .baixo button { background: none; border: 2px solid transparent; border-radius: 12px; padding: 6px 12px; cursor: pointer; display: grid; place-items: center; }
  .baixo button svg { width: 30px; height: 30px; }
  .baixo button.ativo { border-color: var(--blue); background: var(--blue-soft); }
}

/* ------------------------------------------------------------ chips de status */
.status-chips { display: flex; gap: 6px; align-items: center; }
.schip { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-size: 16px; padding: 6px 8px; border-radius: 12px; background: none; border: 0; cursor: pointer; }
.schip:hover { background: var(--surface-2); }
.schip svg { width: 26px; height: 26px; }
.schip.fogo { color: var(--orange); }
.schip.fogo.apagado { color: var(--faint); }
.schip.gelo { color: var(--ice); }
.schip.xp { color: var(--gold-ink); }
.schip.patente { color: var(--blue-ink); }

/* ------------------------------------------------------------ cartões */
.card { background: var(--surface); border: 2px solid var(--line); border-radius: var(--r); padding: 18px; }
.card-t { font-weight: 800; font-size: 18px; }
.card-sub { color: var(--muted); font-size: 14px; font-weight: 700; }
.card.destaque { border-color: var(--green); }
.card.alerta { border-color: var(--red); background: var(--red-soft); }
.card.aviso { border-color: var(--orange); background: var(--orange-soft); }
.card.info { border-color: var(--blue); background: var(--blue-soft); }
.card.plain { border: 0; padding: 0; }

/* ------------------------------------------------------------ botões */
.btn { --c: var(--green); --cd: var(--green-d); --on: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 18px 11px; font-weight: 800; font-size: 15px; letter-spacing: .07em; text-transform: uppercase; line-height: 1.15; cursor: pointer; background: var(--c); color: var(--on); box-shadow: 0 4px 0 var(--cd); margin-bottom: 4px; transition: transform .06s, box-shadow .06s, filter .15s; text-align: center; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--cd); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.azul { --c: var(--blue); --cd: var(--blue-d); }
.btn.laranja { --c: var(--orange); --cd: var(--orange-d); }
.btn.vermelho { --c: var(--red); --cd: var(--red-d); }
.btn.roxo { --c: var(--purple); --cd: var(--purple-d); }
.btn.ouro { --c: var(--gold); --cd: var(--gold-d); --on: #4b3a00; }
.btn.fantasma { --c: var(--btn-gray); --cd: var(--btn-gray-d); --on: var(--blue-ink); border: 2px solid var(--btn-gray-d); padding: 10px 16px 9px; }
.btn.fantasma.cinza { --on: var(--muted); }
.btn.bloco { width: 100%; }
.btn.peq { padding: 9px 13px 8px; font-size: 13px; border-radius: 12px; }
.btn.fantasma.peq { padding: 7px 11px 6px; }
.btn:disabled, .btn[aria-disabled="true"] { --c: var(--surface-3); --cd: var(--line); --on: var(--faint); cursor: not-allowed; filter: none; transform: none; border-color: var(--line); }
.btn-link { background: none; border: 0; padding: 4px 2px; color: var(--blue-ink); font-weight: 800; cursor: pointer; font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.btn-link:hover { text-decoration: underline; }
.btn-ico { background: none; border: 0; padding: 6px; border-radius: 10px; cursor: pointer; color: var(--faint); display: inline-grid; place-items: center; }
.btn-ico:hover { background: var(--surface-2); color: var(--muted); }
.btn-ico svg { width: 22px; height: 22px; }

/* ------------------------------------------------------------ etiquetas e barras */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 900; letter-spacing: .06em; padding: 3px 7px; border-radius: 8px; text-transform: uppercase; line-height: 1.2; }
.tag.pmdf { background: var(--blue-soft); color: var(--blue-ink); }
.tag.pmgo { background: var(--green-soft); color: var(--green-ink); }
.tag.ouro { background: var(--gold-soft); color: var(--gold-ink); }
.tag.vermelha { background: var(--red-soft); color: var(--red-ink); }
.tag.roxa { background: var(--purple-soft); color: var(--purple-ink); }
.tag.laranja { background: var(--orange-soft); color: var(--orange-ink); }
.tag.cinza { background: var(--surface-3); color: var(--muted); }
.barra { height: 16px; border-radius: 99px; background: var(--surface-3); overflow: hidden; position: relative; }
.barra > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--green)); position: relative; transition: width .4s ease; min-width: 0; }
.barra > i::after { content: ''; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 99px; background: rgba(255, 255, 255, .3); }
.barra.fina { height: 10px; }
.barra.fina > i::after { display: none; }

/* ------------------------------------------------------------ cabeçalho do dia */
.dia-cab { display: grid; gap: 4px; }
.dia-cab h1 { font-size: 30px; font-weight: 900; letter-spacing: -.01em; }
.contagem { display: flex; flex-wrap: wrap; gap: 8px; }
.contagem .tag { font-size: 12px; padding: 5px 9px; }

.frase { border-radius: var(--r); padding: 20px; background: var(--green); color: #fff; box-shadow: 0 5px 0 var(--green-d); position: relative; }
.frase .upper { opacity: .85; font-size: 12px; }
.frase p { font-size: 21px; font-weight: 800; line-height: 1.3; margin-top: 6px; text-wrap: pretty; }
.dica { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; }
.dica-ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-soft); color: var(--gold-ink); }
.dica-ico svg { width: 24px; height: 24px; }
.dica + .dica { margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--line); }

/* ------------------------------------------------------------ blocos do dia */
.bloco { display: grid; gap: 14px; }
.bloco-cab { display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center; }
.bloco-ico { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #fff; background: var(--c, var(--green)); box-shadow: 0 4px 0 var(--cd, var(--green-d)); }
.bloco-ico svg { width: 28px; height: 28px; }
.bloco.feito .bloco-ico { background: var(--gold); box-shadow: 0 4px 0 var(--gold-d); }
.bloco-hora { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .04em; }
.bloco-nome { font-size: 19px; font-weight: 800; }
.bloco-itens { display: grid; gap: 8px; }
.it { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; }
.it:hover { background: var(--surface-2); }
.it .it-t { font-weight: 800; font-size: 15px; line-height: 1.25; }
.it .it-s { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.it .it-min { font-weight: 800; color: var(--muted); font-size: 14px; white-space: nowrap; }
.it.feito { border-color: var(--gold); background: var(--gold-soft); }
.it.feito .it-min { color: var(--gold-ink); }
.bloco-acoes { display: flex; flex-wrap: wrap; gap: 10px; }
.nota { font-size: 14px; color: var(--muted); font-weight: 700; }
.pausa-lin { display: flex; align-items: center; gap: 10px; color: var(--faint); font-weight: 800; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
.pausa-lin::before, .pausa-lin::after { content: ''; flex: 1; border-top: 2px dashed var(--line); }

/* ------------------------------------------------------------ painel direito */
.meta-dia { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; }
.anel { position: relative; width: 76px; height: 76px; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel .anel-txt { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; font-size: 17px; }
.prova-linha { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
.prova-linha + .prova-linha { margin-top: 12px; }
.num-grande { font-size: 30px; font-weight: 900; line-height: 1; }

/* ------------------------------------------------------------ trilha */
.unidade { display: grid; gap: 22px; min-width: 0; content-visibility: auto; contain-intrinsic-block-size: auto 900px; }
.unidade-cab { border-radius: var(--r); padding: 18px 18px 16px; color: #fff; background: var(--u, var(--green)); box-shadow: 0 5px 0 var(--ud, var(--green-d)); display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.unidade-cab .upper { opacity: .9; font-size: 12px; }
.unidade-cab h2 { font-size: 21px; font-weight: 900; }
.unidade-cab .barra { background: rgba(255, 255, 255, .3); grid-column: 1 / -1; height: 12px; }
.unidade-cab .barra > i { background: #fff; }
.unidade-cab .btn.fantasma { --c: transparent; --cd: rgba(0, 0, 0, .18); --on: #fff; border-color: rgba(255, 255, 255, .5); }
.caminho { display: grid; gap: 16px; justify-items: center; padding: 6px 0 10px; }
.no-wrap { display: grid; justify-items: center; gap: 6px; transform: translateX(var(--x, 0)); }
.no { width: 76px; height: 70px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff; background: var(--nc, var(--surface-3)); box-shadow: 0 7px 0 var(--nd, var(--line-2)); transition: transform .08s, box-shadow .08s; position: relative; }
.no:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--nd, var(--line-2)); }
.no svg { width: 34px; height: 34px; }
.no.pendente { --nc: var(--surface-3); --nd: var(--line-2); color: var(--faint); }
.no.em_estudo { --nc: var(--green); --nd: var(--green-d); }
.no.teoria_ok { --nc: var(--blue); --nd: var(--blue-d); }
.no.estudado { --nc: var(--gold); --nd: var(--gold-d); }
.no.pulado { --nc: var(--gold); --nd: var(--gold-d); }
.no.atual { --nc: var(--green); --nd: var(--green-d); color: #fff; }
.no.atual::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 5px solid var(--green-soft); animation: pulso 1.6s ease-out infinite; }
.no.obrigatorio { outline: 3px solid var(--red); outline-offset: 4px; }
.no-rot { font-size: 13px; font-weight: 800; color: var(--muted); max-width: 190px; text-align: center; line-height: 1.2; }
.no-balao { background: var(--surface); border: 2px solid var(--line); color: var(--green-ink); font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 12px; animation: flutua 1.8s ease-in-out infinite; }
@keyframes pulso { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
@keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* ------------------------------------------------------------ folhas (modais) */
.fundo { position: fixed; inset: 0; background: var(--overlay); z-index: 60; display: grid; place-items: center; padding: 16px; animation: aparece .15s ease; }
.folha { background: var(--surface); border-radius: 22px; width: min(560px, 100%); max-height: min(88vh, 900px); overflow-y: auto; padding: 22px; display: grid; gap: 16px; border: 2px solid var(--line); animation: sobe .2s ease; }
.folha.larga { width: min(760px, 100%); }
.folha-cab { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.folha-cab h2 { font-size: 22px; font-weight: 900; }
@media (max-width: 640px) {
  .fundo { place-items: end center; padding: 0; }
  .folha { border-radius: 22px 22px 0 0; max-height: 92vh; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); border-bottom: 0; }
}
@keyframes aparece { from { opacity: 0; } to { opacity: 1; } }
@keyframes sobe { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } }

.itens-edital { display: grid; gap: 8px; }
.item-ed { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 14px; line-height: 1.4; }
.checks { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--surface); }
.check.on { border-color: var(--green); background: var(--green-soft); color: var(--green-ink); }
.check svg { width: 18px; height: 18px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kv > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.kv b { display: block; font-size: 20px; font-weight: 900; }
.kv span { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }

/* ------------------------------------------------------------ formulários */
.campo { display: grid; gap: 6px; }
.campo label, .rot { font-weight: 800; font-size: 14px; color: var(--muted); }
.input, select.input, textarea.input { border: 2px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; width: 100%; font-weight: 700; }
.input:focus { outline: none; border-color: var(--blue); background: var(--surface); }
textarea.input { min-height: 220px; resize: vertical; line-height: 1.5; font-weight: 600; }
.stepper { display: inline-grid; grid-template-columns: 44px minmax(56px, auto) 44px; align-items: center; border: 2px solid var(--line); border-radius: 14px; overflow: hidden; }
.stepper button { height: 44px; border: 0; background: var(--surface-2); cursor: pointer; font-size: 22px; font-weight: 900; color: var(--blue-ink); }
.stepper button:hover { background: var(--surface-3); }

sse.","Aprenda sujeito e complementos antes de concordância, regência e crase. As três dependem de saber quem é o sujeito e qual preposição o verbo pede.","Grave os casos de vírgula proibida: entre sujeito e verbo e entre verbo e complemento. Vírgula que isola oração adjetiva muda o sentido de restritiva para explicativa.","Na crase, troque a palavra feminina por uma masculina equivalente. Se aparecer ao, há crase; se aparecer só a ou o, não há.","Com verbo transitivo direto, o se é apassivador e o verbo concorda com o termo: vendem-se casas. Com verbo que pede preposição, o se indetermina o sujeito e o verbo fica no singular.","Para a PMDF com Cebraspe, treine muita reescrita. Confira em separado se a nova versão mantém o sentido e se continua correta.","Redação oficial é leitura do Manual de Redação da Presidência da República. Priorize pronomes de tratamento, vocativos, padrão ofício e os atributos da redação oficial."],"assuntos":[{"id":"portugues-interpretacao-de-textos","titulo":"Compreensão e interpretação de textos","blocos":2,"itens":["pmgo-portugues-01","pmdf-portugues-01"],"foco":"Julgar se uma afirmação está no texto ou pode ser inferida dele, sem extrapolar nem reduzir o que o autor disse.","incidencia":"alta"},{"id":"portugues-tipologia-e-linguagem","titulo":"Tipologia, gêneros, funções da linguagem e variação","blocos":2,"itens":["pmgo-portugues-02","pmdf-portugues-02","pmgo-portugues-12","pmgo-portugues-21"],"foco":"Reconhecer o tipo textual predominante, o gênero do texto e a função da linguagem que se destaca em um trecho.","incidencia":"media"},{"id":"portugues-semantica-e-figuras","titulo":"Significação das palavras e figuras de linguagem","blocos":2,"itens":["pmgo-portugues-03","pmgo-portugues-04","pmgo-portugues-05","pmdf-portugues-14","pmgo-portugues-15"],"foco":"Trocar uma palavra do texto por sinônimo sem mudar o sentido e identificar metáfora, metonímia, ironia, hipérbole e antítese.","incidencia":"media"},{"id":"portugues-ortografia-e-acentuacao","titulo":"Ortografia e acentuação gráfica","blocos":2,"itens":["pmgo-portugues-06","pmgo-portugues-07","pmdf-portugues-03","pmdf-portugues-04"],"foco":"Justificar o acento de palavras do texto pela regra (oxítona, paroxítona, proparoxítona, hiato) e aplicar as mudanças do Acordo Ortográfico.","incidencia":"media"},{"id":"portugues-formacao-e-classes-nominais","titulo":"Formação de palavras e classes nominais","blocos":2,"itens":["pmdf-portugues-06","pmgo-portugues-09"],"foco":"Reconhecer a classe da palavra pelo emprego na frase, como adjetivo usado como substantivo, e identificar derivação e composição.","incidencia":"media"},{"id":"portugues-verbos","titulo":"Verbos: tempos, modos e locuções verbais","blocos":3,"itens":["pmgo-portugues-09","pmdf-portugues-06","pmgo-portugues-10","pmgo-portugues-13"],"foco":"Identificar tempo e modo de uma forma verbal do texto, o valor que ela expressa e o verbo principal de uma locução verbal.","incidencia":"media"},{"id":"portugues-classes-invariaveis","titulo":"Advérbio, preposição, conjunção e interjeição","blocos":2,"itens":["pmgo-portugues-09","pmdf-portugues-06"],"foco":"Identificar o sentido que uma conjunção ou um advérbio dá à frase: causa, concessão, condição, oposição, tempo.","incidencia":"media"},{"id":"portugues-pronomes-e-colocacao","titulo":"Pronomes e colocação pronominal","blocos":2,"itens":["pmgo-portugues-09","pmdf-portugues-06","pmgo-portugues-19","pmdf-portugues-10"],"foco":"Identificar o termo a que o pronome se refere, usar bem este, esse, aquele e cujo, e escolher entre próclise, mesóclise e ênclise.","incidencia":"media"},{"id":"portugues-termos-da-oracao","titulo":"Termos da oração: período simples","blocos":3,"itens":["pmgo-portugues-16","pmdf-portugues-07"],"foco":"Identificar sujeito, objeto direto e indireto, predicativo, adjunto adnominal, complemento nominal e aposto em frases do próprio texto.","incidencia":"alta"},{"id":"portugues-periodo-composto","titulo":"Período composto: coordenação e subordinação","blocos":3,"itens":["pmgo-portugues-16","pmdf-portugues-07"],"foco":"Classificar orações coordenadas e subordinadas, com peso maior nas adjetivas restritivas e explicativas e nas adverbiais.","incidencia":"alta"},{"id":"portugues-que-e-se","titulo":"Funções do \"que\" e do \"se\"","blocos":1,"itens":["pmgo-portugues-11"],"foco":"Distinguir o que pronome relativo do que conjunção integrante, e o se partícula apassivadora do se índice de indeterminação do sujeito.","incidencia":"media"},{"id":"portugues-concordancia","titulo":"Concordância verbal e nominal","blocos":2,"itens":["pmgo-portugues-17","pmdf-portugues-09"],"foco":"Concordar o verbo com sujeito posposto ou distante e com o se apassivador, além de casos como haver no sentido de existir.","incidencia":"alta"},{"id":"portugues-regencia","titulo":"Regência verbal e nominal","blocos":2,"itens":["pmgo-portugues-18","pmdf-portugues-11"],"foco":"Saber a preposição exigida por verbos como assistir, visar, aspirar, obedecer, preferir e implicar, inclusive antes de pronome relativo.","incidencia":"media"},{"id":"portugues-crase","titulo":"Crase","blocos":1,"itens":["pmgo-portugues-08","pmdf-portugues-05"],"foco":"Decidir se há crase pela soma de preposição com artigo e aplicar os casos proibidos, obrigatórios e facultativos.","incidencia":"alta"},{"id":"portugues-pontuacao","titulo":"Pontuação","blocos":2,"itens":["pmgo-portugues-20","pmdf-portugues-08"],"foco":"Justificar o uso da vírgula e julgar se retirar ou acrescentar uma vírgula muda o sentido ou gera erro, como entre sujeito e verbo.","incidencia":"alta"},{"id":"portugues-coesao-e-coerencia","titulo":"Coesão e coerência textual","blocos":2,"itens":["pmgo-portugues-13","pmgo-portugues-14","pmgo-portugues-21"],"foco":"Identificar o termo que um pronome ou expressão retoma e o sentido dos conectores, sabendo trocar um conector por outro equivalente.","incidencia":"alta"},{"id":"portugues-reescrita","titulo":"Reescrita, equivalência e paralelismo","blocos":2,"itens":["pmgo-portugues-15","pmdf-portugues-12","pmdf-portugues-13"],"foco":"Julgar se a reescrita de um trecho mantém o sentido original e a correção gramatical, incluindo a troca da voz ativa pela passiva.","incidencia":"alta"},{"id":"portugues-redacao-oficial","titulo":"Redação oficial","blocos":2,"itens":["pmgo-portugues-22","pmdf-portugues-15"],"foco":"Pronomes de tratamento, vocativos, padrão ofício e atributos como clareza, concisão, formalidade e impessoalidade, conforme o Manual de Redação da Presidência da República.","incidencia":"media"}]},{"id":"constitucional","nome":"Direito Constitucional","dicas":["Leia a lei seca do assunto antes da videoaula e releia depois. Em prova de soldado, boa parte das questões copia o texto da Constituição com uma palavra trocada.","Priorize os arts. 1º ao 5º, 12, 37, 42, 142 e 144. São os trechos que mais aparecem em provas de polícia militar.","Fique atento à troca de termos: lei por lei complementar, poderá por deverá, nato por naturalizado. A banca muda um termo e mantém o resto da frase igual.","Monte uma tabela de números: idades de elegibilidade, mandatos, prazos do estado de defesa e de sítio, quóruns de emenda e de lei complementar. Número é alvo frequente de pegadinha.","Use mnemônicos para listas longas, como SOCIDIVAPLU para os fundamentos da República. Crie os seus para objetivos, direitos sociais e órgãos de segurança pública.","Na repartição de competências, separe legislar de executar. A competência concorrente para legislar não cita os Municípios no texto, e essa ausência costuma virar pegadinha.","Estude com atenção as regras do militar: proibição de greve e de sindicalização, vedação de filiação partidária na ativa e a regra do habeas corpus em punição disciplinar. Elas valem para PM e bombeiro por remissão do art. 42.","Treine questões das duas bancas. A AOCP costuma cobrar a letra da lei, e a Cebraspe mistura texto constitucional com entendimento do STF. Anote cada erro pelo número do artigo e revise o artigo na lei seca."],"assuntos":[{"id":"constitucional-teoria-da-constituicao","titulo":"Teoria da Constituição e poder constituinte","blocos":2,"itens":["pmdf-constitucional-01","pmdf-constitucional-02"],"foco":"Classificação da CF de 1988 (promulgada, escrita, rígida, analítica) e diferenças entre o poder originário e o derivado, com os limites do art. 60 para emendas.","incidencia":"baixa"},{"id":"constitucional-principios-fundamentais","titulo":"Princípios fundamentais","blocos":1,"itens":["pmgo-constitucional-01","pmdf-constitucional-03"],"foco":"Separar fundamentos, objetivos e princípios das relações internacionais dos arts. 1º a 4º, que a banca troca entre si.","incidencia":"alta"},{"id":"constitucional-direitos-individuais-liberdades","titulo":"Direitos individuais: igualdade, liberdades e propriedade","blocos":2,"itens":["pmdf-constitucional-04","pmdf-constitucional-05","pmgo-constitucional-02"],"foco":"Inviolabilidade da casa, sigilo das comunicações, direito de reunião e liberdade de associação, com as exceções exatamente como estão no art. 5º.","incidencia":"alta"},{"id":"constitucional-direitos-individuais-garantias-penais","titulo":"Direitos individuais: garantias penais e processuais","blocos":2,"itens":["pmdf-constitucional-04","pmdf-constitucional-05","pmgo-constitucional-02"],"foco":"Crimes inafiançáveis e imprescritíveis, penas proibidas, extradição, tribunal do júri, provas ilícitas e direitos do preso.","incidencia":"alta"},{"id":"constitucional-remedios-constitucionais","titulo":"Remédios constitucionais","blocos":2,"itens":["pmdf-constitucional-04","pmdf-constitucional-05","pmdf-constitucional-09","pmgo-constitucional-02"],"foco":"Cabimento de cada remédio, quem pode impetrar o mandado de segurança coletivo e quais ações são gratuitas.","incidencia":"alta"},{"id":"constitucional-direitos-sociais","titulo":"Direitos sociais","blocos":2,"itens":["pmdf-constitucional-04","pmdf-constitucional-06"],"foco":"Lista de direitos sociais do art. 6º, direitos trabalhistas do art. 7º, liberdade sindical e direito de greve.","incidencia":"media"},{"id":"constitucional-nacionalidade","titulo":"Nacionalidade","blocos":1,"itens":["pmdf-constitucional-04","pmdf-constitucional-07","pmgo-constitucional-02"],"foco":"Hipóteses de brasileiro nato e naturalizado, cargos privativos de nato e casos de perda da nacionalidade.","incidencia":"media"},{"id":"constitucional-direitos-politicos","titulo":"Direitos políticos e partidos políticos","blocos":2,"itens":["pmdf-constitucional-04","pmdf-constitucional-08"],"foco":"Voto obrigatório e facultativo, idades mínimas de elegibilidade, inelegibilidades e casos de perda ou suspensão dos direitos políticos.","incidencia":"media"},{"id":"constitucional-entes-federados-intervencao","titulo":"Organização do Estado: entes federados e intervenção","blocos":3,"itens":["pmdf-constitucional-10","pmdf-constitucional-11","pmdf-constitucional-12","pmdf-constitucional-14","pmgo-constitucional-03"],"foco":"Autonomia dos entes, vedações do art. 19, regras próprias do Distrito Federal e hipóteses e procedimento da intervenção federal.","incidencia":"media"},{"id":"constitucional-reparticao-de-competencias","titulo":"Repartição de competências","blocos":2,"itens":["pmdf-constitucional-10","pmdf-constitucional-13","pmgo-constitucional-03"],"foco":"Diferença entre competência exclusiva, privativa, comum e concorrente, incluindo quem legisla sobre as polícias militares e quem organiza e mantém a PMDF.","incidencia":"media"},{"id":"constitucional-administracao-publica","titulo":"Administração pública: disposições gerais","blocos":2,"itens":["pmdf-constitucional-10","pmdf-constitucional-15","pmgo-constitucional-06"],"foco":"Princípios do art. 37, concurso público, acumulação de cargos, teto remuneratório e responsabilidade civil objetiva do Estado.","incidencia":"alta"},{"id":"constitucional-servidores-e-militares","titulo":"Servidores públicos e militares dos Estados e do DF","blocos":2,"itens":["pmdf-constitucional-10","pmdf-constitucional-15","pmgo-constitucional-03","pmgo-constitucional-06"],"foco":"Estabilidade e hipóteses de perda do cargo do servidor e as regras do art. 42 para policiais e bombeiros militares.","incidencia":"media"},{"id":"constitucional-poder-legislativo","titulo":"Poder Legislativo","blocos":2,"itens":["pmdf-constitucional-16","pmdf-constitucional-17","pmgo-constitucional-04"],"foco":"Composição e mandatos da Câmara e do Senado, imunidades parlamentares, CPIs e competências exclusivas do Congresso Nacional.","incidencia":"media"},{"id":"constitucional-processo-legislativo","titulo":"Processo legislativo","blocos":2,"itens":["pmdf-constitucional-16","pmdf-constitucional-17","pmgo-constitucional-04"],"foco":"Iniciativa e quórum de emenda constitucional, limites da medida provisória e diferença entre lei complementar e lei ordinária.","incidencia":"media"},{"id":"constitucional-poder-executivo","titulo":"Poder Executivo","blocos":1,"itens":["pmdf-constitucional-16","pmdf-constitucional-18","pmgo-constitucional-04"],"foco":"Eleição e mandato do Presidente, linha de sucessão na vacância, atribuições delegáveis do art. 84 e crimes de responsabilidade.","incidencia":"baixa"},{"id":"constitucional-judiciario-funcoes-essenciais","titulo":"Poder Judiciário e funções essenciais à Justiça","blocos":3,"itens":["pmdf-constitucional-16","pmdf-constitucional-19","pmdf-constitucional-20"],"foco":"Garantias e vedações dos juízes e dos membros do Ministério Público, composição do STF e do CNJ e papel da Defensoria Pública.","incidencia":"baixa"},{"id":"constitucional-estados-de-excecao-forcas-armadas","titulo":"Estado de defesa, estado de sítio e Forças Armadas","blocos":2,"itens":["pmdf-constitucional-21","pmgo-constitucional-05"],"foco":"Quem decreta, quem autoriza e por quanto tempo valem o estado de defesa e o estado de sítio, além das proibições impostas ao militar no art. 142.","incidencia":"media"},{"id":"constitucional-seguranca-publica","titulo":"Segurança pública","blocos":2,"itens":["pmdf-constitucional-21","pmgo-constitucional-05"],"foco":"Rol de órgãos do art. 144, atribuição de cada polícia e subordinação das polícias militares e bombeiros aos governadores.","incidencia":"alta"}]},{"id":"processo_penal","nome":"Direito Processual Penal","dicas":["Leia a lei seca do CPP nos trechos de inquérito, prisões, provas e habeas corpus. A banca de soldado copia o texto legal e troca uma palavra.","No flagrante, separe \"poderá\" de \"deverá\". Qualquer do povo pode prender em flagrante, mas a autoridade policial e seus agentes têm o dever de prender.","Não confunda temporária com preventiva. A temporária só existe no inquérito e tem prazo fixo. A preventiva cabe no inquérito ou no processo e não tem prazo máximo, só revisão a cada 90 dias.","Desde a Lei 13.964/2019, o juiz não decreta preventiva nem cautelar diversa de ofício. A temporária nunca pôde ser decretada de ofício.","Para ação penal, monte uma tabela com titular, peça inicial, prazo e causas de extinção de cada espécie. Perdão e perempção só cabem na ação privada exclusiva.","No inquérito, grave as características: escrito, sigiloso, inquisitivo e dispensável. A pegadinha clássica diz que o delegado pode arquivar o inquérito.","Em provas, a banca gosta da prova ilícita por derivação e das suas exceções. Estude também a cadeia de custódia, que tem ligação direta com o trabalho do policial no local do crime.","Resolva questões da AOCP e do Cebraspe separadas. A AOCP cobra mais letra de lei. O Cebraspe cobra também jurisprudência do STF e do STJ, como busca pessoal por fundada suspeita e entrada em domicílio."],"assuntos":[{"id":"processo_penal-principios-e-sistemas","titulo":"Princípios e sistemas processuais","blocos":2,"itens":["pmdf-processo_penal-01","pmgo-processo_penal-02"],"foco":"Presunção de inocência, contraditório, ampla defesa, direito ao silêncio e diferença entre sistema acusatório e inquisitivo, com o juiz das garantias.","incidencia":"media"},{"id":"processo_penal-lei-no-tempo-e-no-espaco","titulo":"Lei processual penal no tempo, no espaço e às pessoas","blocos":1,"itens":["pmgo-processo_penal-01","pmgo-processo_penal-02","pmdf-processo_penal-01"],"foco":"Aplicação imediata da lei processual com validade dos atos já praticados, normas mistas, territorialidade e suas exceções, imunidades e admissão de interpretação extensiva e analogia.","incidencia":"media"},{"id":"processo_penal-inquerito-policial","titulo":"Inquérito policial","blocos":3,"itens":["pmgo-processo_penal-03","pmdf-processo_penal-02","pmdf-processo_penal-03"],"foco":"Características do inquérito (escrito, sigiloso, inquisitivo, dispensável), formas de instauração, prazos de conclusão, indiciamento e a regra de que o delegado não pode mandar arquivar os autos.","incidencia":"alta"},{"id":"processo_penal-acao-penal","titulo":"Ação penal e ação civil ex delicto","blocos":3,"itens":["pmgo-processo_penal-04","pmdf-processo_penal-08"],"foco":"Espécies de ação penal pelo titular, representação e prazo decadencial de 6 meses, e causas de extinção da ação privada: renúncia, perdão e perempção.","incidencia":"alta"},{"id":"processo_penal-tco-anpp-e-outras-investigacoes","titulo":"TCO, ANPP e outras investigações preliminares","blocos":2,"itens":["pmdf-processo_penal-02","pmdf-processo_penal-04","pmdf-processo_penal-05","pmdf-processo_penal-06","pmdf-processo_penal-07"],"foco":"Requisitos e vedações do ANPP, lavratura do TCO nas infrações de menor potencial ofensivo e poder de investigação e controle externo da polícia pelo Ministério Público.","incidencia":"media"},{"id":"processo_penal-jurisdicao-e-competencia","titulo":"Jurisdição e competência","blocos":2,"itens":["pmgo-processo_penal-09","pmdf-processo_penal-09"],"foco":"Competência pelo lugar da consumação, conexão e continência, foro por prerrogativa de função e divisão entre Justiça Federal, estadual e militar.","incidencia":"media"},{"id":"processo_penal-provas-teoria-geral","titulo":"Provas: teoria geral e provas ilícitas","blocos":2,"itens":["pmdf-processo_penal-10","pmdf-processo_penal-11"],"foco":"Provas ilícitas e derivadas, exceções da fonte independente e da descoberta inevitável, ônus da prova, sistemas de apreciação e cadeia de custódia.","incidencia":"media"},{"id":"processo_penal-meios-de-prova","titulo":"Meios de prova em espécie","blocos":3,"itens":["pmdf-processo_penal-10","pmdf-processo_penal-12"],"foco":"Exame de corpo de delito quando a infração deixa vestígios, confissão que não supre esse exame, interrogatório e direito ao silêncio, e quem pode se recusar a depor como testemunha.","incidencia":"alta"},{"id":"processo_penal-busca-e-apreensao","titulo":"Busca e apreensão e meios de obtenção de prova","blocos":2,"itens":["pmdf-processo_penal-10","pmdf-processo_penal-12"],"foco":"Busca domiciliar com ordem judicial durante o dia, salvo flagrante, desastre, socorro ou consentimento, busca pessoal por fundada suspeita sem mandado e noções de interceptação telefônica.","incidencia":"alta"},{"id":"processo_penal-prisao-em-flagrante","titulo":"Prisão em flagrante e regras gerais das cautelares","blocos":3,"itens":["pmgo-processo_penal-05","pmdf-processo_penal-13"],"foco":"Espécies de flagrante (próprio, impróprio, presumido, preparado, esperado e forjado), quem pode e quem deve prender, auto de prisão, nota de culpa e audiência de custódia em 24 horas.","incidencia":"alta"},{"id":"processo_penal-prisao-preventiva","titulo":"Prisão preventiva e prisão domiciliar","blocos":2,"itens":["pmgo-processo_penal-05","pmdf-processo_penal-13"],"foco":"Pressupostos e fundamentos da preventiva, proibição de decretação de ofício, crimes que a admitem, revisão a cada 90 dias e substituição por prisão domiciliar.","incidencia":"alta"},{"id":"processo_penal-prisao-temporaria","titulo":"Prisão temporária (Lei 7.960/1989)","blocos":1,"itens":["pmgo-processo_penal-05","pmgo-processo_penal-06","pmdf-processo_penal-13","pmdf-processo_penal-18"],"foco":"  Lei 8.429/1992, Lei 9.784/1999 e Lei 12.527/2011. Elas caem quase literais e rendem pontos rápidos.","Leia o art. 37 da CF inteiro, do caput aos parágrafos. Concurso, acumulação, teto, improbidade e responsabilidade civil do Estado saem dali.","Não confunda descentralização com desconcentração. Na descentralização nasce outra pessoa jurídica; na desconcentração a divisão é interna, em órgãos.","Anulação é por ilegalidade e pode ser feita pela Administração ou pelo Judiciário. Revogação é por conveniência e oportunidade e só a própria Administração faz.","Na improbidade, depois da reforma de 2021, só existe ato doloso. Item que fala em improbidade culposa por dano ao erário está errado.","Na responsabilidade civil do Estado, a vítima não precisa provar culpa do agente. Dolo ou culpa só importam na ação regressiva do Estado contra o servidor.","O poder de polícia é a base da atuação da PM e cai muito. Lembre que a multa não é autoexecutória: a cobrança forçada depende do Judiciário.","Filtre questões por data em licitações e improbidade. Questões baseadas na Lei 8.666/1993 ou no texto antigo da Lei 8.429/1992 têm gabaritos que hoje estão errados."],"assuntos":[{"id":"administrativo-estado-administracao-principios","titulo":"Estado, Administração Pública e princípios","blocos":2,"itens":["pmgo-administrativo-01","pmdf-administrativo-01"],"foco":"Os cinco princípios expressos no caput do art. 37 da CF, os implícitos como supremacia e indisponibilidade do interesse público, e a diferença entre governo e administração.","incidencia":"alta"},{"id":"administrativo-organizacao-administrativa","titulo":"Organização administrativa: direta e indireta","blocos":2,"itens":["pmgo-administrativo-02","pmdf-administrativo-03","pmgo-administrativo-01"],"foco":"Diferença entre descentralização e desconcentração e as características de autarquia, fundação pública, empresa pública e sociedade de economia mista.","incidencia":"alta"},{"id":"administrativo-poderes-administrativos","titulo":"Poderes administrativos, discricionariedade e abuso","blocos":2,"itens":["pmgo-administrativo-04","pmdf-administrativo-02"],"foco":"Atributos e limites do poder de polícia, diferença entre poder hierárquico e disciplinar, e as duas formas de abuso: excesso de poder e desvio de finalidade.","incidencia":"alta"},{"id":"administrativo-atos-requisitos-atributos","titulo":"Atos administrativos: conceito, requisitos e atributos","blocos":2,"itens":["pmgo-administrativo-05","pmdf-administrativo-04"],"foco":"Os cinco requisitos (competência, finalidade, forma, motivo e objeto), a teoria dos motivos determinantes e os atributos de presunção de legitimidade, imperatividade e autoexecutoriedade.","incidencia":"alta"},{"id":"administrativo-atos-especies-extincao","titulo":"Atos: classificação, espécies, extinção e convalidação","blocos":2,"itens":["pmgo-administrativo-05","pmdf-administrativo-04"],"foco":"Diferença entre anulação e revogação, quem pode fazer cada uma, quais vícios admitem convalidação e a distinção entre licença e autorização.","incidencia":"alta"},{"id":"administrativo-agentes-publicos-constituicao","titulo":"Agentes públicos e regras constitucionais","blocos":2,"itens":["pmdf-administrativo-10","pmgo-administrativo-03"],"foco":"Espécies de agentes, cargo, emprego e função, e as regras constitucionais de concurso, acumulação de cargos, teto remuneratório, greve e sindicalização, com a vedação aos militares.","incidencia":"media"},{"id":"administrativo-regime-juridico-servidor","titulo":"Regime do servidor: provimento, direitos e disciplina","blocos":3,"itens":["pmgo-administrativo-03"],"foco":"Formas de provimento e vacância, diferença entre remoção e redistribuição, penalidades disciplinares e a independência das responsabilidades civil, penal e administrativa.","incidencia":"media"},{"id":"administrativo-processo-administrativo","titulo":"Processo administrativo (Lei 9.784/1999)","blocos":2,"itens":["pmdf-administrativo-07"],"foco":"Impedimento e suspeiçã ritível.","incidencia":"media"},{"id":"extravagante-juizados-especiais-criminais","titulo":"Juizados Especiais Criminais","blocos":2,"itens":["pmgo-extravagante-11","pmdf-extravagante-10"],"foco":"Infração de menor potencial ofensivo (pena máxima de até 2 anos), termo circunstanciado, composição civil, transação penal e suspensão condicional do processo.","incidencia":"media"},{"id":"extravagante-maria-da-penha-conceitos","titulo":"Maria da Penha: conceitos e formas de violência","blocos":1,"itens":["pmgo-extravagante-01","pmdf-extravagante-12"],"foco":"Onde a lei se aplica (unidade doméstica, família e relação íntima de afeto) e as cinco formas de violência: física, psicológica, sexual, patrimonial e moral.","incidencia":"alta"},{"id":"extravagante-maria-da-penha-medidas-protetivas","titulo":"Maria da Penha: atendimento policial e medidas protetivas","blocos":2,"itens":["pmdf-extravagante-12"],"foco":"Providências da autoridade policial, medidas protetivas de urgência, o crime de descumprimento de medida protetiva e a proibição de aplicar a Lei 9.099.","incidencia":"alta"},{"id":"extravagante-eca-parte-geral","titulo":"ECA: parte geral, direitos e Conselho Tutelar","blocos":2,"itens":["pmgo-extravagante-07"],"foco":"Conceito de criança e de adolescente, direitos fundamentais, medidas de proteção e atribuições do Conselho Tutelar.","incidencia":"media"},{"id":"extravagante-eca-ato-infracional","titulo":"ECA: ato infracional, medidas e apuração","blocos":3,"itens":["pmgo-extravagante-07","pmdf-extravagante-03"],"foco":"Medidas socioeducativas e seus limites (internação de no máximo 3 anos), apreensão em flagrante do adolescente, internação provisória de até 45 dias e remissão.","incidencia":"alta"},{"id":"extravagante-eca-crimes-e-infiltracao","titulo":"ECA: crimes e infiltração de agentes","blocos":2,"itens":["pmgo-extravagante-07","pmdf-extravagante-03"],"foco":"Crimes de produção e divulgação de cena de sexo envolvendo criança ou adolescente, corrupção de menores
