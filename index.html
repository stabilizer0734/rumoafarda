    { nome: 'Tenente-Coronel', xp: 78000 },
    { nome: 'Coronel', xp: 91000 },
  ];

  // --------------------------------------------------------- configuração
  E.gradePadrao = () => {
    const util = () => ({ descanso: false, inicio: '08:30', pausa: 10, blocos: [{ tipo: 'questoes_ontem', min: 50 }, { tipo: 'teoria', min: 50 }, { tipo: 'revisao', min: 50 }] });
    return {
      0: { descanso: false, inicio: '17:00', pausa: 10, blocos: [{ tipo: 'revisao_semana', min: 60 }] },
      1: util(), 2: util(), 3: util(), 4: util(), 5: util(),
      6: { descanso: false, inicio: '08:30', pausa: 10, blocos: [{ tipo: 'questoes_mistas', min: 50 }, { tipo: 'questoes_mistas', min: 50 }, { tipo: 'questoes_mistas', min: 50 }] },
    };
  };

  E.configPadrao = (edital, hoje) => ({
    versao: 1,
    criadoEm: hoje,
    onboardingFeito: false,
    provas: { PMDF: '2027-04-25', PMGO: '2027-04-25' },
    prioridade: ['PMDF', 'PMGO'],
    ordemMaterias: edital.materias.map(m => m.id),
    autoavaliacao: {},
    blocosAssunto: {},
    grade: E.gradePadrao(),
    metas: { questoesPor50: 20, trabalho: 20 },
    redacaoCadaDias: 14,
    plataforma: 'qconcursos',
    sons: true,
  });

  // Completa uma configuração salva com o que faltar (versões antigas, edital novo, backup estranho).
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
  const normalizarGrade = (fonte, base) => {
    const grade = {};
    for (let d = 0; d < 7; d++) {
      const g = obj(fonte[d]);
      const b = base[d];
      const blocos = Array.isArray(g.blocos) ? g.blocos : (fonte[d] ? [] : b.blocos);
      grade[d] = {
        descanso: !!g.descanso,
        inicio: /^\d{2}:\d{2}$/.test(g.inicio || '') ? g.inicio : b.inicio,
        pausa: Number.isFinite(g.pausa) ? clamp(Math.round(g.pausa), 0, 60) : b.pausa,
        blocos: blocos.filter(x => x && E.TIPOS[x.tipo]).map(x => ({ tipo: x.tipo, min: clamp(Math.round(Number(x.min) || 50), 5, 300) })),
      };
    }
    return grade;
  };
  E.normalizarConfig = (cfg, edital, hoje) => {
    const base = E.configPadrao(edital, hoje);
    const src = obj(cfg);
    const c = Object.assign({}, base, src);
    c.provas = Object.assign({}, base.provas, obj(src.provas));
    c.metas = Object.assign({}, base.metas, obj(src.metas));
    Object.keys(c.metas).forEach(k => { if (!Number.isFinite(c.metas[k])) c.metas[k] = base.metas[k]; });
    c.autoavaliacao = Object.assign({}, obj(src.autoavaliacao));
    c.blocosAssunto = Object.assign({}, obj(src.blocosAssunto));
    c.grade = normalizarGrade(obj(src.grade), base.grade);
    c.historicoGrade = (Array.isArray(src.historicoGrade) ? src.historicoGrade : [])
      .filter(h => h && typeof h.ate === 'string' && h.grade)
      .map(h => ({ ate: h.ate, grade: normalizarGrade(obj(h.grade), base.grade) }))
      .sort((a, b) => a.ate.localeCompare(b.ate))
      .slice(-30);
    const ids = edital.materias.map(m => m.id);
    const ordem = (Array.isArray(src.ordemMaterias) ? src.ordemMaterias : []).filter((id, i, l) => ids.includes(id) && l.indexOf(id) === i);
    ids.forEach(id => { if (!ordem.includes(id)) ordem.push(id); });
    c.ordemMaterias = ordem;
    if (!Array.isArray(c.prioridade) || c.prioridade.length !== 2 || !c.prioridade.includes('PMDF') || !c.prioridade.includes('PMGO')) c.prioridade = ['PMDF', 'PMGO'];
    if (![7, 14, 21].includes(c.redacaoCadaDias)) c.redacaoCadaDias = 14;
    if (typeof c.criadoEm !== 'string') c.criadoEm = hoje;
    return c;
  };

  // A grade que valia numa data. Mudar a grade hoje não reescreve o passado.
  E.gradeEm = (cfg, data) => {
    const h = (cfg.historicoGrade || []).find(x => data < x.ate);
    return h ? h.grade : cfg.grade;
  };
  E.gradeDoDia = (cfg, data) => E.gradeEm(cfg, data)[E.diaSemana(data)];
  // Grava a grade nova guardando a anterior como válida até ontem.
  E.trocarGrade = (cfg, novaGrade, hoje) => {
    const hist = (cfg.historicoGrade || []).slice();
    if (!hist.some(h => h.ate === hoje) && JSON.stringify(cfg.grade) !== JSON.stringify(novaGrade)) hist.push({ ate: hoje, grade: cfg.grade });
    return { grade: novaGrade, historicoGrade: hist.slice(-30) };
  };

  // O diário guarda cada lançamento numa chave própria (id), pra dois aparelhos não se atropelarem.
  // Aqui volta a ser lista, na ordem em que aconteceu.
  E.CAMPOS_DIA = ['sessoes', 'questoes', 'simulados', 'redacoes', 'revisoes'];
  E.normalizarDia = body => {
    const d = Object.assign({}, obj(body));
    E.CAMPOS_DIA.forEach(k => {
      const v = d[k];
      if (Array.isArray(v)) d[k] = v.filter(Boolean);
      else if (v && typeof v === 'object') d[k] = Object.keys(v).map(id => Object.assign({ id }, v[id])).filter(x => x && typeof x === 'object').sort((a, b) => ((a.ordem || 0) - (b.ordem || 0)) || String(a.id).localeCompare(String(b.id)));
      else d[k] = [];
    });
    return d;
  };

  // ---------------------------------------------------------------- edital
  E.indexar = edital => {
    const assuntos = {}, materias = {};
    const itens = {};
    (edital.itens || []).forEach(i => { itens[i.id] = i; });
    edital.materias.forEach(m => {
      materias[m.id] = m;
      m.assuntos.forEach((a, i) => {
        const conc = [];
        (a.itens || []).forEach(id => { const it = itens[id]; if (it && !conc.includes(it.fonte)) conc.push(it.fonte); });
        conc.sort();
        assuntos[a.id] = Object.assign({}, a, { materia: m.id, idx: i, concursos: conc.length ? conc : (a.concursos || []) });
      });
      const conc = [];
      m.assuntos.forEach(a => assuntos[a.id].concursos.forEach(c => { if (!conc.includes(c)) conc.push(c); }));
      m.concursos = conc.sort();
    });
    return { assuntos, materias, itens, edital };
  };

  E.blocosDe = (a, cfg) => (cfg.blocosAssunto && cfg.blocosAssunto[a.id]) || a.blocos;

  E.minNecessarios = (a, cfg, p) => {
    const fator = p && p.obrigatorio ? 1 : (E.FATOR[cfg.autoavaliacao[a.materia]] || 1);
    return round5(E.blocosDe(a, cfg) * 50 * fator);
  };

  E.minRevisao = (a, cfg) => clamp(round5(E.blocosDe(a, cfg) * 8), 10, 25);

  // --------------------------------------------------------------- agregar
  // O diário (dias) é a fonte da verdade de tempo, questões, simulados e redações.
  E.agregar = dias => {
    const porAssunto = {};
    const get = id => porAssunto[id] || (porAssunto[id] = { minTeoria: 0, minTotal: 0, feitas: 0, acertos: 0, ultimaQuestao: null, diasTeoria: [] });
    Object.keys(dias).sort().forEach(data => {
      const d = dias[data] || {};
      (d.sessoes || []).forEach(s => {
        if (!s.assuntoId) return;
        const a = get(s.assuntoId);
        a.minTotal += s.min || 0;
        if (s.tipo === 'teoria') { a.minTeoria += s.min || 0; if (!a.diasTeoria.includes(data)) a.diasTeoria.push(data); }
      });
      (d.questoes || []).forEach(q => {
        if (!q.assuntoId) return;
        const a = get(q.assuntoId);
        a.feitas += q.feitas || 0; a.acertos += q.acertos || 0; a.ultimaQuestao = data;
      });
    });
    return porAssunto;
  };

  // Status derivado: o documento guarda só os marcos; o resto sai do diário.
  E.statusDe = (doc, ag) => {
    if (doc.puladoEm) return 'pulado';
    if (doc.estudadoEm) return 'estudado';
    if (doc.teoriaConcluidaEm) return 'teoria_ok';
    if (ag && ag.minTeoria > 0) return 'em_estudo';
    return 'pendente';
  };

  E.montarProgresso = (idx, docs, agg) => {
    const prog = {};
    Object.keys(idx.assuntos).forEach(id => {
      const doc = docs[id] || {};
      const ag = agg[id] || { minTeoria: 0, minTotal: 0, feitas: 0, acertos: 0, ultimaQuestao: null, diasTeoria: [] };
      prog[id] = Object.assign({}, doc, ag, { status: E.statusDe(doc, ag) });
    });
    return prog;
  };

  E.NA_FILA = s => s === 'pendente' || s === 'em_estudo';
  E.CONCLUIDO = s => s === 'estudado' || s === 'pulado';
  E.acerto = p => (p && p.feitas ? p.acertos / p.feitas : null);

  // Progresso como estava no começo do dia, pra o plano de hoje não mudar enquanto você estuda.
  // Tempo, questões e marcos de hoje saem da conta. O pulo vale na hora: assunto pulado sai do plano.
  const AG_VAZIO = { minTeoria: 0, minTotal: 0, feitas: 0, acertos: 0, ultimaQuestao: null, diasTeoria: [] };
  E.progressoInicioDia = (ctx, hoje) => {
    const antes = {};
    Object.keys(ctx.dias).forEach(k => { if (k < hoje) antes[k] = ctx.dias[k]; });
    const agg = E.agregar(antes);
    const out = {};
    Object.keys(ctx.prog).forEach(id => {
      const p = ctx.prog[id];
      const q = Object.assign({}, p, agg[id] || AG_VAZIO);
      if (q.teoriaConcluidaEm && q.teoriaConcluidaEm >= hoje) q.teoriaConcluidaEm = null;
      if (q.estudadoEm && q.estudadoEm >= hoje) q.estudadoEm = null;
      q.status = E.statusDe(q, agg[id] || AG_VAZIO);
      out[id] = q;
    });
    return out;
  };

  // ---------------------------------------------------------------- filas
  E.filaTeoria = (ctx, prog) => {
    const { idx, cfg } = ctx;
    const out = [];
    cfg.ordemMaterias.forEach(mid => {
      const m = idx.materias[mid];
      if (!m) return;
      m.assuntos.forEach(a0 => {
        const a = idx.assuntos[a0.id];
        const p = prog[a.id];
        if (!E.NA_FILA(p.status)) return;
        const nec = E.minNecessarios(a, cfg, p);
        out.push({ assuntoId: a.id, materia: mid, necessarios: nec, feitos: p.minTeoria, falta: Math.max(10, nec - p.minTeoria) });
      });
    });
    return out;
  };

  E.materiaAtual = (ctx, prog) => {
    const f = E.filaTeoria(ctx, prog);
    return f.length ? f[0].materia : null;
  };

  E.materiaFechada = (m, prog) => m.assuntos.every(a => E.CONCLUIDO(prog[a.id].status));

  E.revisoesPendentes = (ctx, prog, hoje) => {
    const out = [];
    Object.keys(prog).forEach(id => {
      const p = prog[id];
      const r = p.rev;
      if (!r) return;
      const dues = [];
      if (r.proxima && r.proxima <= hoje) dues.push(r.proxima);
      if (r.extra && r.extra <= hoje) dues.push(r.extra);
      if (!dues.length) return;
      const due = dues.sort()[0];
      out.push({ assuntoId: id, due, atraso: E.diffDias(due, hoje), acerto: E.acerto(p), extra: !(r.proxima && r.proxima <= hoje) });
    });
    out.sort((a, b) => (b.atraso - a.atraso) || ((a.acerto == null ? 1 : a.acerto) - (b.acerto == null ? 1 : b.acerto)));
    return out;
  };

  // ---------------------------------------------------------- plano do dia
  E.minutosDoDia = dia => soma((dia && dia.sessoes) || [], s => s.min || 0);
  E.questoesDoDia = dia => soma((dia && dia.questoes) || [], q => q.feitas || 0);
  E.acertosDoDia = dia => soma((dia && dia.questoes) || [], q => q.acertos || 0);
  E.questoesOfensiva = dia => E.questoesDoDia(dia) + soma((dia && dia.simulados) || [], s => s.total || 0);
  E.diaEstudado = dia => E.minutosDoDia(dia) >= E.MIN_OFENSIVA || E.questoesOfensiva(dia) >= E.QUESTOES_OFENSIVA;
  E.minutosPlanejados = (cfg, data) => {
    const g = E.gradeDoDia(cfg, data);
    if (!g || g.descanso) return 0;
    return soma(g.blocos, b => b.min);
  };
  E.diaDescanso = (cfg, data) => { const g = E.gradeDoDia(cfg, data); return !g || g.descanso || !g.blocos.length; };

  // Regra 2: dois dias seguidos sem estudar (sem contar descanso) acendem o alarme.
  // Conta desde o primeiro dia de uso (criadoEm) ou do primeiro estudo, o que vier antes.
  E.alarme = (cfg, dias, hoje) => {
    const estudados = Object.keys(dias).filter(k => k < hoje && E.diaEstudado(dias[k])).sort();
    const inicio = [estudados[0], cfg.criadoEm].filter(Boolean).sort()[0];
    if (!inicio) return false;
    let falhas = 0, d = E.addDias(hoje, -1), olhados = 0;
    while (olhados < 2 && d >= inicio) {
      if (!E.diaDescanso(cfg, d) || E.diaEstudado(dias[d])) {
        if (E.diaEstudado(dias[d])) return false;
        falhas++; olhados++;
      }
      d = E.addDias(d, -1);
    }
    return falhas >= 2;
  };

  E.ultimaRedacao = dias => {
    const ks = Object.keys(dias).filter(k => ((dias[k].redacoes || []).length > 0)).sort();
    return ks.length ? ks[ks.length - 1] : null;
  };

  E.diaDeRedacao = (cfg, dias, hoje) => {
    if (E.diaSemana(hoje) !== 6) return false;
    if (((dias[hoje] || {}).redacoes || []).length) return true;
    const ultima = E.ultimaRedacao(Object.fromEntries(Object.entries(dias).filter(([k]) => k < hoje)));
    return !ultima || E.diffDias(ultima, hoje) >= (cfg.redacaoCadaDias || 14) - 1;
  };

  E.proximaRedacao = (cfg, dias, hoje) => {
    for (let i = 0; i < 60; i++) {
      const d = E.addDias(hoje, i);
      if (E.diaSemana(d) === 6 && !E.diaDescanso(cfg, d) && E.diaDeRedacao(cfg, i === 0 ? dias : Object.fromEntries(Object.entries(dias).filter(([k]) => k <= hoje)), d)) return d;
    }
    return null;
  };

  // Corta o dia pra caber em X minutos. Ordem do que fica: questões de ontem, revisão, teoria.
  E.encolher = (blocos, minutos) => {
    const ordem = blocos.map((b, i) => ({ b, i })).sort((x, y) => (E.TIPOS[x.b.tipo].prioridade - E.TIPOS[y.b.tipo].prioridade) || (x.i - y.i));
    let resto = minutos;
    const ficou = {};
    ordem.forEach(({ b, i }) => {
      if (resto <= 0) return;
      const m = Math.min(b.min, resto);
      if (m < 15 && Object.keys(ficou).length) return;
      ficou[i] = Object.assign({}, b, { min: m });
      resto -= m;
    });
    return blocos.map((b, i) => ficou[i]).filter(Boolean);
  };

  E.planoDoDia = (ctx, hoje) => {
    const { idx, cfg, dias } = ctx;
    const dia = dias[hoje] || {};
    const prog = E.progressoInicioDia(ctx, hoje);
    const g = E.gradeDoDia(cfg, hoje);
    const plano = { data: hoje, descanso: false, alarme: false, encolhido: null, redacao: false, blocos: [] };
    let blocos = (g && !g.descanso) ? g.blocos.map(b => Object.assign({}, b)) : [];
    if (!blocos.length) {
      plano.descanso = true;
      if (!dia.estudarNoDescanso) return plano;
      blocos = [{ tipo: 'questoes_ontem', min: 50 }, { tipo: 'teoria', min: 50 }, { tipo: 'revisao', min: 50 }];
    }
    if (E.diaDeRedacao(cfg, dias, hoje)) {
      const i = blocos.findIndex(b => b.tipo === 'questoes_mistas');
      if (i >= 0) { blocos[i] = { tipo: 'redacao', min: blocos[i].min }; plano.redacao = true; }
    }
    plano.alarme = E.alarme(cfg, dias, hoje);
    if (dia.encolhido) { plano.encolhido = dia.encolhido; blocos = E.encolher(blocos, dia.encolhido); }
    else if (plano.alarme && !dia.forcarCompleto) { plano.encolhido = 25; plano.minimaPorAlarme = true; blocos = E.encolher(blocos, 25); }

    const metaPor50 = cfg.metas.questoesPor50 || 20;
    const fila = E.filaTeoria(ctx, prog);
    let ponteiroFila = 0, sobraNoItem = fila.length ? fila[0].falta : 0;
    const revisoes = E.revisoesPendentes(ctx, prog, hoje);
    let ponteiroRev = 0;
    // revisões feitas hoje continuam aparecendo, marcadas como feitas
    const revisadasHoje = {};
    Object.keys(ctx.prog).forEach(id => {
      const h = ((ctx.prog[id].rev || {}).historico || []).filter(x => x.data === hoje);
      if (h.length) revisadasHoje[id] = true;
    });
    Object.keys(revisadasHoje).forEach(id => {
      if (!revisoes.some(r => r.assuntoId === id)) revisoes.unshift({ assuntoId: id, due: hoje, atraso: 0, acerto: E.acerto(prog[id]), extra: false });
    });

    let inicio = E.horaParaMin(g ? g.inicio : '08:30');
    blocos.forEach((b, bi) => {
      const bloco = { idx: bi, tipo: b.tipo, nome: E.TIPOS[b.tipo].nome, min: b.min, inicio: E.minParaHora(inicio), fim: E.minParaHora(inicio + b.min), itens: [], meta: 0, nota: '' };
      inicio += b.min + ((g && g.pausa) || 0);
      if (b.tipo === 'teoria') {
        let resto = b.min;
        while (resto > 0 && ponteiroFila < fila.length) {
          const f = fila[ponteiroFila];
          const m = Math.min(resto, sobraNoItem);
          bloco.itens.push({ assuntoId: f.assuntoId, min: m, falta: f.falta });
          resto -= m; sobraNoItem -= m;
          if (sobraNoItem <= 0) { ponteiroFila++; sobraNoItem = ponteiroFila < fila.length ? fila[ponteiroFila].falta : 0; }
        }
        if (!bloco.itens.length) bloco.nota = 'Edital inteiro visto. Use o bloco pra questões das matérias com pior acerto.';
      } else if (b.tipo === 'questoes_ontem') {
        bloco.meta = Math.round(metaPor50 * b.min / 50);
        const ultimo = E.ultimoDiaTeoria(dias, hoje);
        const pesos = {};
        if (ultimo) (dias[ultimo].sessoes || []).forEach(s => { if (s.tipo === 'teoria' && s.assuntoId) pesos[s.assuntoId] = (pesos[s.assuntoId] || 0) + s.min; });
        let ids = Object.keys(pesos);
        if (!ids.length) {
          ids = fila.slice(0, 1).map(f => f.assuntoId);
          ids.forEach(id => { pesos[id] = 1; });
          bloco.nota = ids.length ? 'Ainda não tem teoria anterior. Faça questões do assunto de hoje pra medir o que você já sabe.' : '';
        } else if (ultimo !== E.addDias(hoje, -1)) {
          bloco.nota = 'Teoria mais recente: ' + ultimo.split('-').reverse().slice(0, 2).join('/') + '.';
        }
        const total = soma(ids, id => pesos[id]) || 1;
        let distribuida = 0;
        ids.forEach((id, k) => {
          const meta = k === ids.length - 1 ? bloco.meta - distribuida : Math.round(bloco.meta * pesos[id] / total);
          distribuida += meta;
          bloco.itens.push({ assuntoId: id, meta, min: Math.round(b.min * pesos[id] / total) });
        });
      } else if (b.tipo === 'revisao') {
        let resto = b.min;
        while (ponteiroRev < revisoes.length && resto >= 5) {
          const r = revisoes[ponteiroRev];
          const a = idx.assuntos[r.assuntoId];
          if (!a) { ponteiroRev++; continue; }
          const m = Math.min(resto, E.minRevisao(a, cfg));
          bloco.itens.push({ assuntoId: r.assuntoId, min: m, atraso: r.atraso, extra: r.extra, feita: !!revisadasHoje[r.assuntoId] });
          resto -= m; ponteiroRev++;
        }
        const sobra = revisoes.length - ponteiroRev;
        if (sobra > 0) bloco.nota = sobra + (sobra === 1 ? ' revisão fica' : ' revisões ficam') + ' pra amanhã.';
        if (!bloco.itens.length) bloco.nota = 'Nenhuma revisão vencida. Use o tempo pra questões da matéria atual.';
      } else if (b.tipo === 'questoes_mistas') {
        bloco.meta = Math.round(metaPor50 * b.min / 50);
        bloco.itens = E.mixSabado(ctx, prog, hoje, bloco.meta, bi);
      } else if (b.tipo === 'revisao_semana') {
        const semana = E.assuntosDaSemana(ctx, prog, hoje);
        semana.slice(0, 6).forEach(id => bloco.itens.push({ assuntoId: id, min: Math.round(b.min / Math.min(6, semana.length)) }));
        if (!bloco.itens.length) bloco.nota = 'Sem estudo registrado nos últimos 7 dias. Revise as revisões vencidas.';
        else bloco.nota = 'Em ordem do pior acerto pro melhor.';
      } else if (b.tipo === 'redacao') {
        bloco.nota = 'Redação da quinzena. Escreva à mão, como na prova, e depois passe pro site.';
      }
      plano.blocos.push(bloco);
    });
    plano.revisoesVencidas = revisoes.filter(r => !revisadasHoje[r.assuntoId]).length;
    plano.minutos = soma(plano.blocos, b => b.min);
    return plano;
  };

  E.ultimoDiaTeoria = (dias, antesDe) => {
    let best = null;
    Object.keys(dias).forEach(k => {
      if (k < antesDe && (dias[k].sessoes || []).some(s => s.tipo === 'teoria' && s.assuntoId) && (!best || k > best)) best = k;
    });
    return best;
  };

  E.assuntosDaSemana = (ctx, prog, hoje) => {
    const ids = {};
    for (let i = 1; i <= 7; i++) {
      const d = ctx.dias[E.addDias(hoje, -i)];
      if (!d) continue;
      (d.sessoes || []).forEach(s => { if (s.assuntoId && ctx.idx.assuntos[s.assuntoId]) ids[s.assuntoId] = true; });
      (d.questoes || []).forEach(q => { if (q.assuntoId && ctx.idx.assuntos[q.assuntoId]) ids[q.assuntoId] = true; });
    }
    return Object.keys(ids).sort((a, b) => {
      const x = E.acerto(prog[a]), y = E.acerto(prog[b]);
      return (x == null ? 2 : x) - (y == null ? 2 : y);
    });

  // Andamento de cada bloco hoje, a partir do diário.

  E.andamentoBloco = (bloco, dia, unico) => {
    dia = dia || {};

    const sess = (dia.sessoes || []).filter(doBloco);
    const min = soma(sess, s => s.min);
    const qs = (dia.questoes || []).filter(doBloco);
    const feitas = soma(qs, q => q.feitas);
    const acertos = soma(qs, q => q.acertos);
    let pct = bloco.min ? min / bloco.min : 0;
    if (bloco.meta) pct = Math.max(pct, feitas / bloco.meta);

  // ------------------------------------------------------------- ofensiva

    if (!estudados.length) return r;

  E.pctProva = (idx, cfg, prog, concurso) => {

  };

  E.pctMateria = (m, cfg, prog, idx) => {

    ks.forEach(k => {

        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + ini);
        g.gain.exponentialRampToValueAtTime(0.2, t + ini + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + ini + dur);
        o.connect(g); g.connect(c.destination);
        o.start(t + ini); o.stop(t + ini + dur + 0.03);
      });
    } catch (e) { /* sem áudio */ }
  },
};

function Barra({ pct, cor, fina }) {

}

function Anel({ pct, tam, cor, txt, grossura }) {
  const t = tam || 76, g = grossura || 9, r = (t - g) / 2, c = 2 * Math.PI * r;
  const p = Math.max(0, Math.min(1, pct || 0));
  return html`<div class="anel" style=${`width:${t}px;height:${t}px`}>
    <svg viewBox=${`0 0 ${t} ${t}`}><circle cx=${t / 2} cy=${t / 2} r=${r} fill="none" stroke="var(--surface-3)" stroke-width=${g}/><circle cx=${t / 2} cy=${t / 2} r=${r} fill="none" stroke=${cor || 'var(--green)'} stroke-width=${g} stroke-linecap="round" stroke-dasharray=${c} stroke-dashoffset=${c * (1 - p)} style="transition:stroke-dashoffset .4s"/></svg>
    <div class="anel-txt">${txt}</div>
  </div>`;
}

function Stepper({ id, valor, set, min, max, passo }) {
  const p = passo || 1, mi = min == null ? 0 : min, ma = max == null ? 9999 : max;
  const lim = v => Math.max(mi, Math.min(ma, v));
  const [texto, setTexto] = useState(null); // null: mostra o valor salvo
  const confirmar = () => {
    if (texto === null) return;
    const v = parseInt(String(texto).replace(/\D/g, ''), 10);
    setTexto(null);
    set(lim(isNaN(v) ? (Number(valor) || mi) : v));
  };
  return html`<div class="stepper">
    <button type="button" aria-label="Diminuir" onClick=${() => { setTexto(null); set(lim((Number(valor) || 0) - p)); }}>−</button>
    <input id=${id} inputmode="numeric" value=${texto === null ? valor : texto}
      onInput=${e => setTexto(e.target.value.replace(/\D/g, '').slice(0, 4))}
      onBlur=${confirmar} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); confirmar(); } }}/>
    <button type="button" aria-label="Aumentar" onClick=${() => { setTexto(null); set(lim((Number(valor) || 0) + p)); }}>+</button>
  </div>`;
}

    </div>` : null}

    <div class="card">

function BlocoCard({ bloco, dia, unico }) {
  const e = App.estado;
  const ctx = App.ctx();
  const and = E.andamentoBloco(bloco, dia, unico);
  const [c, cd] = corDoTipo(bloco.tipo);
  const t = e.timer;
  const ativo = t && t.data === e.hoje && t.blocoTipo === bloco.tipo && (unico || t.blocoIdx === bloco.idx);
  const ehQuestao = bloco.tipo === 'questoes_ontem' || bloco.tipo === 'questoes_mistas';
  const doBloco = x => x.blocoTipo === bloco.tipo && (unico || x.blocoIdx === bloco.idx);
  const minHoje = id => (dia.sessoes || []).filter(s => s.assuntoId === id && doBloco(s)).reduce((s, x) => s + x.min, 0);
  const questoesHoje = id => (dia.questoes || []).filter(q => q.assuntoId === id && doBloco(q)).reduce((s, q) => s + q.feitas, 0);

  const itens = bloco.itens.map(it => {
    const a = IDX.assuntos[it.assuntoId];
    const p = ctx.prog[it.assuntoId];
    let sub = a ? IDX.materias[a.materia].nome : '';
    let dir = fmtMin(it.min);
    let feito = false;
    if (bloco.tipo === 'teoria') {
      const falta = Math.max(0, E.minNecessarios(a, e.cfg, p) - p.minTeoria);
      feito = p.teoriaConcluidaEm === e.hoje || minHoje(it.assuntoId) >= it.min;
      sub += feito ? ' · feito hoje' : ' · faltam ' + fmtMin(falta) + ' no assunto';
    } else if (ehQuestao) {
      const q = questoesHoje(it.assuntoId);
      dir = q + '/' + it.meta;
      feito = q >= it.meta;
      if (it.grupo === 'fechada') sub += ' · matéria fechada';
    } else if (bloco.tipo === 'revisao') {
      feito = it.feita;
      sub += it.extra ? ' · revisão extra por acerto baixo' : it.atraso > 0 ? ' · atrasada ' + plural(it.atraso, 'dia', 'dias') : ' · vence hoje';
    } else if (bloco.tipo === 'revisao_semana') {
      const ac = E.acerto(p);
      sub += ac == null ? ' · sem questões' : ' · acerto ' + fmtPct(ac);
    }
    return html`<div class="row" style="gap:8px">
      <button class=${'it grow' + (feito ? ' feito' : '')} onClick=${() => App.abrir({ tipo: 'assunto', id: it.assuntoId })}>
        <div><div class="it-t">${a ? a.titulo : 'Questões gerais'}</div><div class="it-s">${sub}</div></div>
        <div class="it-min tabular">${feito ? html`<span style="display:inline-block;width:20px;height:20px;vertical-align:-4px">${I.check()}</span>` : dir}</div>
      </button>
      ${bloco.tipo === 'revisao' && !it.feita ? html`<button class="btn fantasma peq" title="Marcar revisão feita" onClick=${() => Acoes.marcarRevisao(it.assuntoId, 0, bloco)}>Revisei</button>` : null}
    </div>`;
  });

  return html`<div class=${'card bloco' + (and.feito ? ' feito' : '')}>
    <div class="bloco-cab">
      <div class="bloco-ico" style=${`--c:${c};--cd:${cd}`}>${I[ICONE_TIPO[bloco.tipo]]()}</div>
      <div class="grow">
        <div class="bloco-hora tabular">${bloco.inicio} às ${bloco.fim} · ${fmtMin(bloco.min)}</div>
        <div class="bloco-nome">${bloco.nome}</div>
      </div>
      <div class="bold tabular" style=${`color:${and.feito ? 'var(--gold-ink)' : 'var(--muted)'}`}>${and.feito ? 'Feito' : Math.round(and.pct * 100) + '%'}</div>
    </div>
    ${bloco.meta ? html`<div class="nota">Meta: ${bloco.meta} questões${and.feitas ? ' · ' + and.feitas + ' feitas, ' + fmtPct(and.feitas ? and.acertos / and.feitas : null) + ' de acerto' : ''}</div>` : null}
    ${itens.length ? html`<div class="bloco-itens">${itens}</div>` : null}
    ${bloco.nota ? html`<div class="nota">${bloco.nota}</div>` : null}
    <${Barra} pct=${and.pct} cor=${and.feito ? 'var(--gold)' : c} fina/>
    <div class="bloco-acoes">
      ${bloco.tipo === 'redacao'
        ? html`<button class="btn laranja" onClick=${() => App.ir('redacao')}>${I.pena()} Abrir redação</button>`
        : html`<button class="btn" style=${`--c:${c};--cd:${cd}`} onClick=${() => (ativo ? App.set({ timerAberto: true }) : Cron.iniciarBloco(bloco))}>${I.play()} ${ativo ? 'Continuar' : and.min > 0 ? 'Retomar' : 'Começar'}</button>`}
      ${ehQuestao ? html`<button class="btn fantasma" onClick=${() => App.abrir({ tipo: 'lancar', bloco })}>Lançar questões</button>` : null}
      <button class="btn fantasma cinza peq" style="align-self:center" onClick=${() => App.abrir({ tipo: 'tempo', bloco })}>+ Tempo</button>
    </div>
  </div>`;
}

function EncolherFolha() {
  const [min, setMin] = useState(50);
  return html`<${Folha} titulo="Quanto tempo você tem hoje?" sub="O dia é remontado nesta ordem: questões de ontem, revisão, teoria nova." onFechar=${() => App.fechar()}>
    <div class="segmentado">${[25, 50, 75, 100, 125].map(v => html`<button class=${min === v ? 'on' : ''} onClick=${() => setMin(v)}>${fmtMin(v)}</button>`)}</div>
    <div class="campo"><label for="enc-min">Minutos</label><${Stepper} id="enc-min" valor=${min} set=${setMin} min=${15} max=${300} passo=${5}/></div>

}

      <div class="card-sub">${plural(of.bloqueios, 'bloqueio guardado', 'bloqueios guardados')} · ${of.bloqueios >= E.MAX_BLOQUEIOS ? 'máximo atingido' : 'próximo em ' + plural(of.proximoBloqueioEm || E.DIAS_POR_BLOQUEIO, 'dia estudado', 'dias estudados')}</div>
    </div>
    <div class="card">

const CORES_UNIDADE = [

const DESLOCAMENTO = [0, 42, 64, 42, 0, -42, -64, -42];

// ------------------------------------------------------------------ trilha

            <div class="upper">Unidade ${ui + 1}${mid === matAtual ? ' · atual' : ''}${fechada ? ' · fechada' : ''}</div>
            <h2>${m.nome}</h2>
            <div class="row-wrap" style="margin-top:6px">${m.concursos.map(c => html`<span class="tag" style="background:rgba(255,255,255,.25);color:#fff">${c}</span>`)}<span class="tiny bold" style="opacity:.9">${m.assuntos.length} assuntos · ${Math.round(pct * 100)}%</span></div>
          </div>
          ${!fechada && !est.aprovadoEm ? html`<button class="btn fantasma peq" onClick=${() => App.abrir({ tipo: 'simulado', alvo: { tipo: 'materia', id: mid } })}>${I.pular()} Pular</button>` : null}
          <${Barra} pct=${pct}/>
        </div>

          ${m.assuntos.map((a0, i) => {
            const a = IDX.assuntos[a0.id];

            return html`<div class="no-wrap" style=${`--x:${DESLOCAMENTO[i % DESLOCAMENTO.length]}px`}>
              ${atual ? html`<div class="no-balao">${p.minTeoria > 0 ? 'Continuar' : 'Começar'}</div>` : null}
              <button class=${cls} aria-label=${a.titulo} onClick=${() => App.abrir({ tipo: 'assunto', id: a.id })}>${ic()}</button>

    </div>

      <div class="rot">Material visto</div>

      ${sim.motivo !== 'bloqueado' ? html`<div><button class="btn roxo" disabled=${!sim.pode && !(p.simulado && p.simulado.emAndamento)} onClick=${() => App.abrir({ tipo: 'simulado', alvo: { tipo: 'assunto', id } })}>${I.pular()} ${p.simulado && p.simulado.emAndamento ? 'Continuar simulado' : 'Fazer mini simulado'}</button></div>` : null}

    <a class="btn-link" href=${linkQuestoes(a, e.cfg)} target="_blank" rel="noopener">Abrir questões deste assunto ${html`<span style="display:inline-block;width:14px;height:14px;vertical-align:-1px">${I.link()}</span>`}</a>
  <//>`;

function quandoLibera(ms) {
  const h = Math.ceil((ms - Date.now()) / 3600000);
  if (h <= 1) return 'em menos de 1 hora';
  return 'em ' + h + ' horas';
}

// ------------------------------------------------------------ lançar questões
function LinhaQuestoes({ titulo, sub, meta, valor, set, idBase }) {
  return html`<div class="card stack-sm" style="padding:14px">
    <div><div class="bold">${titulo}</div>${sub ? html`<div class="card-sub">${sub}${meta ? ' · meta ' + meta : ''}</div>` : null}</div>
    <div class="row-wrap" style="gap:14px">
      <div class="campo"><label for=${idBase + '-f'}>Feitas</label><${Stepper} id=${idBase + '-f'} valor=${valor.feitas} set=${v => set({ feitas: v, acertos: Math.min(valor.acertos, v) })} max=${500}/></div>
      <div class="campo"><label for=${idBase + '-a'}>Acertos</label><${Stepper} id=${idBase + '-a'} valor=${valor.acertos} set=${v => set({ feitas: Math.max(valor.feitas, v), acertos: v })} max=${500}/></div>
      <div class="bold tabular" style="align-self:end;padding-bottom:10px;color:var(--muted)">${valor.feitas ? fmtPct(valor.acertos / valor.feitas) : ''}</div>
    </div>
  </div>`;
}

function LancarFolha({ bloco, assuntoId, ctxTipo }) {
  const e = useApp();
  // cada linha tem id fixo: salvar de novo depois de uma falha não duplica
  const inicial = bloco ? bloco.itens.map(it => ({ id: Banco.novoId(), assuntoId: it.assuntoId, meta: it.meta, feitas: 0, acertos: 0 })) : [{ id: Banco.novoId(), assuntoId: assuntoId === undefined ? ultimoAssunto() : assuntoId, feitas: 0, acertos: 0, livre: true }];
  const [linhas, setLinhas] = useState(inicial);
  const [salvando, setSalvando] = useState(false);
  const [feitas, setFeitas] = useState({});
  const [erro, setErro] = useState('');
  const mudar = (i, v) => setLinhas(ls => ls.map((l, k) => (k === i ? Object.assign({}, l, v) : l)));
  const total = linhas.reduce((s, l) => s + (feitas[l.id] ? 0 : l.feitas), 0);
  const salvar = async () => {
    setSalvando(true); setErro('');
    const ok = Object.assign({}, feitas);
    try {
      for (const l of linhas) {
        if (l.feitas <= 0 || ok[l.id]) continue;
        await Acoes.lancarQuestoes({ id: l.id, assuntoId: l.assuntoId, feitas: l.feitas, acertos: l.acertos, ctxTipo: bloco ? 'bloco' : ctxTipo || 'livre', bloco: l.livre ? null : bloco });
        ok[l.id] = true; setFeitas(Object.assign({}, ok));
      }
      App.fechar();
    } catch (err) { setErro(Banco.mensagemErro(err)); }
    finally { setSalvando(false); }
  };
  return html`<${Folha} titulo="Lançar questões" sub=${bloco ? bloco.nome : ctxTipo === 'trabalho' ? 'Questões no trabalho' : 'Questões feitas fora da grade'} onFechar=${() => App.fechar()}>
    ${linhas.map((l, i) => l.livre
      ? html`<div class="stack-sm">
          <div class="campo"><label for=${'lq-assunto-' + i}>Assunto</label><${SeletorAssunto} id=${'lq-assunto-' + i} valor=${l.assuntoId} set=${v => mudar(i, { assuntoId: v })} permitirVazio=${true}/></div>
          <${LinhaQuestoes} idBase=${'lq' + i} titulo=${nomeAssunto(l.assuntoId)} sub=${nomeMateria(l.assuntoId)} valor=${l} set=${v => mudar(i, v)}/>
        </div>`
      : html`<${LinhaQuestoes} idBase=${'lq' + i} titulo=${nomeAssunto(l.assuntoId)} sub=${nomeMateria(l.assuntoId)} meta=${l.meta} valor=${l} set=${v => mudar(i, v)}/>`)}
    ${bloco ? html`<button class="btn-link" style="justify-self:start" onClick=${() => setLinhas(ls => ls.concat([{ id: Banco.novoId(), assuntoId: ultimoAssunto(), feitas: 0, acertos: 0, livre: true }]))}>+ Outro assunto</button>` : null}
    ${erro ? html`<div class="card alerta small">${erro} O que já foi salvo não será repetido.</div>` : null}
    <button class="btn bloco azul" disabled=${!total || salvando} onClick=${salvar}>${salvando ? 'Salvando...' : total ? 'Salvar ' + plural(total, 'questão', 'questões') : 'Informe as questões feitas'}</button>
  <//>`;
}

function ultimoAssunto() {
  const ctx = App.ctx();
  const ks = Object.keys(ctx.dias).sort().reverse();
  for (const k of ks) {
    const s = (ctx.dias[k].sessoes || []).slice().reverse().find(x => x.assuntoId);
    if (s) return s.assuntoId;
  }
  const f = E.filaTeoria(ctx, ctx.prog);
  return f.length ? f[0].assuntoId : null;
}

// ------------------------------------------------------------ tempo manual
function TempoFolha({ bloco }) {
  const [assuntoId, setAssunto] = useState(bloco && bloco.itens.length ? bloco.itens[0].assuntoId : ultimoAssunto());
  const [min, setMin] = useState(bloco ? Math.min(bloco.min, 50) : 25);
  const [id] = useState(() => Banco.novoId());
  const [erro, setErro] = useState('');
  const [salvando, setSalvando] = useState(false);
  const tipoSessao = bloco ? Cron.tipoSessao(bloco.tipo) : 'teoria';
  return html`<${Folha} titulo="Registrar tempo" sub="Pra quando você estudou sem o cronômetro." onFechar=${() => App.fechar()}>
    <div class="campo"><label for="tm-assunto">Assunto</label><${SeletorAssunto} id="tm-assunto" valor=${assuntoId} set=${setAssunto} permitirVazio=${true}/></div>
    <div class="campo"><label for="tm-min">Minutos</label><${Stepper} id="tm-min" valor=${min} set=${setMin} min=${1} max=${300} passo=${5}/></div>
    ${erro ? html`<div class="card alerta small">${erro}</div>` : null}
    <button class="btn bloco" disabled=${!min || salvando} onClick=${async () => {
      setSalvando(true); setErro('');
      try {
        await Acoes.registrarSessoes([{ id, tipo: tipoSessao, assuntoId, min, blocoIdx: bloco ? bloco.idx : null, blocoTipo: bloco ? bloco.tipo : 'livre' }]);
        App.fechar();
        App.toast(fmtMin(min) + ' registrados.', 'ok');
      } catch (err) { setErro(Banco.mensagemErro(err)); } finally { setSalvando(false); }
    }}>Registrar ${fmtMin(min)}</button>
  <//>`;
}

// ------------------------------------------------------------ cronômetro
// Guarda os trechos em que o relógio rodou (segs), pra dividir o tempo quando passa da meia-noite.
const Cron = {
  KEY: 'rf:cron:v1',
  carregar() { try { const t = JSON.parse(localStorage.getItem(this.KEY) || 'null'); if (t) App.set({ timer: t }); } catch (e) { /* ok */ } },
  gravar(t) { try { if (t) localStorage.setItem(this.KEY, JSON.stringify(t)); else localStorage.removeItem(this.KEY); } catch (e) { /* ok */ } App.set({ timer: t }); },
  dec(t, agora) { return t.acumMs + (t.rodando ? (agora || Date.now()) - t.desde : 0); },
  tipoSessao(tipoBloco) { return { teoria: 'teoria', questoes_ontem: 'questoes', questoes_mistas: 'questoes', revisao: 'revisao', revisao_semana: 'revisao', redacao: 'redacao', livre: 'teoria' }[tipoBloco] || 'teoria'; },
  novo(dados) {
    const atual = App.estado.timer;
    // o relógio só começa quando você confirma
    const vai = () => {
      const agora = Date.now();
      this.gravar(Object.assign({ data: App.estado.hoje, itemIdx: 0, itemIni: 0, porItem: {}, acumMs: 0, desde: agora, segs: [[agora, null]], trocas: [[0, 0]], rodando: true, avisou: false }, dados));
      App.set({ timerAberto: true, modal: null });
      Som.tocar('clique');
    };
    if (atual && atual.modo !== 'pausa' && this.dec(atual) > 60000) {
      App.abrir({ tipo: 'confirmar', titulo: 'Já tem um cronômetro ligado', texto: 'Encerre o atual pra registrar o tempo dele, ou descarte e comece o novo.', ok: 'Descartar e começar', acao: vai, outro: 'Voltar ao atual', outroAcao: () => { App.fechar(); App.set({ timerAberto: true }); } });
      return;
    }
    vai();
  },
  iniciarBloco(bloco) {
    const n = Math.max(1, bloco.itens.length);
    const itens = bloco.itens.map(i => ({ assuntoId: i.assuntoId, min: i.min || Math.round(bloco.min / n), meta: i.meta || 0 }));
    this.novo({ modo: 'bloco', blocoIdx: bloco.idx, blocoTipo: bloco.tipo, nome: bloco.nome, alvoMin: bloco.min, itens, bloco: { idx: bloco.idx, tipo: bloco.tipo, nome: bloco.nome, min: bloco.min, itens: bloco.itens } });
  },
  iniciarLivre({ tipo, assuntoId }) {
    this.novo({ modo: 'livre', blocoIdx: null, blocoTipo: 'livre', tipoSessao: tipo || 'teoria', nome: 'Estudo livre', alvoMin: 0, itens: assuntoId ? [{ assuntoId, min: 0 }] : [] });
  },
  iniciarPausa(min, proximo) {
    const agora = Date.now();
    this.gravar({ modo: 'pausa', nome: 'Pausa', alvoMin: min, itens: [], itemIdx: 0, itemIni: 0, porItem: {}, acumMs: 0, desde: agora, segs: [[agora, null]], rodando: true, avisou: false, proximo: proximo || null, data: App.estado.hoje });
    App.set({ timerAberto: true, modal: null });
  },
  pausar() {
    const t = App.estado.timer;
    if (!t || !t.rodando) return;
    const agora = Date.now();
    const segs = (t.segs || []).map(s => (s[1] == null ? [s[0], agora] : s));
    this.gravar(Object.assign({}, t, { acumMs: this.dec(t, agora), rodando: false, segs }));
  },
  retomar() {
    const t = App.estado.timer;
    if (!t || t.rodando) return;
    const agora = Date.now();
    // voltou a estudar depois de um salvamento pela metade: o tempo será salvo de novo, nas mesmas chaves
    const fechamento = t.fechamento ? Object.assign({}, t.fechamento, { feito: Object.assign({}, t.fechamento.feito, { sessoes: false }) }) : undefined;
    this.gravar(Object.assign({}, t, { desde: agora, rodando: true, segs: (t.segs || []).concat([[agora, null]]), fechamento }));
  },
  porItem(t) {
    const d = this.dec(t);
    const por = Object.assign({}, t.porItem);
    por[t.itemIdx] = (por[t.itemIdx] || 0) + (d - t.itemIni);
    return por;
  },
  // Milissegundos rodados em cada data local.
  porData(t) {
    if (!t.segs || !t.segs.length) return { [t.data]: this.dec(t) };
    const out = {};
    t.segs.forEach(([ini, fim]) => {
      let a = ini;
      const b = fim == null ? (t.rodando ? Date.now() : a) : fim;
      while (a < b) {
        const d = new Date(a);
        const corte = Math.min(b, new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime());
        const k = E.dataLocal(d);
        out[k] = (out[k] || 0) + (corte - a);
        a = corte;
      }
    });
    return Object.keys(out).length ? out : { [t.data]: 0 };
  },
  irItem(i) {
    const t = App.estado.timer;
    if (!t || i === t.itemIdx) return;
    const d = this.dec(t);
    this.gravar(Object.assign({}, t, { porItem: this.porItem(t), itemIni: d, itemIdx: i, trocas: (t.trocas || [[0, 0]]).concat([[d, i]]) }));
  },
  // Milissegundos de cada assunto em cada data: cruza as trocas de assunto (tempo corrido) com os trechos de relógio.
  porItemData(t) {
    const total = this.dec(t);
    if (!t.segs || !t.segs.length || !t.trocas) {
      const por = this.porItem(t), out = {};
      Object.keys(por).forEach(i => { out[i] = { [t.data]: por[i] }; });
      return out;
    }
    const faixas = t.trocas.map(([ini, idx], k) => [ini, k + 1 < t.trocas.length ? t.trocas[k + 1][0] : total, idx]);
    const out = {};
    let base = 0;
    t.segs.forEach(([a, b0]) => {
      const b = b0 == null ? (t.rodando ? Date.now() : a) : b0;
      const dur = Math.max(0, b - a);
      faixas.forEach(([fi, ff, idx]) => {
        const ini = Math.max(fi, base), fim = Math.min(ff, base + dur);
        let x = a + (ini - base);
        const y = a + (fim - base);
        while (x < y) {
          const dt = new Date(x);
          const corte = Math.min(y, new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + 1).getTime());
          const k = E.dataLocal(dt);
          const m = out[idx] || (out[idx] = {});
          m[k] = (m[k] || 0) + (corte - x);
          x = corte;
        }
      });
      base += dur;
    });
    return out;
  },
  encerrar() {
    const t = App.estado.timer;
    if (!t) return;
    if (t.modo === 'pausa') { this.gravar(null); App.set({ timerAberto: false }); return; }
    this.pausar();
    const p = App.estado.timer;
    // ids e etapas do salvamento ficam no cronômetro: fechar e reabrir a tela não duplica nada
    if (!p.fechamento) {
      const n = Math.max(1, p.itens.length);
      this.gravar(Object.assign({}, p, { fechamento: { sess: Array.from({ length: n }, () => Banco.novoId()), q: Array.from({ length: n }, () => Banco.novoId()), feito: {} } }));
    }
    App.set({ timerAberto: false });
    App.abrir({ tipo: 'encerrar' });
  },
};

function CronTela() {
  const e = useApp();
  const t = e.timer;
  useTique(!!t && t.rodando, 500);
  useEffect(() => {
    if (t && t.alvoMin && !t.avisou && Cron.dec(t) >= t.alvoMin * 60000) {
      Som.tocar(t.modo === 'pausa' ? 'pausa' : 'fim');
      Cron.gravar(Object.assign({}, t, { avisou: true }));
    }
  });
  if (!t || !e.timerAberto) return null;
  const d = Cron.dec(t);
  const alvo = (t.alvoMin || 0) * 60000;
  const resto = alvo - d;
  const pct = alvo ? Math.min(1, d / alvo) : (d % 3600000) / 3600000;
  const tam = 300, g = 18, r = (tam - g) / 2, circ = 2 * Math.PI * r;
  const cor = t.modo === 'pausa' ? 'var(--blue)' : resto < 0 ? 'var(--orange)' : t.blocoTipo ? corDoTipo(t.blocoTipo === 'livre' ? 'teoria' : t.blocoTipo)[0] : 'var(--green)';
  const por = Cron.porItem(t);
  const it = t.itens[t.itemIdx];
  return html`<div class="cron" role="dialog" aria-label="Cronômetro">
    <div class="cron-cab">
      <button class="btn-ico" aria-label="Minimizar" onClick=${() => App.set({ timerAberto: false })}>${I.baixo()}</button>
      <div class="center"><div class="upper muted">${t.modo === 'pausa' ? 'Pausa' : t.nome}</div>${it ? html`<div class="bold">${nomeAssunto(it.assuntoId)}</div>` : null}</div>
      <span style="width:34px"></span>
    </div>
    <div class="cron-meio">
      <div class="cron-anel">
        <svg viewBox=${`0 0 ${tam} ${tam}`}><circle cx=${tam / 2} cy=${tam / 2} r=${r} fill="none" stroke="var(--surface-3)" stroke-width=${g}/><circle cx=${tam / 2} cy=${tam / 2} r=${r} fill="none" stroke=${cor} stroke-width=${g} stroke-linecap="round" stroke-dasharray=${circ} stroke-dashoffset=${circ * (1 - pct)}/></svg>
        <div class=${'cron-num' + (alvo && resto < 0 ? ' extra' : '')}>
          <b>${alvo ? fmtRelogio(resto) : fmtRelogio(d)}</b>
          <span>${!t.rodando ? 'pausado' : t.modo === 'pausa' ? (resto > 0 ? 'de pausa' : 'pausa acabou') : alvo ? (resto >= 0 ? 'restantes' : 'passou do tempo') : 'estudando'}</span>
        </div>
      </div>
      ${t.modo === 'pausa' && resto <= 0 ? html`<p class="bold">Hora de voltar. Levanta, água, e senta de novo.</p>` : null}
      ${alvo && resto < 0 && t.modo !== 'pausa' ? html`<p class="bold" style="color:var(--orange-ink)">Tempo do bloco acabou. Encerre pra registrar ou continue se estiver rendendo.</p>` : null}
      ${t.itens.length > 1 ? html`<div class="cron-itens">${t.itens.map((x, i) => {
        const gasto = por[i] || 0;
        return html`<button class=${'it' + (i === t.itemIdx ? ' feito' : '')} onClick=${() => Cron.irItem(i)}>
          <div><div class="it-t">${nomeAssunto(x.assuntoId)}</div><div class="it-s">${i === t.itemIdx ? 'agora' : 'toque pra trocar'}${x.meta ? ' · meta ' + x.meta + ' questões' : ''}</div></div>
          <div class="it-min tabular">${Math.floor(gasto / 60000)}/${x.min} min</div>
        </button>`;
      })}</div>` : null}
    </div>
    <div class="cron-rodape">
      ${t.modo === 'pausa'
        ? html`${t.proximo ? html`<button class="btn" onClick=${() => { const b = t.proximo; Cron.gravar(null); Cron.iniciarBloco(b); }}>${I.play()} Próximo bloco</button>` : null}
               <button class="btn fantasma" onClick=${() => Cron.encerrar()}>${resto > 0 ? 'Pular pausa' : 'Fechar'}</button>`
        : html`${t.rodando ? html`<button class="btn fantasma" onClick=${() => Cron.pausar()}>${I.pausa()} Pausar</button>` : html`<button class="btn" onClick=${() => Cron.retomar()}>${I.play()} Retomar</button>`}
               ${t.itens.length > 1 && t.itemIdx < t.itens.length - 1 ? html`<button class="btn azul" onClick=${() => Cron.irItem(t.itemIdx + 1)}>Próximo assunto</button>` : null}
               <button class="btn laranja" onClick=${() => Cron.encerrar()}>${I.check()} Encerrar</button>`}
    </div>
  </div>`;
}

function PilulaCron() {
  const e = useApp();
  const t = e.timer;
  useTique(!!t && t.rodando && !e.timerAberto, 1000);
  if (!t || e.timerAberto) return null;
  const d = Cron.dec(t), alvo = (t.alvoMin || 0) * 60000;
  const [c, cd] = t.modo === 'pausa' ? ['var(--blue)', 'var(--blue-d)'] : alvo && d > alvo ? ['var(--orange)', 'var(--orange-d)'] : corDoTipo(t.blocoTipo === 'livre' || !t.blocoTipo ? 'teoria' : t.blocoTipo);
  return html`<button class="pilula-cron" style=${`--c:${c};--cd:${cd}`} onClick=${() => App.set({ timerAberto: true })}>
    ${t.rodando ? I.cronometro() : I.pausa()} ${alvo ? fmtRelogio(alvo - d) : fmtRelogio(d)} · ${t.modo === 'pausa' ? 'Pausa' : E.TIPOS[t.blocoTipo] ? E.TIPOS[t.blocoTipo].curto : 'Estudo'}
  </button>`;
}

// Fechamento do cronômetro: confere minutos, lança questões, marca revisões.
// O cronômetro só some depois que tudo foi salvo. Etapa já gravada não é repetida numa nova tentativa.
function EncerrarFolha() {
  const e = useApp();
  const t = e.timer;
  const por = t ? Cron.porItem(t) : {};
  const itens = t ? (t.itens.length ? t.itens : [{ assuntoId: null, min: 0 }]) : [];
  const [mins, setMins] = useState(() => itens.map((x, i) => Math.round((t && t.itens.length ? por[i] || 0 : t ? Cron.dec(t) : 0) / 60000)));
  const [tipoLivre, setTipoLivre] = useState(t && t.tipoSessao ? t.tipoSessao : 'teoria');
  const [assuntoLivre, setAssuntoLivre] = useState(itens[0] ? itens[0].assuntoId : null);
  const [qs, setQs] = useState(() => itens.map(() => ({ feitas: 0, acertos: 0 })));
  const [revs, setRevs] = useState(() => itens.map((x, i) => (por[i] || 0) >= 3 * 60000));
  const fech = (t && t.fechamento) || { sess: itens.map(() => Banco.novoId()), q: itens.map(() => Banco.novoId()), feito: {} };
  const ids = fech;
  const feito = fech.feito || {};
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState('');
  if (!t) return null;
  const livre = t.modo === 'livre';
  const tipoEf = livre ? tipoLivre : Cron.tipoSessao(t.blocoTipo);
  const ehQuestao = tipoEf === 'questoes';
  const ehRevisao = livre ? tipoLivre === 'revisao' : t.blocoTipo === 'revisao';
  const ehTeoria = tipoEf === 'teoria';
  const assuntoDe = i => (livre ? assuntoLivre : itens[i].assuntoId);
  const totalMin = mins.reduce((s, x) => s + (x || 0), 0);
  const longo = t.alvoMin ? totalMin > t.alvoMin * 2 + 20 : totalMin > 240;
  const proximo = () => {
    if (t.modo !== 'bloco') return null;
    const plano = E.planoDoDia(App.ctx(), App.estado.hoje);
    const i = plano.blocos.findIndex(b => b.idx === t.blocoIdx && b.tipo === t.blocoTipo);
    return i >= 0 && i < plano.blocos.length - 1 ? plano.blocos[i + 1] : null;
  };
  const pausaDoDia = () => { const g = E.gradeDoDia(App.estado.cfg, App.estado.hoje); return g && Number.isFinite(g.pausa) ? g.pausa : 10; };
  const prox = proximo();
  const pausa = pausaDoDia();
  const salvar = async depois => {
    setSalvando(true); setErro('');
    const ok = Object.assign({}, feito);
    const marcar = k => {
      ok[k] = true;
      const atual = App.estado.timer;
      if (atual) Cron.gravar(Object.assign({}, atual, { fechamento: Object.assign({}, atual.fechamento || fech, { feito: Object.assign({}, ok) }) }));
    };
    try {
      if (!ok.sessoes) {
        // cada assunto vai pro dia em que foi estudado de fato (passar da meia-noite conta pro dia seguinte)
        const geral = Cron.porData(t);
        const porItemData = Cron.porItemData(t);
        const porDia = {};
        itens.forEach((x, i) => {
          const m = mins[i] || 0;
          if (m < 1) return;
          const datas = porItemData[i] && Object.keys(porItemData[i]).length ? porItemData[i] : geral;
          const ks = Object.keys(datas).sort();
          const totalMs = ks.reduce((s, d) => s + datas[d], 0) || 1;
          let resto = m;
          ks.forEach((d, j) => {
            const md = j === ks.length - 1 ? resto : Math.round(m * datas[d] / totalMs);
            resto -= md;
            if (md >= 1) (porDia[d] = porDia[d] || []).push({ id: ids.sess[i] + '-' + d, tipo: tipoEf, assuntoId: assuntoDe(i), min: md, blocoIdx: t.blocoIdx, blocoTipo: t.blocoTipo });
          });
        });
        for (const d of Object.keys(porDia).sort()) await Acoes.registrarSessoes(porDia[d], d);
        marcar('sessoes');
      }
      if (ehQuestao) for (let i = 0; i < itens.length; i++) {
        if (ok['q' + i] || !(qs[i].feitas > 0)) continue;
        await Acoes.lancarQuestoes({ id: ids.q[i], assuntoId: assuntoDe(i), feitas: qs[i].feitas, acertos: qs[i].acertos, ctxTipo: livre ? 'livre' : 'bloco', bloco: livre ? null : t.bloco });
        marcar('q' + i);
      }
      if (ehRevisao) for (let i = 0; i < itens.length; i++) {
        const a = assuntoDe(i);
        if (ok['r' + i] || !revs[i] || !a) continue;
        await Acoes.marcarRevisao(a, 0, livre ? null : t.bloco);
        marcar('r' + i);
      }
      Cron.gravar(null);
      App.fechar();
      if (totalMin) App.toast(fmtMin(totalMin) + ' registrados.', 'ok');
      if (depois === 'seguir' && prox) { if (pausa > 0) Cron.iniciarPausa(pausa, prox); else Cron.iniciarBloco(prox); }
    } catch (err) { setErro(Banco.mensagemErro(err)); }
    finally { setSalvando(false); }
  };
  return html`<${Folha} titulo=${livre ? 'Encerrar estudo' : 'Encerrar ' + t.nome.toLowerCase()} sub="Confira antes de salvar." onFechar=${() => { App.fechar(); App.set({ timerAberto: true }); }}>
    ${livre ? html`<div class="campo"><label>Tipo de estudo</label><div class="segmentado">${[['teoria', 'Teoria'], ['questoes', 'Questões'], ['revisao', 'Revisão']].map(([k, n]) => html`<button class=${tipoLivre === k ? 'on' : ''} disabled=${feito.sessoes} onClick=${() => setTipoLivre(k)}>${n}</button>`)}</div></div>
      <div class="campo"><label for="enc-assunto">Assunto</label><${SeletorAssunto} id="enc-assunto" valor=${assuntoLivre} set=${setAssuntoLivre} permitirVazio=${true}/></div>` : null}
    ${longo ? html`<div class="card aviso small">O cronômetro parece ter ficado ligado mais que o normal. Ajuste os minutos antes de salvar.</div>` : null}
    ${itens.map((x, i) => html`<div class="card stack-sm" style="padding:14px">
      ${!livre ? html`<div><div class="bold">${nomeAssunto(x.assuntoId)}</div><div class="card-sub">${nomeMateria(x.assuntoId)}${x.min ? ' · sugerido ' + fmtMin(x.min) : ''}</div></div>` : null}
      <div class="row-wrap" style="gap:14px">

/* ==== telas-simulado.js ==== */
/* Rumo à Farda: mini simulado pra pular assunto ou matéria.
   A entrega é feita em etapas que podem ser repetidas sem efeito dobrado:
   1) o simulado vira "entregue" com a nota; 2) o diário ganha o registro com o id do simulado;
   3) os assuntos são pulados; 4) o alvo guarda a tentativa (pelo id) e larga o "em andamento".
   Se algo cair no meio, a carga seguinte refaz o que faltou. */

const LETRAS = 'ABCDE';

const Simulado = {
  estadoAlvo(alvo) {
    const doc = alvo.tipo === 'assunto' ? App.estado.assuntosDocs[alvo.id] : App.estado.materiasDocs[alvo.id];
    const s = Object.assign({}, (doc || {}).simulado || {});
    const ids = Object.assign({}, s.tentativasIds && typeof s.tentativasIds === 'object' ? s.tentativasIds : {});
    // versão antiga guardava só um número
    if (!s.tentativasIds && Number(s.tentativas) > 0) for (let i = 0; i < Number(s.tentativas); i++) ids['antiga' + i] = true;
    s.tentativasIds = ids;
    s.tentativas = Object.keys(ids).length;
    return s;
  },
  salvarEstadoAlvo(alvo, parcial) {
    return alvo.tipo === 'assunto' ? Acoes._assunto(alvo.id, { simulado: parcial }) : Acoes._materia(alvo.id, { simulado: parcial });
  },
  titulo(alvo) { return alvo.tipo === 'assunto' ? IDX.assuntos[alvo.id].titulo : IDX.materias[alvo.id].nome; },
  // Assunto obrigatório (3 reprovações) não entra no atalho da matéria.
  assuntosDo(alvo) {
    const ctx = App.ctx();
    const lista = alvo.tipo === 'assunto'
      ? [IDX.assuntos[alvo.id]]
      : IDX.materias[alvo.id].assuntos.map(a => IDX.assuntos[a.id]).filter(a => !E.CONCLUIDO(ctx.prog[a.id].status) && !ctx.prog[a.id].obrigatorio);
    return lista.map(a => ({
      id: a.id, titulo: a.titulo, blocos: E.blocosDe(a, App.estado.cfg), foco: a.foco,
      itensTexto: a.itens.map(i => IDX.itens[i]).filter(Boolean).map(it => it.texto + ' (' + it.fonte + ')'),
    }));
  },
  async usadas(alvo) {
    try {
      const docs = await Banco.lerColecao('simulados', 'alvoId', alvo.id);
      return Object.values(docs).flatMap(d => (d.questoes || []).map(q => String(q.enunciado).slice(0, 160)));
    } catch (e) { return []; }
  },
  ativo(token) { const q = App.estado.quiz; return q && q.token === token ? q : null; },
  atualizar(token, parcial) { const q = this.ativo(token); if (q) App.set({ quiz: Object.assign({}, q, parcial) }); },

  async gerar(alvo) {
    const est = this.estadoAlvo(alvo);
    if (est.emAndamento) return this.continuar(alvo, est.emAndamento);
    const sit = E.situacaoSimulado(est, Date.now());
    if (!sit.pode || !AI.disponivel()) return;
    const ctl = new AbortController();
    const token = Banco.novoId();
    App.set({ quiz: { fase: 'gerando', alvo, feitas: 0, ctl, token }, modal: null });
    try {
      const assuntos = this.assuntosDo(alvo);
      if (!assuntos.length) throw { code: 'incompleto', message: 'nenhum assunto disponível' };
      const usadas = await this.usadas(alvo);
      const tentativa = est.tentativas + 1;
      const questoes = await AI.gerarSimulado({
        assuntos, usadas, nonce: alvo.id + '-t' + tentativa + '-' + Date.now().toString(36), signal: ctl.signal,
        onProgresso: n => { const q = this.ativo(token); if (q && q.fase === 'gerando') this.atualizar(token, { feitas: n }); },
      });
      const id = Banco.novoId();
      const doc = { alvoTipo: alvo.tipo, alvoId: alvo.id, criadoEm: new Date().toISOString(), data: App.estado.hoje, tentativa, questoes, respostas: questoes.map(() => null), anuladas: questoes.map(() => false), recursos: [], status: 'em_andamento' };
      await Banco.gravar('simulados/' + id, () => doc);
      await this.salvarEstadoAlvo(alvo, { emAndamento: id });
      // fechou enquanto gerava: o simulado fica esperando, sem gastar chance
      if (this.ativo(token)) App.set({ quiz: { fase: 'respondendo', alvo, id, doc, atual: 0, inicio: Date.now(), token } });
    } catch (e) {
      const msg = e && e.code === 'incompleto' ? AI.mensagem(e) : AI.mensagem(e) || '';
      if (this.ativo(token)) App.set({ quiz: msg ? { fase: 'erro', alvo, msg, token } : null });
    }
  },

  async continuar(alvo, id) {
    const token = Banco.novoId();
    App.set({ quiz: { fase: 'carregando', alvo, token }, modal: null });
    let doc;
    try { doc = await Banco.lerDoc('simulados/' + id); }
    catch (e) {
      // leitura falhou: não é o mesmo que não existir. A chance continua guardada.
      if (this.ativo(token)) App.set({ quiz: { fase: 'erro', alvo, token, msg: 'Não deu pra abrir o simulado agora. Nada foi perdido. Tente de novo.', repetir: id } });
      return;
    }
    if (!doc) {
      await this.salvarEstadoAlvo(alvo, { emAndamento: null }).catch(() => {});
      if (this.ativo(token)) App.set({ quiz: { fase: 'erro', alvo, token, msg: 'Não achei o simulado em andamento. Gere um novo; nenhuma chance foi gasta.' } });
      return;
    }
    if (doc.status === 'entregue') {
      try { await this.reconciliar(alvo, id, doc); } catch (e) { /* fica pra próxima carga */ }
      if (this.ativo(token)) App.set({ quiz: { fase: 'resultado', alvo, id, doc, token, pulados: [] } });
      return;
    }
    let respostas = Array.isArray(doc.respostas) ? doc.respostas : doc.questoes.map(() => null);
    try { const r = JSON.parse(localStorage.getItem('rf:sim:' + id) || 'null'); if (Array.isArray(r) && r.length === doc.questoes.length) respostas = r; } catch (e) { /* ok */ }
    if (this.ativo(token)) App.set({ quiz: { fase: 'respondendo', alvo, id, doc: Object.assign({}, doc, { respostas }), atual: 0, inicio: Date.now(), token } });
  },

  responder(i, alt) {
    const q = App.estado.quiz;
    if (!q || q.fase !== 'respondendo' || q.entregando) return;
    const respostas = q.doc.respostas.slice();
    respostas[i] = respostas[i] === alt ? null : alt;
    try { localStorage.setItem('rf:sim:' + q.id, JSON.stringify(respostas)); } catch (e) { /* ok */ }
    App.set({ quiz: Object.assign({}, q, { doc: Object.assign({}, q.doc, { respostas }) }) });
    // guarda o rascunho no banco também, pra continuar em outro aparelho
    clearTimeout(this._tResp);
    const id = q.id;
    this._tResp = setTimeout(() => { Banco.mesclar('simulados/' + id, { respostas }).catch(() => {}); }, 1500);
  },
  ir(i) { const q = App.estado.quiz; if (q && q.doc) App.set({ quiz: Object.assign({}, q, { atual: Math.max(0, Math.min(q.doc.questoes.length - 1, i)), confirmar: false }) }); },

  async entregar() {
    const q = App.estado.quiz;
    if (!q || q.fase !== 'respondendo' || q.entregando) return;
    const token = q.token;
    this.atualizar(token, { entregando: true, erroEntrega: '' });
    clearTimeout(this._tResp);
    try {
      // outro aparelho pode ter entregado antes: aí vale aquela entrega
      let noBanco = null;
      try { noBanco = await Banco.lerDoc('simulados/' + q.id); } catch (e) { noBanco = null; }
      let final;
      if (noBanco && noBanco.status === 'entregue') final = noBanco;
      else {
        const res = E.corrigirSimulado(q.doc.questoes, q.doc.respostas, q.doc.anuladas);
        final = Object.assign({}, q.doc, {
          status: 'entregue', entregueEm: new Date().toISOString(), diaEntrega: App.estado.hoje,
          duracaoMin: Math.max(1, Math.round((Date.now() - q.inicio) / 60000)), acertos: res.acertos, aprovado: res.aprovado,
        });
        await Banco.gravar('simulados/' + q.id, () => final);
      }
      try { localStorage.removeItem('rf:sim:' + q.id); } catch (e) { /* ok */ }
      const pulados = await this.reconciliar(q.alvo, q.id, final);
      Som.tocar(final.aprovado ? 'conquista' : 'erro');
      if (this.ativo(token)) App.set({ quiz: { fase: 'resultado', alvo: q.alvo, id: q.id, doc: final, pulados, aberta: null, token } });
      Acoes.checarConquistas();
    } catch (e) {
      this.atualizar(token, { entregando: false, erroEntrega: Banco.mensagemErro(e) + ' Suas respostas continuam aqui.' });
    }
  },

  // Etapas 2 a 4 da entrega. Pode rodar de novo quantas vezes for preciso.
  async reconciliar(alvo, id, doc) {
    const res = E.corrigirSimulado(doc.questoes, doc.respostas, doc.anuladas);
    const est = this.estadoAlvo(alvo);
    const ids = Object.assign({}, est.tentativasIds, { [id]: true });
    const tentativas = Object.keys(ids).length;
    const aprovado = res.aprovado || !!est.aprovadoEm;
    const bloqueado = !aprovado && tentativas >= E.CHANCES_SIMULADO;
    const dia = doc.diaEntrega || doc.data || App.estado.hoje;
    await Acoes.registrarSimuladoNoDia(dia, { id, alvoTipo: alvo.tipo, alvoId: alvo.id, acertos: res.acertos, total: res.total, aprovado: res.aprovado, tentativa: doc.tentativa || tentativas }, doc.duracaoMin || 0);
    const pulados = res.aprovado ? await this.aplicarPulo(alvo, res) : [];
    const parcial = { tentativasIds: ids, ultimaEm: doc.entregueEm || new Date().toISOString(), bloqueado };
    if (est.emAndamento === id) parcial.emAndamento = null;
    if (res.aprovado && !est.aprovadoEm) parcial.aprovadoEm = dia;
    await this.salvarEstadoAlvo(alvo, parcial);
    if (alvo.tipo === 'assunto' && bloqueado) await Acoes._assunto(alvo.id, { obrigatorio: true });
    return pulados;
  },

  // Na carga: simulado entregue com etapas faltando é terminado agora.
  async reconciliarPendentes() {
    const pendentes = [];
    Object.keys(App.estado.assuntosDocs).forEach(id => { const s = (App.estado.assuntosDocs[id] || {}).simulado; if (s && s.emAndamento) pendentes.push({ alvo: { tipo: 'assunto', id }, sim: s.emAndamento }); });
    Object.keys(App.estado.materiasDocs).forEach(id => { const s = (App.estado.materiasDocs[id] || {}).simulado; if (s && s.emAndamento) pendentes.push({ alvo: { tipo: 'materia', id }, sim: s.emAndamento }); });
    for (const p of pendentes) {
      if (p.alvo.tipo === 'assunto' ? !IDX.assuntos[p.alvo.id] : !IDX.materias[p.alvo.id]) continue;
      try {
        const doc = await Banco.lerDoc('simulados/' + p.sim);
        if (doc && doc.status === 'entregue') await this.reconciliar(p.alvo, p.sim, doc);
      } catch (e) { /* tenta na próxima carga */ }
    }
  },

  // Pula o que passou. Não mexe em assunto já concluído; no atalho da matéria, respeita os obrigatórios.
  async aplicarPulo(alvo, res) {
    const hoje = App.estado.hoje;
    const ctx = App.ctx();
    const pulados = [];
    if (alvo.tipo === 'assunto') {
      if (!E.CONCLUIDO(ctx.prog[alvo.id].status)) { await Acoes._assunto(alvo.id, Object.assign(E.aoPular(hoje), { obrigatorio: false })); pulados.push(alvo.id); }
      return pulados;
    }
    for (const aid of Object.keys(res.porAssunto)) {
      const x = res.porAssunto[aid];
      const p = ctx.prog[aid];
      if (IDX.assuntos[aid] && p && x.total > 0 && x.erros === 0 && !E.CONCLUIDO(p.status) && !p.obrigatorio) {
        await Acoes._assunto(aid, E.aoPular(hoje));
        pulados.push(aid);
      }
    }
    return pulados;
  },

  async recurso(i, motivo) {
    const q = App.estado.quiz;
    const { id, alvo, token } = q;
    const r = await AI.julgarRecurso({ questao: q.doc.questoes[i], marcada: q.doc.respostas[i], motivo });
    let base = q.doc;
    try { const d = await Banco.lerDoc('simulados/' + id); if (d) base = d; } catch (e) { /* usa o da tela */ }
    const recursosAntes = base.recursos || [];
    if (recursosAntes.some(x => x.q === i) || recursosAntes.length >= E.MAX_RECURSOS) {
      this.atualizar(token, { doc: base });
      return r;
    }
    const anuladas = base.anuladas.slice();
    if (r.deferido) anuladas[i] = true;
    const depois = E.corrigirSimulado(base.questoes, base.respostas, anuladas);
    const novo = Object.assign({}, base, { recursos: recursosAntes.concat([{ q: i, motivo: String(motivo).slice(0, 2000), deferido: r.deferido, justificativa: r.justificativa, em: new Date().toISOString() }]), anuladas, acertos: depois.acertos, aprovado: depois.aprovado });
    await Banco.gravar('simulados/' + id, () => novo);
    let novosPulos = [];
    if (r.deferido) {
      await Acoes.atualizarSimuladoNoDia(base.diaEntrega || base.data, id, { acertos: depois.acertos, aprovado: depois.aprovado });
      if (depois.aprovado) {
        // vale também pra simulado já aprovado: a anulação pode liberar mais assuntos da matéria
        novosPulos = await this.aplicarPulo(alvo, depois);
        const est = this.estadoAlvo(alvo);
        const parcial = { bloqueado: false };
        if (!est.aprovadoEm) parcial.aprovadoEm = App.estado.hoje;
        await this.salvarEstadoAlvo(alvo, parcial);
        if (alvo.tipo === 'assunto') await Acoes._assunto(alvo.id, { obrigatorio: false });
        if (novosPulos.length) Som.tocar('conquista');
      }
    }
    const cur = this.ativo(token);
    if (cur) App.set({ quiz: Object.assign({}, cur, { doc: novo, pulados: [...new Set((cur.pulados || []).concat(novosPulos))] }) });
    Acoes.checarConquistas();
    return r;
  },

  fechar() {
    const q = App.estado.quiz;
    if (q && q.ctl) { try { q.ctl.abort(); } catch (e) { /* ok */ } }
    App.set({ quiz: null });
  },
};

function SimuladoFolha({ alvo }) {

  const podeIA = AI.disponivel();
  const emAndamento = !!est.emAndamento;
  return html`<${Folha} titulo=${'Mini simulado: ' + Simulado.titulo(alvo)} sub=${alvo.tipo === 'materia' ? 'Pular a matéria inteira' : 'Pular este assunto'} onFechar=${() => App.fechar()}>
    <ul class="lista-simples small">

      <li>São <b>3 chances</b>, com 24 horas entre uma e outra. As questões são sempre novas.</li>
